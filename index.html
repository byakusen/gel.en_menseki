<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>円の面積</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Yusei+Magic&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<!-- ============================================================
     6年「円の面積」（zukei_base3 から 作成）
     ※ 土台に 小数点キー（モードに dec:true）を 足して あります
     もとの ひながた：base3 ＝ base1 ＋ 📝テストの 練習 ＋ 音・はなまるの 埋めこみ
     「角の大きさ」アプリ（bundoki63.html）から、どの学年の 図形でも
     つかえる ところだけを 取り出して 作りなおした 土台（base1）に、
     shukuzu1 の「📝 テストの 練習」（test_renshu v1）を 組みこんだものです。
     くわしい つかいかたは 引き継ぎメモ（zukei_base3_hikitsugi.md）を 見てください。
     ============================================================ -->
<style>
  /* ============ 1. 色と ものさし ============ */
  :root{
    --vgap:clamp(4px,1vh,8px);
    --vpad:clamp(5px,1.2vh,9px);
    --vpad-s:clamp(3px,0.8vh,6px);
    --paper:#fbf3e2;
    --paper2:#fff;
    --ink:#34465f;
    --ink-soft:#6a7d96;
    --teal:#1fae9c;
    --teal-d:#138577;
    --coral:#ff7a59;
    --coral-d:#e85d3b;
    --gold:#ffc94d;
    --line:#d8ccae;
    --ok:#2bb673;
    --ng:#ef6b6b;
    --grid:rgba(120,140,170,.10);
    --stack:0;            /* 1＝せまい画面（JSが よむ フラグ） */
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
    color:var(--ink);
    background:
      linear-gradient(var(--grid) 1px,transparent 1px) 0 0/26px 26px,
      linear-gradient(90deg,var(--grid) 1px,transparent 1px) 0 0/26px 26px,
      var(--paper);
    height:100vh;height:100dvh;overflow:hidden;
    display:flex;flex-direction:column;align-items:center;
    padding:8px 10px 8px;
  }
  .wrap{width:100%;max-width:1400px;height:100%;display:flex;flex-direction:column;min-height:0;}

  /* ============ 2. ヘッダー・10問チャレンジ ============ */
  header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px;flex:0 0 auto;}
  h1{
    font-family:"Yusei Magic",sans-serif;font-size:clamp(18px,2.6vw,26px);
    margin:0;color:var(--teal-d);letter-spacing:.5px;text-shadow:2px 2px 0 #fff;
  }
  h1 .pin{color:var(--coral-d);}
  .score{
    background:var(--gold);border:3px solid #fff;box-shadow:0 4px 0 #d9a629;border-radius:16px;
    padding:6px 14px;font-weight:900;font-size:clamp(14px,3.6vw,18px);color:#7a5a10;white-space:nowrap;
  }
  /* チャレンジの CSS は モジュールが <head> の 後ろに 足すので、
     上書きするときは かならず #chal-mount を つけて くわしく書く */
  #chal-mount{flex:1 1 auto;min-width:0;display:flex;justify-content:center;}
  #chal-mount #chal-wrap{flex-wrap:nowrap;gap:8px;}
  #chal-mount .chal-btn{font-family:"Yusei Magic",sans-serif;font-size:clamp(13px,1.7vw,17px);padding:5px 14px;white-space:nowrap;}
  #chal-mount #chal-bar{padding:4px 12px;font-size:clamp(12px,1.5vw,15px);}
  #chal-mount #chal-dots{font-size:clamp(12px,1.6vw,17px);letter-spacing:1px;}
  body #chal-result .chal-card, #chal-result button{font-family:"Yusei Magic",sans-serif;}
  body #chal-result{z-index:1000;}

  /* ============ 3. タブ（JSが 中身を 作る） ============ */
  .gtabs{display:flex;gap:7px;margin-bottom:var(--vgap);flex:0 0 auto;}
  .gtab{
    flex:1 1 0;display:flex;align-items:center;justify-content:center;gap:6px;
    background:#fff;border:3px solid var(--line);border-bottom-width:5px;
    border-radius:16px 16px 8px 8px;padding:var(--vpad) 6px;cursor:pointer;
    font-family:"Yusei Magic",sans-serif;font-size:clamp(14px,2vw,20px);
    color:var(--ink-soft);box-shadow:0 4px 0 #e4dac1;transition:.2s;white-space:nowrap;
  }
  .gtab .tic{font-size:1.1em;}
  .gtab:active{transform:translateY(2px);box-shadow:0 2px 0 #e4dac1;}
  .gtab.active{color:#fff;background:var(--coral);border-color:var(--coral-d);box-shadow:0 4px 0 var(--coral-d);}
  .gtabs.one{display:none;}          /* 親タブが 1つだけの ときは 出さない */
  /* 🧮 3.14の 表 の 親タブ（金色で 目立たせる） */
  #g_g5{color:#8a5a00;background:#ffe27a;border-color:#e8b52e;box-shadow:0 4px 0 #d9a629;}
  #g_g5.active{color:#fff;background:#f2a91c;border-color:#c98f0a;box-shadow:0 4px 0 #c98f0a;}
  .tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:var(--vgap);flex:0 0 auto;justify-content:center;}
  .tab{
    flex:1 1 130px;max-width:300px;display:flex;align-items:center;justify-content:center;gap:5px;
    min-width:62px;background:#fff;border:3px solid var(--line);border-bottom-width:5px;
    border-radius:16px;padding:var(--vpad) 4px;cursor:pointer;
    font-family:"Yusei Magic",sans-serif;font-size:clamp(12px,1.7vw,16px);
    color:var(--ink-soft);box-shadow:0 4px 0 #e4dac1;transition:.2s;white-space:nowrap;
  }
  .tab .tic{font-size:1.15em;}
  .tab .tlab{text-align:center;line-height:1.15;}
  .tab:active{transform:translateY(2px);box-shadow:0 2px 0 #e4dac1;}
  .tab.active{color:#fff;background:var(--teal);border-color:var(--teal-d);box-shadow:0 4px 0 var(--teal-d);}
  .tabs.one{display:none;}           /* 小タブが 1つだけの ときは 出さない */

  /* ============ 4. ステップ（①②③） ============ */
  .steps{display:flex;gap:8px;margin-bottom:var(--vgap);flex:0 0 auto;}
  .step{
    flex:1;display:flex;align-items:center;gap:8px;justify-content:center;
    background:#fff;border:3px solid var(--line);border-radius:14px;
    padding:var(--vpad-s) 6px;font-weight:700;font-size:clamp(11px,1.4vw,14px);
    color:var(--ink-soft);transition:.25s;
  }
  .step .num{
    width:22px;height:22px;border-radius:50%;background:var(--line);color:#fff;
    display:flex;align-items:center;justify-content:center;font-weight:900;font-size:15px;flex:0 0 auto;
  }
  .step.active{border-color:var(--teal);color:var(--teal-d);background:#eafbf8;box-shadow:0 4px 0 #bfeee7;}
  .step.active .num{background:var(--teal);}
  .step.done .num{background:var(--ok);}
  .step.done{border-color:#bfe8d2;color:var(--ok);}

  /* ============ 5. ステージ（キャンバス）と はなまる ============ */
  .stage{
    position:relative;background:var(--paper2);
    border:4px dashed var(--line);border-radius:22px;
    box-shadow:0 8px 0 rgba(0,0,0,.05),0 14px 30px rgba(80,90,120,.10);
    padding:6px;overflow:hidden;
    flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center;
  }
  canvas{display:block;width:auto;height:auto;max-width:100%;max-height:100%;touch-action:none;border-radius:14px;}
  .hanamaru{
    position:absolute;left:50%;top:auto;bottom:2px;
    width:26%;max-width:160px;pointer-events:none;
    transform:translate(-50%,0) scale(0);opacity:0;
    filter:drop-shadow(0 8px 16px rgba(0,0,0,.22));z-index:5;
  }
  .hanamaru.show{animation:hanamaru-pop .6s cubic-bezier(.2,1.3,.4,1) forwards;}
  .hanamaru.fade{animation:hanamaru-fade .5s ease-in forwards;}
  @keyframes hanamaru-fade{0%{transform:translate(-50%,0) scale(1);opacity:1;}100%{transform:translate(-50%,0) scale(.85);opacity:0;}}
  @keyframes hanamaru-pop{
    0%{transform:translate(-50%,0) scale(0) rotate(-28deg);opacity:0;}
    60%{transform:translate(-50%,0) scale(1.15) rotate(7deg);opacity:1;}
    100%{transform:translate(-50%,0) scale(1) rotate(0);opacity:1;}
  }

  /* ============ 6. ガイドと ヒント ============ */
  .guide{
    margin:8px 0 0;background:#fff;border:3px solid var(--teal);
    border-radius:16px;padding:9px 12px;font-weight:700;flex:0 0 auto;
    color:var(--ink);font-size:clamp(13px,1.5vw,17px);line-height:1.45;
    height:calc(2.9em + 28px);overflow:hidden;      /* 1行でも 2行でも 高さは 同じ */
    box-shadow:0 5px 0 #cdeee9;display:flex;gap:10px;align-items:center;
  }
  .guide .ic{font-size:21px;flex:0 0 auto;}
  .guide > #guide{flex:1 1 auto;min-width:0;}
  .hintbtn{
    flex:0 0 auto;display:flex;align-items:center;gap:4px;
    font-family:"Yusei Magic",sans-serif;font-size:clamp(11px,1.2vw,14px);
    color:#8a6d1f;background:#fff5d0;border:2px solid #e8c85a;
    border-radius:999px;padding:5px 11px;cursor:pointer;
    box-shadow:0 3px 0 #e0bb46;transition:.15s;white-space:nowrap;
  }
  .hintbtn:active{transform:translateY(2px);box-shadow:0 1px 0 #e0bb46;}
  .hintbtn.on{color:#fff;background:#e8b52e;border-color:#c9991f;box-shadow:0 3px 0 #c9991f;}
  .guide.hinting{border-color:#e8c85a;box-shadow:0 5px 0 #f0e0aa;background:#fffdf3;}
  @media (max-width:1099px){
    .hintbtn > span{display:none;}
    .hintbtn{padding:5px 9px;font-size:16px;}
  }
  ruby rt{font-size:.55em;color:var(--ink-soft);font-weight:700;}
  /* 3.14 の 表（🧮 ボタン・モードに tbl:true）。図の 上に かさねて 出す */
  #tblBtn{display:none;}
  .pitbl{position:absolute;inset:6px;z-index:6;display:none;align-items:center;justify-content:center;gap:clamp(10px,3vw,40px);
    background:rgba(255,253,243,.97);border:3px solid #e8c85a;border-radius:16px;padding:10px 14px;overflow:auto;
    font-family:"Yusei Magic",sans-serif;color:var(--ink);}
  .pitbl.open{display:flex;}
  .pitbl table{border-collapse:collapse;font-size:clamp(13px,min(2.4vh,1.6vw),21px);}
  .pitbl th{color:#8a6d1f;padding:0 8px 4px;font-weight:400;font-size:1.05em;white-space:nowrap;}
  .pitbl td{padding:1px 6px;border-bottom:2px dashed #f0e0aa;white-space:nowrap;}
  .pitbl td.v{text-align:right;color:var(--coral-d);}
  .pitbl .x{position:absolute;top:6px;right:8px;background:#fff;color:var(--ink-soft);border:2px solid var(--line);
    border-radius:12px;padding:2px 10px;font-size:16px;box-shadow:none;}

  /* ============ 7. 問題文・こたえ欄・テンキー・選択肢 ============ */
  .drawprompt{
    margin:0 0 var(--vgap);text-align:center;
    background:#fff;border:3px solid var(--coral);border-radius:16px;
    box-shadow:0 5px 0 #f5c4b5;padding:var(--vpad) 10px;
    font-family:"Yusei Magic",sans-serif;font-size:clamp(14px,min(2.4vw,3.4vh),24px);color:var(--ink);
  }
  .drawprompt b{color:var(--coral-d);font-size:1.3em;margin-left:4px;}
  .answer{display:flex;gap:10px;align-items:stretch;margin-top:var(--vgap);flex-wrap:wrap;}
  .answer .field{
    flex:1 1 150px;display:flex;align-items:center;gap:8px;
    background:#fff;border:3px solid var(--coral);border-radius:16px;
    padding:var(--vpad-s) 10px var(--vpad-s) 14px;box-shadow:0 5px 0 #f5c4b5;
  }
  .answer label{font-weight:900;font-size:clamp(15px,4vw,19px);white-space:nowrap;color:var(--coral-d);}
  #ans{
    flex:1;min-width:60px;border:none;outline:none;background:transparent;
    font-family:"Yusei Magic",sans-serif;font-size:clamp(18px,4.6vh,34px);
    color:var(--ink);text-align:center;width:100%;
  }
  .unit{font-weight:900;font-size:clamp(18px,5vw,26px);color:var(--ink-soft);white-space:nowrap;}
  .unit.deg{font-size:clamp(30px,8vw,44px);line-height:1;align-self:center;}
  /* しき欄（式を 入力する モード） */
  #exprBox{display:none;}
  #exprBox .field{justify-content:flex-start;}
  #exprText{flex:1 1 auto;min-width:0;text-align:center;white-space:nowrap;
    font-family:"Yusei Magic",sans-serif;font-size:clamp(20px,4.8vh,36px);color:var(--ink);}
  #exprText .ph{color:#b5bfcc;}
  #exprText .opc{color:#e85d3b;margin:0 .12em;}
  #exprText.done{color:var(--ok);}
  .ansrow{display:flex;align-items:center;gap:10px;margin-top:var(--vgap);}
  .ansrow > .answer{margin-top:0;flex:1 1 0;min-width:0;}
  .ansrow > #subArea{margin-top:0;flex:0 0 calc((100% - 38px)/3 + 12px);}   /* テンキー1列ぶん */
  .ansrow.expr > .answer#ansBox{display:none;}
  .ansrow.expr > #exprBox{display:block;margin-top:0;flex:1 1 0;min-width:0;}
  .ansrow .answer .field{flex:1 1 auto;min-width:0;padding-left:10px;gap:4px;}
  .ansrow #ans{min-width:40px;}
  /* 自由に つかえる 小さな わく（ひっ算・ヒョウなど） */
  #subArea{display:none;}
  .subbox{
    background:#fff;border:3px solid var(--teal);border-radius:16px;
    box-shadow:0 5px 0 #cdeee9;padding:6px 10px;text-align:center;
    font-family:"Yusei Magic",sans-serif;font-size:clamp(15px,3.4vh,26px);color:var(--ink);
  }
  .numpad{
    display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(4,1fr);gap:7px;
    margin-top:var(--vgap);background:#e7f5fd;border:3px solid #cbe7f7;
    border-radius:18px;padding:9px;
    flex:1 1 auto;min-height:0;max-height:min(46vh,430px);
    box-shadow:inset 0 2px 8px rgba(120,170,200,.18);
  }
  .key{
    font-family:"Yusei Magic",sans-serif;font-size:clamp(20px,4.4vh,32px);
    color:#1f9bd6;background:#fff;border:none;border-radius:14px;
    min-height:0;box-shadow:0 4px 0 #cfe7f4;
    display:flex;align-items:center;justify-content:center;
  }
  .key:active{transform:translateY(3px);box-shadow:0 1px 0 #cfe7f4;}
  .key.del{color:#7fb0d0;background:#f1f8fd;font-size:clamp(18px,3.8vh,27px);}
  .key.ok{color:#fff;background:linear-gradient(#42b2ee,#1f8fd6);box-shadow:0 4px 0 #1773b0;font-size:clamp(18px,3.8vh,27px);}
  .key.ok:active{box-shadow:0 1px 0 #1773b0;}
  .key.op{display:none;color:#e85d3b;background:#fff4ef;box-shadow:0 4px 0 #f6d3c6;}
  .key.op:active{box-shadow:0 1px 0 #f6d3c6;}
  /* 記号キーを つかう モードは 4列に して、右の列に 記号・⌫・OK を おく。
     記号が 1つでも ずれないように、数字の ばしょも きめておく */
  .numpad.ops{grid-template-columns:repeat(4,1fr);}
  .numpad.ops .key.op.use{display:flex;grid-column:4;}
  .numpad.ops .key[data-d="1"]{grid-area:1/1;}
  .numpad.ops .key[data-d="2"]{grid-area:1/2;}
  .numpad.ops .key[data-d="3"]{grid-area:1/3;}
  .numpad.ops .key[data-d="4"]{grid-area:2/1;}
  .numpad.ops .key[data-d="5"]{grid-area:2/2;}
  .numpad.ops .key[data-d="6"]{grid-area:2/3;}
  .numpad.ops .key[data-d="7"]{grid-area:3/1;}
  .numpad.ops .key[data-d="8"]{grid-area:3/2;}
  .numpad.ops .key[data-d="9"]{grid-area:3/3;}
  .numpad.ops #npdel{grid-area:3/4;}
  .numpad.ops .key[data-d="0"]{grid-column:1 / 4;grid-row:4;}
  .numpad.ops #npok{grid-area:4/4;}
  /* 小数点キー（モードに dec:true）。記号が ない ときは 3列×5だん */
  .key.op.dot{color:#1f9bd6;background:#fff;box-shadow:0 4px 0 #cfe7f4;}
  .numpad.dec .key.op.dot{display:flex;}
  .numpad.ops.dec .key[data-d="0"]{grid-column:1 / 3;grid-row:4;}
  .numpad.ops.dec .key.dot{grid-area:4/3;}
  /* 3.14 キー（モードに pi:true・式を 入れる モード）。いちばん 下の だんを 0｜．｜3.14｜OK に する */
  .key.op.pi{color:#1f9bd6;background:#fff;box-shadow:0 4px 0 #cfe7f4;font-size:clamp(16px,3.4vh,26px);}
  .numpad.pi .key.op.pi{display:flex;}
  .numpad.ops.dec.pi .key[data-d="0"]{grid-column:1 / 2;grid-row:4;}
  .numpad.ops.dec.pi .key.dot{grid-area:4/2;}
  .numpad.ops.dec.pi .key.pi{grid-area:4/3;}
  .numpad.noop{grid-template-rows:repeat(5,1fr);}
  .numpad.noop .key[data-d="1"]{grid-area:1/1;}
  .numpad.noop .key[data-d="2"]{grid-area:1/2;}
  .numpad.noop .key[data-d="3"]{grid-area:1/3;}
  .numpad.noop .key[data-d="4"]{grid-area:2/1;}
  .numpad.noop .key[data-d="5"]{grid-area:2/2;}
  .numpad.noop .key[data-d="6"]{grid-area:2/3;}
  .numpad.noop .key[data-d="7"]{grid-area:3/1;}
  .numpad.noop .key[data-d="8"]{grid-area:3/2;}
  .numpad.noop .key[data-d="9"]{grid-area:3/3;}
  .numpad.noop .key[data-d="0"]{grid-area:4/1;}
  .numpad.noop .key.dot{grid-area:4/2;}
  .numpad.noop #npdel{grid-area:4/3;}
  .numpad.noop #npok{grid-area:5/1/6/4;}
  .choices{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:8px;}
  .choice{
    font-family:"Yusei Magic",sans-serif;font-size:clamp(22px,5.4vh,40px);
    color:var(--teal-d);background:#fff;border:4px solid var(--teal);border-radius:20px;
    min-height:clamp(58px,12vh,104px);box-shadow:0 6px 0 #bfeee7;cursor:pointer;
    display:flex;align-items:center;justify-content:center;padding:4px;
    transition:transform .05s,box-shadow .05s,background .15s,border-color .15s,color .15s;
  }
  .choice:active{transform:translateY(3px);box-shadow:0 2px 0 #bfeee7;}
  .choice.correct{color:#fff;background:var(--ok);border-color:#1f9e60;box-shadow:0 6px 0 #1f9e60;animation:choice-pop .4s cubic-bezier(.2,1.3,.4,1);}
  .choice.wrong{color:#fff;background:var(--ng);border-color:#d94f4f;box-shadow:0 6px 0 #d94f4f;animation:choice-shake .35s;}
  .choice.locked{opacity:.55;pointer-events:none;}
  .choice.correct.locked{opacity:1;}
  @keyframes choice-pop{0%{transform:scale(.9);}60%{transform:scale(1.08);}100%{transform:scale(1);}}
  @keyframes choice-shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-7px);}75%{transform:translateX(7px);}}

  /* ============ 8. ボタン・けっか・せっていパネル ============ */
  button{
    font-family:"Zen Maru Gothic",sans-serif;font-weight:900;cursor:pointer;
    border:none;border-radius:16px;color:#fff;transition:transform .05s,box-shadow .05s;
  }
  button:active{transform:translateY(3px);}
  .row2{display:flex;gap:8px;margin-top:var(--vgap);flex-wrap:wrap;flex:0 0 auto;}
  .btn-next{flex:1;background:var(--teal);box-shadow:0 5px 0 var(--teal-d);font-size:clamp(14px,2vw,19px);padding:clamp(7px,1.6vh,11px);}
  .btn-next:active{box-shadow:0 2px 0 var(--teal-d);}
  .btn-redo{flex:0 0 auto;background:#9aa7bb;box-shadow:0 5px 0 #76839a;font-size:clamp(13px,1.8vw,17px);padding:clamp(7px,1.6vh,11px) 14px;}
  .btn-redo:active{box-shadow:0 2px 0 #76839a;}
  .btn-cfg{flex:0 0 auto;background:#fff;color:var(--ink-soft);border:3px solid var(--line);
    box-shadow:0 5px 0 #e4dac1;font-size:17px;padding:clamp(6px,1.4vh,9px) 13px;}
  .btn-cfg:active{box-shadow:0 2px 0 #e4dac1;}
  .result{
    margin-top:var(--vgap);text-align:center;font-family:"Yusei Magic",sans-serif;
    font-size:clamp(14px,4vh,30px);min-height:1.2em;transition:.2s;flex:0 0 auto;
  }
  .result.ok{color:var(--ok);}
  .result.ng{color:var(--ng);}
  .result.small{font-size:clamp(13px,3.2vh,24px);}
  .cfg{margin-top:8px;background:#fff;border:3px solid var(--line);border-radius:16px;padding:11px 13px;display:none;flex:0 0 auto;}
  .cfg.open{display:block;}
  .cfg h3{margin:0 0 6px;font-size:15px;color:var(--ink-soft);}
  .cfg p{margin:0 0 12px;font-size:12px;color:var(--ink-soft);line-height:1.5;}
  .cfg .ctl{display:flex;align-items:center;gap:10px;margin:9px 0;font-size:13px;font-weight:700;}
  .cfg .ctl label{flex:0 0 110px;}
  .cfg input[type=range]{flex:1;accent-color:var(--teal);}
  .cfg .val{flex:0 0 52px;text-align:right;color:var(--teal-d);font-weight:900;}
  .cfg .checks{display:flex;gap:18px;flex-wrap:wrap;margin-top:6px;font-size:13px;font-weight:700;}
  .cfg .checks label{display:flex;align-items:center;gap:6px;cursor:pointer;}
  .footnote{text-align:center;color:var(--ink-soft);font-size:10px;margin-top:8px;line-height:1.5;flex:0 0 auto;}

  /* ============ 8-2. しゅるいの 切りかえ（.seg）・テストの 練習の ならび ============ */
  /* ctlHtml に <div class="seg"><button data-m="…">…</button></div> と 書くと この 見た目。
     .seg は「問題の しゅるいを かえる ボタン」の しるし。テスト中は 押せなく なる。 */
  #ctlRow{flex:0 0 auto;}
  .seg{display:flex;gap:6px;justify-content:center;margin-top:var(--vgap);flex-wrap:wrap;}
  .seg button{flex:0 1 auto;min-width:96px;background:#fff;color:var(--ink-soft);border:3px solid var(--line);
    box-shadow:0 3px 0 #e4dac1;border-radius:14px;font-size:clamp(13px,1.7vw,16px);padding:5px 14px;}
  .seg button.on{background:var(--teal);color:#fff;border-color:var(--teal-d);box-shadow:0 3px 0 var(--teal-d);}
  body.testing .seg{pointer-events:none;opacity:.45;}
  /* テストの ボタン（#test-mount）は JS が #chal-mount の 右に 足す。
     テスト中は チャレンジが かくれるので、帯を まん中に よせる */
  header #test-mount{flex:0 0 auto;}
  body.testing header #test-mount{flex:1 1 auto;justify-content:center;}
  /* 円の面積で 足した 部品：分ける数の ボタン（.seg2 は テスト中も 押せる）・選択肢・問題文 */
  .seg2{display:flex;gap:6px;justify-content:center;align-items:center;margin-top:var(--vgap);flex-wrap:wrap;}
  .seg2 .lab{font-weight:900;font-size:clamp(12px,1.5vw,15px);color:var(--ink-soft);}
  .seg2 button{flex:0 1 auto;min-width:58px;background:#fff;color:var(--ink-soft);border:3px solid var(--line);
    box-shadow:0 3px 0 #e4dac1;border-radius:14px;font-size:clamp(13px,1.7vw,16px);padding:5px 12px;}
  .seg2 button.on{background:var(--teal);color:#fff;border-color:var(--teal-d);box-shadow:0 3px 0 var(--teal-d);}
  .seg2 button.go{background:var(--coral);color:#fff;border-color:var(--coral-d);box-shadow:0 3px 0 var(--coral-d);}
  .seg2 button.nx{background:#e8b52e;color:#fff;border-color:#c9991f;box-shadow:0 3px 0 #c9991f;animation:nx-pulse 1.1s ease-in-out infinite;}
  @keyframes nx-pulse{0%,100%{transform:scale(1);}50%{transform:scale(1.08);}}
  .choice .cs{font-size:.62em;line-height:1.25;}
  .choice .cm{font-size:.78em;white-space:nowrap;}
  #choices.tate{grid-template-columns:1fr !important;gap:9px;}
  #choices.tate .choice{min-height:clamp(46px,8.5vh,76px);}
  #choices.wait .choice{opacity:.35;filter:grayscale(.7);pointer-events:none;box-shadow:none;}   /* 図が 動いている あいだは 押せない */
  #promptText .pf{font-size:.8em;}
  #promptText .pq{font-size:.72em;line-height:1.4;}
  #promptText .fm{display:block;font-size:.56em;color:var(--ink);line-height:1.55;}
  #promptText .fm.arr{color:var(--ink-soft);line-height:1.1;}
  #promptText .ft{color:#d63ad6;}
  #promptText .fy{color:#1fb05a;}
  #promptText .hl{background:#ffc9c0;border-radius:5px;padding:0 3px;}
  #promptText .sq{display:inline-block;min-width:2.4em;height:1em;vertical-align:-0.1em;border:2px dashed var(--line);border-radius:6px;}
  #promptText .fin{display:inline-block;margin-top:4px;background:#fff36b;border:3px solid #e8b52e;border-radius:12px;padding:2px 10px;}

  /* ============ 9. 2カラム（ひろい画面） ============ */
  .main{display:flex;gap:12px;flex:1 1 auto;min-height:0;width:100%;}
  .col-l{flex:1 1 auto;display:flex;flex-direction:column;min-width:0;min-height:0;}
  .col-r{flex:0 0 clamp(268px,36%,440px);display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden;position:relative;}
  #inputArea{flex:1 1 auto;min-height:0;flex-direction:column;}   /* 出すときは flex！ */
  #inputArea > .ansrow{flex:0 0 auto;}
  .col-r > .result{margin-top:auto;}
  .col-r > .cfg.open{position:absolute;left:0;right:0;bottom:0;z-index:20;max-height:100%;overflow-y:auto;margin:0;box-shadow:0 -6px 20px rgba(80,90,120,.22);}
  .col-r > .footnote{display:none;}

  /* ============ 10. 1カラム（スマホ・せまい画面） ============ */
  @media (max-width:699px){
    header{flex-wrap:wrap;row-gap:6px;}
    #chal-mount{order:3;flex:1 1 100%;}
    #chal-mount #chal-wrap{flex-wrap:nowrap;justify-content:center;gap:6px;}
    #chal-mount .chal-btn{font-size:13px;padding:4px 10px;}
    #chal-mount #chal-bar{padding:3px 9px;gap:6px;font-size:12px;}
    #chal-mount #chal-dots{font-size:11px;letter-spacing:0;}
    body #chal-result .chal-title{font-size:1.4rem;white-space:nowrap;}
    body #chal-result .chal-card{padding:22px 20px;}
    :root{--stack:1;--vgap:9px;--vpad:9px;--vpad-s:6px;}
    body{height:auto;min-height:100vh;overflow:visible;padding:14px 12px 28px;}
    .wrap{height:auto;max-width:680px;display:block;}
    .main{display:block;}
    .col-l,.col-r{display:block;flex:none;overflow:visible;min-height:0;}
    .stage{display:block;flex:none;padding:8px;}
    canvas{width:100%;height:auto;max-width:none;max-height:none;}
    h1{font-size:clamp(20px,5.4vw,30px);}
    .tab{flex:1 1 30%;max-width:none;min-width:70px;padding:11px 4px;font-size:clamp(13px,3.6vw,19px);}
    .tab .tsub{display:block;font-size:.85em;}
    .gtab{padding:11px 4px;font-size:clamp(14px,4vw,20px);}
    .step{padding:8px 6px;font-size:clamp(11px,3vw,14px);}
    .guide{margin:12px 0 6px;padding:10px 14px;font-size:clamp(14px,3.8vw,18px);height:auto;overflow:visible;}
    .choice{min-height:clamp(78px,20vw,110px);font-size:clamp(26px,8vw,44px);}
    .key{min-height:clamp(48px,12vw,70px);font-size:clamp(24px,7vw,34px);}
    .key.del,.key.ok{font-size:clamp(22px,6vw,30px);}
    .drawprompt{margin:2px 0 10px;padding:14px 12px;font-size:clamp(18px,5vw,26px);}
    #ans{font-size:clamp(26px,7vw,36px);}
    #exprText{font-size:clamp(26px,7vw,36px);}
    .result{font-size:clamp(22px,6.5vw,34px);}
    .col-r > .footnote{display:block;margin-top:14px;}
    .hintbtn > span{display:inline;}
    .hintbtn{padding:6px 12px;font-size:14px;}
    .col-r > .result{margin-top:8px;}
    .numpad{max-height:none;grid-template-rows:none;}
    #inputArea{flex:none;}
    .col-r > .cfg.open{position:static;max-height:none;overflow:visible;margin-top:8px;box-shadow:none;}
    /* テストの 練習：1だんめ＝題名と せいかい、2だんめ＝チャレンジと テストの ボタン */
    header::after{content:"";order:2;flex:0 0 100%;height:0;}
    #chal-mount{flex:1 1 auto;}
    header #test-mount{order:4;}
    #test-btn{font-size:13px !important;padding:4px 10px !important;}
    #test-bar{font-size:12px !important;gap:5px !important;}
    .seg button{min-width:0;flex:1 1 0;font-size:clamp(14px,3.8vw,17px);padding:8px 6px;}
    .seg2 button{font-size:clamp(14px,3.8vw,17px);padding:8px 9px;min-width:0;}
    #choices.tate .choice{min-height:clamp(56px,14vw,80px);}
    .gtabs{flex-wrap:wrap;}                      /* 親タブが 4つ：せまい 画面では 2つずつ 2だんに */
    .pitbl{justify-content:flex-start;align-items:flex-start;flex-wrap:wrap;gap:8px 16px;padding:8px;}
    .pitbl table{font-size:clamp(12px,3.4vw,16px);}
    .gtab{flex:1 1 40%;}
    /* ★新しい 部品を 足したら、ここに 1カラム用の もどし指定を 書く */
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="title"></h1>
    <div id="chal-mount"></div><!-- 10問チャレンジの ボタンと 帯 -->
    <div class="score" id="score">せいかい 0</div>
  </header>

  <div class="gtabs" id="gtabs"></div><!-- 親タブ（JSが 作る） -->
  <div class="tabs"  id="subTabs"></div><!-- 小タブ（JSが 作る） -->

  <div class="main">
    <!-- 左：図（キャンバス） -->
    <div class="col-l">
      <div class="steps" id="stepsRow" style="display:none;"></div>
      <div class="stage">
        <canvas id="cv"></canvas>
        <img id="hanamaru" alt="はなまる" class="hanamaru">

      </div>
      <div id="ctlRow" style="display:none;"></div><!-- 図を そうさする ボタンを 足す ところ -->
      <div class="guide" id="guideBox">
        <span class="ic" id="gic">🖐️</span>
        <span id="guide"></span>
        <button class="hintbtn" id="hintBtn" title="ヒントを 見る">💡<span>ヒント</span></button>
        <button class="hintbtn" id="tblBtn" title="3.14の 表を 見る">🧮<span>3.14の 表</span></button>
      </div>
    </div>

    <!-- 右：もんだい・こたえ・テンキー -->
    <div class="col-r">
      <div id="promptArea" style="display:none;">
        <div class="drawprompt"><b id="promptText"></b></div>
      </div>

      <div id="choiceArea" style="display:none;">
        <div class="choices" id="choices"></div>
      </div>

      <div id="inputArea" style="display:none;">

          </div>

              <label>しき</label>
              <span id="exprText"></span>
            </div>

        <div class="numpad" id="numpad">
          <button class="key op" data-op="＋">＋</button>
          <button class="key op" data-op="−">−</button>
          <button class="key op" data-op="×">×</button>
          <button class="key op" data-op="÷">÷</button>
          <button class="key op dot" data-op=".">．</button>
          <button class="key op pi" data-op="3.14">3.14</button>
          <button class="key" data-d="1">1</button>
          <button class="key" data-d="2">2</button>
          <button class="key" data-d="3">3</button>
          <button class="key" data-d="4">4</button>
          <button class="key" data-d="5">5</button>
          <button class="key" data-d="6">6</button>
          <button class="key" data-d="7">7</button>
          <button class="key" data-d="8">8</button>
          <button class="key" data-d="9">9</button>

          <button class="key ok" id="npok">OK</button>

      </div>

      <div class="result" id="result"></div>

      <div class="row2">
        <button class="btn-next" id="next">▶ つぎの もんだい</button>
        <button class="btn-redo" id="redo">やりなおす</button>
        <button class="btn-cfg" id="cfgbtn" title="せってい">🔧</button>

      <div class="cfg" id="cfg">
        <h3>🔧 せってい</h3>
        <p>先生が つかう ちょうせいを ここに ふやします。</p>
        <div class="checks">
          <label><input type="checkbox" id="cfgSound" checked> 音を 鳴らす</label>
        </div>
        <div id="cfgExtra"></div><!-- アプリごとの ちょうせいを 足す ところ -->
      </div>

      <div class="footnote" id="footnote"></div>
    </div>
  </div>
</div>

<!-- ============================================================
     10問チャレンジ（challenge10.js をそのまま）— さわらない
     ============================================================ -->
<script>
(function (global) {
    'use strict';
    var CSS = `
    .chal-btn {
        font-size: 1rem; font-weight: bold; color: #6a1b9a;
        background: #f3e5f5; border: 2px solid #ce93d8; border-radius: 20px;
        padding: 7px 16px; box-shadow: 0 2px 0 #ce93d8; cursor: pointer;
        font-family: inherit;
    }
    .chal-btn.on { color: #fff; background: #8e24aa; border-color: #6a1b9a; box-shadow: 0 2px 0 #4a148c; }
    .chal-btn:focus-visible, .chal-btns button:focus-visible { outline: 3px solid #8e24aa; outline-offset: 2px; }
    #chal-bar {
        display: none; align-items: center; gap: 10px;
        background: rgba(255,255,255,0.9); border-radius: 20px; padding: 6px 16px;
        box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        font-weight: bold; color: #6a1b9a; white-space: nowrap;
    }
    #chal-dots { color: #8e24aa; letter-spacing: 2px; font-size: 1.05rem; }
    #chal-wrap { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    #chal-result {
        display: none; position: fixed; left: 0; top: 0; right: 0; bottom: 0;
        background: rgba(0,0,0,0.45); z-index: 900;
        align-items: center; justify-content: center;
    }
    #chal-result.show { display: flex; }
    .chal-card {
        background: #fff; border-radius: 20px; padding: 28px 34px;
        box-shadow: 0 10px 40px rgba(0,0,0,0.3); text-align: center; max-width: 90vw;
    }
    .chal-title { font-size: 1.8rem; font-weight: bold; color: #8e24aa; margin-bottom: 14px; }
    .chal-lines { font-size: 1.25rem; font-weight: bold; color: #333; line-height: 2; }
    .chal-lines b { color: #e53935; font-size: 1.5rem; }
    .chal-msg { margin-top: 10px; color: #ff6f00; }
    .chal-best { margin-top: 6px; font-size: 1rem; color: #6a1b9a; }
    .chal-btns { display: flex; gap: 12px; justify-content: center; margin-top: 20px; }
    .chal-btns button {
        padding: 12px 20px; font-size: 1.1rem; font-weight: bold; font-family: inherit;
        border-radius: 14px; cursor: pointer; border: none;
    }
    #btn-chal-again { color: #fff; background: #8e24aa; box-shadow: 0 3px 0 #4a148c; }
    #btn-chal-quit  { color: #6a1b9a; background: #f3e5f5; border: 2px solid #ce93d8; }
    @media (prefers-reduced-motion: reduce) { .chal-btn, .chal-btns button { transition: none; } }
    `;
    var BAR_HTML =
        '<button id="btn-challenge" class="chal-btn" type="button"></button>' +
        '<div id="chal-bar"><span id="chal-dots"></span><span id="chal-count"></span></div>';
    var RESULT_HTML =
        '<div class="chal-card">' +
        '  <div class="chal-title">🏁 <span id="chal-total-title"></span>問 できました！</div>' +
        '  <div class="chal-lines" id="chal-lines"></div>' +
        '  <div class="chal-btns">' +
        '    <button id="btn-chal-again" type="button">もう一度チャレンジ</button>' +
        '    <button id="btn-chal-quit" type="button">やめる</button>' +
        '  </div>' +
        '</div>';
    var cfg = null;
    var chal = { on: false, total: 10, no: 0, miss: 0, missNow: 0, perfect: 0, t0: 0 };
    var $ = function (id) { return document.getElementById(id); };
    function todayKey() {
        var d = new Date();
        return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate();
    }
    function loadBest() {
        if (!cfg.record) return null;
        try {
            var raw = localStorage.getItem(cfg.recordKey);
            if (!raw) return null;
            var o = JSON.parse(raw);
            return (o && o.day === todayKey() && o.total === chal.total) ? o : null;
        } catch (e) { return null; }
    }
    function saveBest(perfect, sec) {
        if (!cfg.record) return null;
        var best = loadBest();
        if (best && (best.perfect > perfect || (best.perfect === perfect && best.sec <= sec))) return best;
        var o = { day: todayKey(), perfect: perfect, sec: sec, total: chal.total };
        try { localStorage.setItem(cfg.recordKey, JSON.stringify(o)); } catch (e) { }
        return o;
    }
    function chalUpdateBar() {
        $('btn-challenge').classList.toggle('on', chal.on);
        $('chal-bar').style.display = chal.on ? 'flex' : 'none';
        if (!chal.on) return;
        var dots = '';
        for (var i = 0; i < chal.total; i++) dots += (i < chal.no) ? '●' : '○';
        $('chal-dots').innerText = dots;
        $('chal-count').innerText = Math.min(chal.no + 1, chal.total) + '問め / ' + chal.total;
    }
    function chalReset() {
        chal.no = 0; chal.miss = 0; chal.missNow = 0; chal.perfect = 0; chal.t0 = Date.now();
        $('chal-result').classList.remove('show');
        chalUpdateBar();
    }
    function chalDone() {
        if (!chal.on) return;
        if (chal.missNow === 0) chal.perfect++;
        chal.no++;
        chalUpdateBar();
        if (chal.no < chal.total) {
            setTimeout(function () {
                if (!chal.on) return;
                chal.missNow = 0;
                if (cfg.next) cfg.next();
            }, cfg.nextDelay);
            return;
        }
        var sec = Math.floor((Date.now() - chal.t0) / 1000);
        var msg = (chal.perfect === chal.total) ? 'ぜんぶノーミス！ すばらしい！'
                : (chal.perfect >= chal.total - 2) ? 'よくがんばりました！'
                : 'つぎは もっとできる！';
        var best = saveBest(chal.perfect, sec);
        var result = { perfect: chal.perfect, miss: chal.miss, sec: sec, total: chal.total };
        setTimeout(function () {
            $('chal-total-title').innerText = chal.total;
            $('chal-lines').innerHTML =
                '<div>ノーミスでできた問題　<b>' + chal.perfect + '</b> / ' + chal.total + '</div>' +
                '<div>まちがえた回数　<b>' + chal.miss + '</b> 回</div>' +
                '<div>かかった時間　<b>' + Math.floor(sec / 60) + '</b> 分 <b>' + (sec % 60) + '</b> 秒</div>' +
                '<div class="chal-msg">' + msg + '</div>' +
                (best ? '<div class="chal-best">きょうの最高記録　ノーミス ' + best.perfect + ' / ' + best.total +
                        ' 問　　' + Math.floor(best.sec / 60) + '分' + (best.sec % 60) + '秒</div>' : '');
            $('chal-result').classList.add('show');
            $('btn-chal-again').focus();
            if (cfg.onFinish) cfg.onFinish(result);
        }, cfg.resultDelay);
    }
    function init(opt) {
        opt = opt || {};
        cfg = {
            total: opt.total || 10,
            next: opt.next || null,
            nextDelay: (opt.nextDelay === undefined) ? 1800 : opt.nextDelay,
            resultDelay: (opt.resultDelay === undefined) ? 1500 : opt.resultDelay,
            label: opt.label || '🏁 10問チャレンジ',
            sound: opt.sound || null,
            onToggle: opt.onToggle || null,
            onFinish: opt.onFinish || null,
            record: !!opt.record,
            recordKey: opt.recordKey || 'challenge10',
            css: (opt.css === undefined) ? true : opt.css
        };
        chal.total = cfg.total;
        if (opt.label === undefined && cfg.total !== 10) cfg.label = '🏁 ' + cfg.total + '問チャレンジ';
        if (cfg.css && !$('chal-style')) {
            var st = document.createElement('style');
            st.id = 'chal-style';
            st.textContent = CSS;
            document.head.appendChild(st);
        }
        var host = (typeof opt.mount === 'string') ? document.querySelector(opt.mount) : opt.mount;
        var wrap = $('chal-wrap');
        if (!wrap) {
            wrap = document.createElement('div');
            wrap.id = 'chal-wrap';
            wrap.innerHTML = BAR_HTML;
            if (host) host.appendChild(wrap);
            else document.body.insertBefore(wrap, document.body.firstChild);
        }
        if (!$('chal-result')) {
            var res = document.createElement('div');
            res.id = 'chal-result';
            res.innerHTML = RESULT_HTML;
            document.body.appendChild(res);
        }
        $('btn-challenge').innerText = cfg.label;
        $('btn-challenge').addEventListener('click', function () {
            chal.on = !chal.on;
            if (cfg.sound) cfg.sound();
            chalReset();
            if (cfg.onToggle) cfg.onToggle(chal.on);
            if (cfg.next) cfg.next();
        });
        $('btn-chal-again').addEventListener('click', function () {
            chalReset();
            if (cfg.next) cfg.next();
        });
        $('btn-chal-quit').addEventListener('click', function () {
            chal.on = false;
            chalReset();
            if (cfg.onToggle) cfg.onToggle(false);
            if (cfg.next) cfg.next();
        });
        chalUpdateBar();
        return API;
    }
    var API = {
        init: init,

/* ---- えかきの 道具（角度は ctx と 同じ：右が 0・時計まわり） ---- */
const COL = { fillY:'#fff2a8', lineR:'#e85d3b', pink:'#f7b6cf', blue:'#9cc3f0',
              orange:'#f6a35c', green:'#bfe7a8', sky:'#d6ecff' };
function pie(c, R, a0, a1, o){
  o = o || {};
  ctx.beginPath();
  const full = Math.abs(a1-a0) >= Math.PI*2-1e-6;
  if(!full) ctx.moveTo(c.x, c.y);
  ctx.arc(c.x, c.y, R, a0, a1);
  ctx.closePath();
  if(o.fill){ ctx.fillStyle=o.fill; ctx.fill(); }
  if(o.stroke){
    ctx.setLineDash(o.dash||[]); ctx.lineWidth=o.lw||3; ctx.strokeStyle=o.stroke; ctx.lineJoin='round';
    ctx.stroke(); ctx.setLineDash([]);
  }
}
function arcLine(c, R, a0, a1, o){
  o = o || {};
  ctx.beginPath(); ctx.arc(c.x, c.y, R, a0, a1);
  ctx.setLineDash(o.dash||[]); ctx.lineWidth=o.lw||3; ctx.strokeStyle=o.color||C.ink; ctx.lineCap='round';
  ctx.stroke(); ctx.setLineDash([]);
}
function rightMark(p, u, v, s){       // 直角の しるし。u・v は 2つの 辺の むき
  s = s || 12;
  drawPoly([{x:p.x+u.x*s, y:p.y+u.y*s}, {x:p.x+u.x*s+v.x*s, y:p.y+u.y*s+v.y*s}, {x:p.x+v.x*s, y:p.y+v.y*s}],
           { stroke:C.ink, lw:1.5, open:true });
}
function boxR(x, y, w, h, r, fill, stroke){
  ctx.beginPath();
  ctx.moveTo(x+r, y); ctx.arcTo(x+w, y, x+w, y+h, r); ctx.arcTo(x+w, y+h, x, y+h, r);
  ctx.arcTo(x, y+h, x, y, r); ctx.arcTo(x, y, x+w, y, r); ctx.closePath();
  if(fill){ ctx.fillStyle=fill; ctx.fill(); }
  if(stroke){ ctx.lineWidth=2.5; ctx.strokeStyle=stroke; ctx.stroke(); }
}
/* おうぎ形 1まい。psi＝先から 弧の まん中への むき（上が 0・時計まわり） */
function sector(A, R, psi, al, fill, lw, stroke){
  ctx.beginPath(); ctx.moveTo(A.x, A.y);
  ctx.arc(A.x, A.y, R, psi-al/2-Math.PI/2, psi+al/2-Math.PI/2);
  ctx.closePath();
  ctx.fillStyle=fill; ctx.fill();
  ctx.lineWidth=lw; ctx.lineJoin='round'; ctx.strokeStyle=stroke||'rgba(52,70,95,.75)'; ctx.stroke();
}
/* 円・半円・4分の1円の 図。part:'en'|'han'|'yon'  lab:'r'（半径）|'d'（直径） */
function circleScene(lines, col, part, lab, val, o){
  o = o || {};
  drawPrompt(lines, col);
  const rg  = o.rg || regionUnder(lines.length, 0.08, 0.92, 0.96);   // o.rg：図を おく わくを 指定（式を つくる タブ）
  const box = part==='en'  ? [{x:-1,y:-1},{x:1,y:1}]
            : part==='han' ? [{x:-1,y:-1},{x:1,y:0.3}]
            :                [{x:-1,y:-1},{x:0.5,y:0.1}];
  const f = fitTo(box, rg, 30);
  const c = f.tf({x:0,y:0}), R = f.s;
  const fill = o.fill || COL.fillY, st = o.stroke || COL.lineR;
  const fs = Math.max(16, Math.min(26, R*0.16));
  if(part==='en')       pie(c, R, 0, Math.PI*2, { fill, stroke:st, lw:o.lw||4 });
  else if(part==='han') pie(c, R, Math.PI, Math.PI*2, { fill, stroke:st, lw:4 });
  else { pie(c, R, Math.PI, Math.PI*1.5, { fill, stroke:st, lw:4 }); rightMark(c, {x:-1,y:0}, {x:0,y:-1}, Math.max(10, R*0.08)); }
  const L = {x:c.x-R, y:c.y}, Rt = {x:c.x+R, y:c.y};
  const txt = val+'cm';
  if(lab==='d'){
    drawLine(L, Rt, { color:C.ink, lw:2.5, dash:[8,6] });
    drawText(c.x, c.y + fs*0.95, txt, { size:fs, color:C.ink });
  }else if(part==='yon'){
    drawText(c.x + fs*1.7, c.y - R/2, txt, { size:fs, color:C.ink });
  }else if(part==='han'){
    drawLine(c, Rt, { color:C.ink, lw:2.5, dash:[8,6] });
    drawText((c.x+Rt.x)/2, c.y + fs*0.95, txt, { size:fs, color:C.ink });
  }else{
    drawLine(c, L, { color:C.ink, lw:2.5, dash:[8,6] });
    drawText((c.x+L.x)/2, c.y - fs*0.8, txt, { size:fs, color:C.ink });
  }
  drawDot(c, 5, C.ink);
  if(o.ans){
    const p = part==='en' ? {x:c.x, y:c.y+R*0.5} : part==='han' ? {x:c.x, y:c.y-R*0.45} : {x:c.x-R*0.45, y:c.y-R*0.4};
    drawText(p.x, p.y, o.ans, { size:fs*1.15, color:C.ok });
  }
  if(o.frac){                                      // ヒント：円の 何分の 1 か（1/2・1/4）を 図の 中に 分数で
    const p = part==='han' ? {x:c.x, y:c.y-R*0.45} : {x:c.x-R*0.45, y:c.y-R*0.45};
    const ff = Math.max(18, Math.min(44, R*0.22)), col = C.coral;
    drawText(p.x, p.y-ff*0.62, '1', { size:ff, color:col });
    drawLine({x:p.x-ff*0.5, y:p.y}, {x:p.x+ff*0.5, y:p.y}, { color:col, lw:Math.max(2.5, ff*0.09) });
    drawText(p.x, p.y+ff*0.66, String(o.frac), { size:ff, color:col });
  }
}
/* 3.14 × n の 筆算（ヒント）。rg の わくの まん中に、t0 から 1行ずつ 出す */
function drawHissan(n, rg, t0){
  const top = 314, prod = top*n, prodS = String(prod);
  let z = 0, m = n; while(m%10===0){ m /= 10; z++; }
  const md = String(m).split('').reverse().map(Number);          // かける数の 0 で ない ぶん（右から）
  const parts = md.length>1 ? md.map((d,j)=>({ s:String(top*d), sh:j+z })) : [];
  const ncol = Math.max(prodS.length, String(n).length, 3) + 1;  // ＋1 は「×」の ぶん
  const nRow = 3 + parts.length;
  const rw = rg.x1-rg.x0, rh0 = rg.y1-rg.y0;
  const fs = Math.max(12, Math.min(46, rw/((ncol+1.2)*0.82), rh0/((nRow+1.4)*1.3)));
  const cw = fs*0.82, rh = fs*1.3;
  const cx = (rg.x0+rg.x1)/2, cy = (rg.y0+rg.y1)/2;
  const bw = (ncol+1.2)*cw, bh = (nRow+0.9)*rh;
  boxR(cx-bw/2, cy-bh/2, bw, bh, 14, 'rgba(255,251,232,0.95)', C.line);
  const colX = i => cx + ncol*cw/2 - cw/2 - i*cw;
  let y = cy - bh/2 + rh*0.95;
  const el = t0 ? (Date.now()-t0) : 1e9;
  let row = 0;
  const show = () => el >= (row++)*550;                          // 0.55秒ごとに 1行
  const num = (str, sh, yy, col) => { for(let k=0; k<str.length; k++)
      drawText(colX(sh+k), yy, str[str.length-1-k], { size:fs, color:col, halo:false }); };
  const dot = (yy, col) => { ctx.beginPath(); ctx.arc((colX(2)+colX(1))/2, yy+fs*0.32, Math.max(2.5, fs*0.08), 0, Math.PI*2);
      ctx.fillStyle = col; ctx.fill(); };
  const bar = yy => drawLine({x:colX(ncol-1)-cw*0.5, y:yy}, {x:colX(0)+cw*0.5, y:yy}, { color:C.ink, lw:Math.max(2, fs*0.07) });
  if(show()){ num('314', 0, y, C.ink); dot(y, C.ink); }
  y += rh;
  if(show()){ num(String(n), 0, y, C.ink); drawText(colX(ncol-1), y, '×', { size:fs, color:C.ink, halo:false }); bar(y + rh*0.55); }
  y += rh*1.1;
  if(parts.length){
    parts.forEach(pt => { if(show()) num(pt.s, pt.sh, y, C.tealD); y += rh; });
    if(el >= row*550) bar(y - rh*0.45);
    y += rh*0.1;
  }
  if(show()){
    num(prodS, 0, y, C.coral);
    if(el >= row*550){                                           // 小数点を うって、おわりの 0 を けす
      dot(y, C.coral);
      let zc = 0; while(zc<2 && prodS[prodS.length-1-zc]==='0') zc++;
      const sl = (x0) => drawLine({x:x0+cw*0.32, y:y-fs*0.42}, {x:x0-cw*0.32, y:y+fs*0.42}, { color:C.coral, lw:Math.max(2, fs*0.06) });
      for(let k=0; k<zc; k++) sl(colX(k));
      if(zc===2) sl((colX(2)+colX(1))/2);
    }
  }
}
/* 「求め方を えらぶ」の 小さな 図。x,y は 左上、s は 1辺 */
function miniIcon(t, x, y, s){
  const TL={x:x,y:y}, TR={x:x+s,y:y}, BR={x:x+s,y:y+s}, BL={x:x,y:y+s};
  const lw = Math.max(1, s*0.04);
  if(t!=='sq') drawPoly([TL,TR,BR,BL], { stroke:'#b9c3d0', lw:lw });
  if(t==='sq')        drawPoly([TL,TR,BR,BL], { fill:'#6fa8e8', stroke:C.ink, lw:lw });
  else if(t==='q')    pie(TL, s, 0, Math.PI/2, { fill:'#f08cb4', stroke:C.ink, lw:lw });
  else if(t==='tri')  drawPoly([TL,TR,BL], { fill:'#8fd16a', stroke:C.ink, lw:lw });
  else if(t==='tri2') drawPoly([TR,BR,BL], { fill:'#8fd16a', stroke:C.ink, lw:lw });
  else if(t==='half'){
    ctx.beginPath(); ctx.arc(TL.x, TL.y, s, 0, Math.PI/2); ctx.closePath();
    ctx.fillStyle=COL.orange; ctx.fill(); ctx.lineWidth=lw; ctx.strokeStyle=C.ink; ctx.stroke();
  }else if(t==='leaf'){
    ctx.save();
    ctx.beginPath(); ctx.moveTo(TL.x, TL.y); ctx.arc(TL.x, TL.y, s, 0, Math.PI/2); ctx.closePath(); ctx.clip();
    pie(BR, s, Math.PI, Math.PI*1.5, { fill:COL.orange });
    ctx.restore();
    arcLine(TL, s, 0, Math.PI/2, { color:C.ink, lw:lw });
    arcLine(BR, s, Math.PI, Math.PI*1.5, { color:C.ink, lw:lw });
  }
}
function iconRow(tokens, cx, cy, s){
  const isIc = t => /^[a-z]/.test(t);
  const fs = s*0.62;
  ctx.font = '900 '+fs+'px "Yusei Magic",sans-serif';
  const ws = tokens.map(t => isIc(t) ? s : ctx.measureText(t).width);
  const g = s*0.14;
  const tot = ws.reduce((a,b)=>a+b, 0) + g*(tokens.length-1);
  let x = cx - tot/2;
  tokens.forEach((t,i)=>{
    if(isIc(t)) miniIcon(t, x, cy-s/2, s);
    else drawText(x+ws[i]/2, cy, t, { size:fs, color:C.ink });
    x += ws[i] + g;
  });
}

const LCOL = { leaf:'#f6dfa6', pink:'#f6d3d3', blue:'#1f3fe0', gray:'#555b66', red:'#e85d3b' };
/* 1辺 s の 正方形の 中の 形。t:'q'（中心 右下の 4分の1の 円＝イ）|'q2'（中心 左上）|'leaf'|'half'|'tri'|'sq' */
function lshape(t, x, y, s, o){
  o = o || {};
  const TL={x:x,y:y}, TR={x:x+s,y:y}, BR={x:x+s,y:y+s}, BL={x:x,y:y+s};
  const lw = o.lw || Math.max(0.35, s*0.04);
  const P = {
    q   : ()=>{ ctx.moveTo(BR.x,BR.y); ctx.lineTo(BL.x,BL.y); ctx.arc(BR.x,BR.y,s,Math.PI,Math.PI*1.5); },
    q2  : ()=>{ ctx.moveTo(TL.x,TL.y); ctx.lineTo(TR.x,TR.y); ctx.arc(TL.x,TL.y,s,0,Math.PI/2); },
    leaf: ()=>{ ctx.moveTo(BL.x,BL.y); ctx.arc(BR.x,BR.y,s,Math.PI,Math.PI*1.5); ctx.arc(TL.x,TL.y,s,0,Math.PI/2); },
    half: ()=>{ ctx.moveTo(BL.x,BL.y); ctx.arc(BR.x,BR.y,s,Math.PI,Math.PI*1.5); },
    tri : ()=>{ ctx.moveTo(BL.x,BL.y); ctx.lineTo(BR.x,BR.y); ctx.lineTo(TR.x,TR.y); },
    sq  : ()=>{ ctx.moveTo(TL.x,TL.y); ctx.lineTo(TR.x,TR.y); ctx.lineTo(BR.x,BR.y); ctx.lineTo(BL.x,BL.y); }
  };
  if(o.frame){ ctx.beginPath(); P.sq(); ctx.closePath(); ctx.setLineDash([]); ctx.lineWidth=lw*0.6; ctx.strokeStyle='#a9b3c1'; ctx.stroke(); }
  ctx.beginPath(); P[t](); ctx.closePath();
  const fill = o.fill || (t==='sq' ? LCOL.pink : t==='tri' ? '#bfe6f7' : LCOL.leaf);
  if(fill!=='none'){ ctx.fillStyle=fill; ctx.fill(); }
  if(o.stroke!==null){ ctx.setLineDash([]); ctx.lineJoin='round'; ctx.lineWidth=o.slw||lw; ctx.strokeStyle=o.stroke||C.ink; ctx.stroke(); }
  if(o.mark!==false){                              // 直角の しるし
    const m = s*0.14, mk = (p,u,v)=> drawPoly([{x:p.x+u.x*m,y:p.y+u.y*m},{x:p.x+u.x*m+v.x*m,y:p.y+u.y*m+v.y*m},{x:p.x+v.x*m,y:p.y+v.y*m}],
                                            { stroke:C.ink, lw:lw*0.6, open:true });
    if(t==='q'||t==='sq'||t==='tri') mk(BR,{x:-1,y:0},{x:0,y:-1});
    if(t==='q2'||t==='sq') mk(TL,{x:1,y:0},{x:0,y:1});
  }
}
function rrPath(x, y, w, h, r){
  ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
}
/* 小数 × 1けた の 筆算（葉っぱの ヒント：28.5 × 2 など）。rg の わくの まん中に、t0 から 1行ずつ 出す。答えの 行まで 出す */
function drawHissanD(a, n, rg, t0){
  const aS = fmt(a), dp = aS.indexOf('.')<0 ? 0 : aS.length-aS.indexOf('.')-1;   // 小数の けた数
  const topS = aS.replace('.', '');
  let prodS = String(parseInt(topS,10)*n); while(prodS.length < dp+1) prodS = '0'+prodS;
  const ncol = Math.max(topS.length, prodS.length, String(n).length, dp+1) + 1;   // ＋1 は「×」の ぶん
  const nRow = 3;
  const rw = rg.x1-rg.x0, rh0 = rg.y1-rg.y0;
  const fs = Math.max(8, Math.min(46, rw/((ncol+1.2)*0.82), rh0/((nRow+1.4)*1.3)));
  const cw = fs*0.82, rh = fs*1.3;
  const cx = (rg.x0+rg.x1)/2, cy = (rg.y0+rg.y1)/2;
  const bw = (ncol+1.2)*cw, bh = (nRow+0.9)*rh;
  boxR(cx-bw/2, cy-bh/2, bw, bh, Math.min(14, fs*0.5), 'rgba(255,251,232,0.95)', C.line);
  const colX = i => cx + ncol*cw/2 - cw/2 - i*cw;
  let y = cy - bh/2 + rh*0.95;
  const el = t0 ? (Date.now()-t0) : 1e9;
  let row = 0;
  const show = () => el >= (row++)*550;                          // 0.55秒ごとに 1行
  const num = (str, yy, col) => { for(let k=0; k<str.length; k++)
      drawText(colX(k), yy, str[str.length-1-k], { size:fs, color:col, halo:false }); };
  const dotX = (colX(dp)+colX(dp-1))/2;
  const dot = (yy, col) => { if(dp<=0) return; ctx.beginPath(); ctx.arc(dotX, yy+fs*0.32, Math.max(2, fs*0.08), 0, Math.PI*2);
      ctx.fillStyle = col; ctx.fill(); };
  const bar = yy => drawLine({x:colX(ncol-1)-cw*0.5, y:yy}, {x:colX(0)+cw*0.5, y:yy}, { color:C.ink, lw:Math.max(1.5, fs*0.07) });
  if(show()){ num(topS, y, C.ink); dot(y, C.ink); }
  y += rh;
  if(show()){ num(String(n), y, C.ink); drawText(colX(ncol-1), y, '×', { size:fs, color:C.ink, halo:false }); bar(y + rh*0.55); }
  y += rh*1.1;
  if(show()){
    num(prodS, y, C.coral);
    if(el >= row*550){                                           // 小数点を うって、おわりの 0 を けす
      dot(y, C.coral);
    }
    if(el >= (row+1)*550){                                       // 斜線は さいごに（57.0 が 出てから）
      let zc = 0; while(zc<dp && prodS[prodS.length-1-zc]==='0') zc++;
      const sl = (x0) => drawLine({x:x0-cw*0.32, y:y-fs*0.42}, {x:x0+cw*0.32, y:y+fs*0.42}, { color:C.coral, lw:Math.max(1.5, fs*0.06) });   // 左上 → 右下
      for(let k=0; k<zc; k++) sl(colX(k));
      if(dp>0 && zc===dp) drawLine({x:dotX-cw*0.2, y:y+fs*0.08}, {x:dotX+cw*0.2, y:y+fs*0.56}, { color:C.coral, lw:Math.max(1.5, fs*0.06) });   // 小数点の 上に 短い 斜線（左上 → 右下）
    }
  }
}
/* 小数の たし算 → ひき算 の 筆算を 2つ ならべる（葉っぱ その2 の ヒント：12.56 ＋ 12.56 ＝ 25.12 → 25.12 − 16 ＝ 9.12）。
   a ＋ b の 答えから c を ひく。rg の わくの まん中に、t0 から 1行ずつ（左の 筆算 → 右の 筆算）出す。答えの 行まで 出す。
   数は 小数点の 位置を そろえる。答えの おわりの 0 と 小数点は drawHissanD と 同じ 斜線で けす（157.0 → 157） */
function drawHissanPM(a, b, c, rg, t0){
  const make = (x, y, op) => {
    const dec = s => { const i = s.indexOf('.'); return i<0 ? 0 : s.length-i-1; };
    const xs = fmt(x), ys = fmt(y), dp = Math.max(dec(xs), dec(ys));
    let rs = String(Math.round(Math.abs(op==='＋' ? x+y : x-y)*Math.pow(10, dp)));
    while(rs.length < dp+1) rs = '0'+rs;
    if(dp>0) rs = rs.slice(0, rs.length-dp)+'.'+rs.slice(rs.length-dp);
    const lay = s => {                                  // 1けたずつ、右から 何列めか（小数点で そろえる）
      const i = s.indexOf('.'), ip = i<0 ? s : s.slice(0, i), fp = i<0 ? '' : s.slice(i+1), cells = [];
      for(let k=0; k<ip.length; k++) cells.push({ ch:ip[k], c:dp+ip.length-1-k });
      for(let j=0; j<fp.length; j++) cells.push({ ch:fp[j], c:dp-1-j });
      return { cells:cells, dot:fp.length>0, hi:dp+ip.length-1 };
    };
    const L = [lay(xs), lay(ys), lay(rs)];
    let zc = 0; while(zc<dp && rs[rs.length-1-zc]==='0') zc++;
    return { L:L, dp:dp, zc:zc, op:op, ncol:Math.max(L[0].hi, L[1].hi, L[2].hi) + 3 };   // ＋2 は 記号と すきまの ぶん
  };
  const H1 = make(a, b, '＋'), H2 = make(a+b, c, '−');
  const nRow = 3, U = H1.ncol + H2.ncol + 2.6;          // 2つ分 ＋ 間（1.6）＋ 左右の はし（0.5 ずつ）
  const rw = rg.x1-rg.x0, rh0 = rg.y1-rg.y0;
  const fs = Math.max(6, Math.min(40, rw/(U*0.7), rh0/((nRow+1.4)*1.3)));
  const cw = fs*0.7, rh = fs*1.3;                        // 横の 間かくを つめて、せまい わくでも 字を 大きく
  const cx = (rg.x0+rg.x1)/2, cy = (rg.y0+rg.y1)/2;
  const bw = U*cw, bh = (nRow+0.9)*rh;
  boxR(cx-bw/2, cy-bh/2, bw, bh, Math.min(14, fs*0.5), 'rgba(255,251,232,0.95)', C.line);
  const el = t0 ? (Date.now()-t0) : 1e9;
  let tk = 0;
  const on = () => el >= (tk++)*550;                    // 0.55秒ごとに 1つ
  const one = (H, base) => {
    const colX = i => base + H.ncol*cw - cw/2 - i*cw;
    const dotX = (colX(H.dp)+colX(H.dp-1))/2;
    const num = (l, yy, col) => l.cells.forEach(e => drawText(colX(e.c), yy, e.ch, { size:fs, color:col, halo:false }));
    const dot = (yy, col) => { ctx.beginPath(); ctx.arc(dotX, yy+fs*0.32, Math.max(1.5, fs*0.08), 0, Math.PI*2); ctx.fillStyle = col; ctx.fill(); };
    const bar = yy => drawLine({x:colX(H.ncol-1)-cw*0.5, y:yy}, {x:colX(0)+cw*0.5, y:yy}, { color:C.ink, lw:Math.max(1.5, fs*0.07) });
    let y = cy - bh/2 + rh*0.95;
    if(on()){ num(H.L[0], y, C.ink); if(H.L[0].dot) dot(y, C.ink); }
    y += rh;
    if(on()){ num(H.L[1], y, C.ink); if(H.L[1].dot) dot(y, C.ink);
              drawText(colX(H.ncol-1), y, H.op, { size:fs, color:C.ink, halo:false }); bar(y + rh*0.55); }
    y += rh*1.1;
    if(on()){
      num(H.L[2], y, C.coral);
      if(H.L[2].dot && on()){                           // 小数点を うつ
        dot(y, C.coral);
        if(H.zc>0 && on()){                             // 斜線は さいごに（左上 → 右下）
          const lw = Math.max(1.5, fs*0.06);
          for(let k=0; k<H.zc; k++){ const x0 = colX(k); drawLine({x:x0-cw*0.32, y:y-fs*0.42}, {x:x0+cw*0.32, y:y+fs*0.42}, { color:C.coral, lw:lw }); }
          if(H.zc===H.dp) drawLine({x:dotX-cw*0.2, y:y+fs*0.08}, {x:dotX+cw*0.2, y:y+fs*0.56}, { color:C.coral, lw:lw });
        }
      }
    }
  };
  const left = cx - bw/2 + 0.5*cw;
  one(H1, left);
  one(H2, left + (H1.ncol + 1.6)*cw);
}
/* いちょう形（先生の 映像）：補助線を ひく ところから。1つずつ 進む だん（1〜9）と その 時間（ミリ秒）
   0 横の 補助線を マウス（ゆび）で ひく → 1 横の 補助線（左右の 点）→ 2 下を かくす（上は 半円）→ 3 かくしを 上へ（下の 形）→ 4 かくしが きえる
   → たての 補助線を マウス（ゆび）で ひく → 5 たての 補助線（上下の 点）→ 6 同じ 形を 緑に → 7 緑が きえる → 8 下の 形を 上へ まわす → 9 長方形に なる
   ISTOP … とまる だん（それ以外は 0.9秒 あけて 自動で つぎへ）。IDRAW … とまって 線を ひくのを 待つ だん（'h'＝横・'v'＝たて）。それ以外は「▶ 次へ」 */
const ISTEP = [0, 1000, 2500, 2000, 900, 1000, 1500, 900, 2600, 1500];
const ISTOP = [0, 1, 3, 4, 6];
const IDRAW = { 0:'h', 4:'v' };
/* ---- 形を うごかして 求める タブ（逆三角形・UFO・星）の 共通の しくみ ----
   ST … だんの 時間（ミリ秒）。STOP … 「▶ 次へ」を 待つ だん（それ以外は 0.9秒 あけて 自動で つぎへ）。さいごの だんの あと 面積を 入れる。
   モードに 書くもの：icon・label・a0（さいしょの 長さ）・as（そのあとの 長さ）・area(a)・ST・STOP・scene(U)・gA(n)・gB()・gD()・hA()・hB()・wrong(a)・ng
   view(U) … 見せる はんい [x, y, はば, 高さ]（仮の座標）。図が 小さく なる ときは ズームして わく いっぱいに 見せる */
function animMode(o){
  const base = {
    dec:true, unit:'cm²', noAutoNext:true, first:true, arMin:0.3,   // arMin：横長の 画面では キャンバスを 横に 広げる
    tbl:true,                                          // 🧮 3.14の 表
    steps:['形を うごかす','面積を 求める'],
    get input(){ return phase==='a' ? 'none' : 'number'; },
    get ctlHtml(){
      return '<div class="seg2"><button data-go="1" class="go">▶ もう一度 見る</button>'+
             '<button data-next="1" class="nx" style="visibility:hidden">▶ 次へ</button></div>';
    },
    onCtl(btn){
      if(btn.dataset.go){                              // はじめから いまの ところまで 自動で もう一度
        const to = phase==='a' ? (data.n||0) : this.ST.length-1;
        if(to > 0){ data.rp = to; data.n = 0; data.tn = 0; data.ta = 0; refresh(); }
        return;
      }
      if(btn.dataset.next){
        if(!this.canNext()) return;
        data.n++; data.tn = Date.now();
        refresh();
      }
    },
    setup(){
      data.a = this.first ? this.a0 : pick(this.as); this.first = false;
      data.ans = this.area(data.a);
      data.n = 0; data.tn = 0; data.ta = 0; data.rp = 0; data.td = 0; data.bz = false; data.t0 = Date.now();
      phase = 'a';
    },
    redo(){ phase = 'a'; data.n = 0; data.tn = 0; data.ta = 0; data.rp = 0; data.td = 0; data.bz = false; data.t0 = Date.now(); applyInputUI(); },
    stg(k){                                            // だん k の すすみ（0〜1）
      const n = data.n || 0;
      if(k < n) return 1; if(k > n) return 0;
      const t = Math.max(0, Math.min(1, (Date.now() - data.tn) / this.ST[k])); return t*t*(3-2*t);
    },
    stepBusy(){ return (data.n || 0) > 0 && Date.now() - data.tn < this.ST[data.n]; },
    canNext(){
      const n = data.n || 0;
      return phase==='a' && !data.rp && Date.now() - data.t0 > 600 && !this.stepBusy()
             && this.STOP.indexOf(n) >= 0 && n < this.ST.length-1;
    },
    busy(){ return !!data.rp || this.stepBusy(); },
    step(){ return phase==='a' ? 0 : phase==='b' ? 1 : 2; },
    prompt(){
      const t = { a:'色を ぬった 部分の 面積を 求めましょう。',
                  b:'色を ぬった 部分の 面積は 何cm²？' }[phase];
      return '<span class="pq">'+(t || '色を ぬった 部分 ＝ '+fmt(data.ans)+'cm²')+'</span>';
    },
    draw(){
      const n = data.n || 0, last = this.ST.length-1;
      const auto = data.rp ? n < data.rp : (phase==='a' && this.STOP.indexOf(n) < 0 && n < last);
      if(auto && !this.stepBusy()){                    // つぎの とまる だんまで 0.9秒ずつ 間を あけて 自動で（もう一度 見る ときは 0.3秒）
        if(!data.ta) data.ta = Date.now();
        else if(Date.now() - data.ta >= (data.rp ? 300 : LAUTO_GAP)){ data.n = n+1; data.tn = Date.now(); data.ta = 0; refresh(); }
      }else data.ta = 0;
      if(data.rp && (data.n||0) >= data.rp && !this.stepBusy()){ data.rp = 0; refresh(); }
      if(phase==='a' && !data.rp && (data.n||0) >= last && !this.stepBusy()){ nextPhase('b'); refresh(); }   // 式まで 出たら 面積を 入れる
      const bz = this.stepBusy();
      if(data.bz && !bz) refresh();                    // だんの 動きが おわったら ガイドを かえる
      data.bz = bz;
      const nxb = document.querySelector('#ctlRow .nx');
      if(nxb) nxb.style.visibility = this.canNext() ? 'visible' : 'hidden';   // 「▶ 次へ」を 待って いる ときだけ（場所は かえない）
      const U = animTools(this), vb = this.view ? this.view(U) : [0, 0, 160, 100];   // 見せる はんいを キャンバス いっぱいに
      const k = Math.min(W/vb[2], H/vb[3]), ox = (W-vb[2]*k)/2 - vb[0]*k, oy = (H-vb[3]*k)/2 - vb[1]*k;
      ctx.save();
      ctx.setTransform(DPR*k, 0, 0, DPR*k, DPR*ox, DPR*oy);
      try{ this.scene(U); } finally { ctx.restore(); }
    },
    guide(){
      const n = data.n || 0;
      if(phase==='a'){
        if(data.rp || this.STOP.indexOf(n) < 0 || this.stepBusy()) return 'よく 見て みよう。';
        return this.gA(n);
      }
      if(phase==='b') return data.rp ? 'よく 見て みよう。' : this.gB();
      return this.gD();
    },
    hint(){
      if(phase==='a') return this.hA();
      if(phase==='b') return this.hB();
      return null;
    },
    check(v){
      if(phase!=='b') return null;
      if(this.busy()) return { ok:false, skip:true, msg:'👀 動きが おわってから こたえよう' };
      if(same(v, data.ans)){ phase = 'done'; data.td = Date.now(); return { ok:true, msg:'せいかい！ '+fmt(data.ans)+'cm² 🎉' }; }
      const w = this.wrong(data.a).find(x => same(v, x[0]));
      if(w) return { ok:false, msg:w[1] };
      if(dotMiss(v, data.ans)) return { ok:false, msg:'小数点の 位置を たしかめよう 🔍' };
      return { ok:false, msg:this.ng };
    }
  };
  return Object.defineProperties(base, Object.getOwnPropertyDescriptors(o));
}
/* scene の 中で つかう 道具（160×100 の 仮の座標） */
function animTools(md){
  const cl = t => Math.max(0, Math.min(1, t)), E = t => { t = cl(t); return t*t*(3-2*t); };
  const A = (fn, al) => { if(!(al>0)) return; const g = ctx.globalAlpha; ctx.globalAlpha = g*cl(al); fn(); ctx.globalAlpha = g; };   // すきとおり（かさねても よい）
  const T = (x, y, t, sz, col, al, maxW) => A(()=>{             // 文字（maxW より 長い ときは 小さく）
    let s = sz;
    if(maxW){ ctx.font = '900 '+s+'px "Yusei Magic",sans-serif'; const w = ctx.measureText(t).width; if(w > maxW) s = s*maxW/w; }
    drawText(x, y, t, { size:s, color:col||C.ink, halo:false });
  }, al===undefined ? 1 : al);
  const lab = (x, y, t, sz) => {                                // 白い 下じきの 上に 文字
    ctx.font = '900 '+sz+'px "Yusei Magic",sans-serif';
    const w = ctx.measureText(t).width + 1.4;
    ctx.fillStyle = '#fff'; ctx.fillRect(x-w/2, y-sz*0.6, w, sz*1.2);
    drawText(x, y, t, { size:sz, color:C.ink, halo:false });
  };
  const dim = (p0, p1, b, t, sz) => {                           // 長さの 点線（b：ふくらみ。p0→p1 の 左がわが +）と 長さ
    const mx = (p0.x+p1.x)/2, my = (p0.y+p1.y)/2;
    let nx = -(p1.y-p0.y), ny = p1.x-p0.x; const L = Math.hypot(nx, ny) || 1; nx /= L; ny /= L;
    ctx.setLineDash([1.4,1.1]); ctx.lineWidth = 0.45; ctx.strokeStyle = '#7d8796';
    ctx.beginPath(); ctx.moveTo(p0.x, p0.y); ctx.quadraticCurveTo(mx+nx*b, my+ny*b, p1.x, p1.y); ctx.stroke(); ctx.setLineDash([]);
    if(t) lab(mx+nx*b/2, my+ny*b/2, t, sz||5.4);
  };
  const arrow = (p0, p1, t, col, lw) => {                       // のびる 矢印
    const q = { x:p0.x+(p1.x-p0.x)*t, y:p0.y+(p1.y-p0.y)*t };
    drawLine(p0, q, { color:col, lw:lw });
    const ang = Math.atan2(p1.y-p0.y, p1.x-p0.x), L = 2.8;
    drawPoly([{x:q.x-L*Math.cos(ang-0.45), y:q.y-L*Math.sin(ang-0.45)}, q,
              {x:q.x-L*Math.cos(ang+0.45), y:q.y-L*Math.sin(ang+0.45)}], { stroke:col, lw:lw, open:true });
  };
  const ans = (cx, cy) => {                                     // せいかいの あとの 答え（黄色い わく）
    if(phase!=='done' || !data.td) return;
    A(()=>{
      const t = fmt(data.ans)+'cm²';
      ctx.font = '900 7px "Yusei Magic",sans-serif';
      const w = ctx.measureText(t).width + 4;
      rrPath(cx-w/2, cy-5.2, w, 10.4, 2); ctx.fillStyle = '#fff36b'; ctx.fill();
      ctx.lineWidth = 0.6; ctx.strokeStyle = '#e8b52e'; ctx.stroke();
      drawText(cx, cy, t, { size:7, color:C.coral, halo:false });
    }, E((Date.now() - data.td)/700));
  };
  const sym = (x, y, t, al) => T(x, y, t, 12, '#2f6fe0', al);  // 図の あいだの ＋ − ＝（青）
  return { SG:k => md.stg(k), cl, E, mix:(u,v,t) => u+(v-u)*t, A, T, lab, dim, arrow, ans, sym,
           LEAF:'#f8dfa3', CYAN:'#8ef0fa', CYAN2:'#2bdcf3', RED:'#e8121e', GHOST:'#c9b98f' };
}
/* ---- 「円の 面積」「半円など」「ランダム」の 共通の しくみ：式を つくる → 自動で 計算して 答えを 出す ----
   kinds … 出す 形（'r'＝半径が わかる 円・'d'＝直径が わかる 円・'han'＝半円・'yon'＝4分の1の 円）
   order … 'alt'＝kinds の 順に 交互、'rnd'＝ランダム（同じ しゅるいは つづけない）

const SK_T0 = 600, SK_GAP = 800, SK_FIN = 700;   // 1行めまで・行と 行の 間・答えから はなまるまで（ミリ秒）
const fmtC = x => String(Math.round(x*10000)/10000);
const skSp = s => s.replace(/([×÷])/g, ' $1 ');
function shikiMode(o){
  return Object.assign({
    input:'expr', ops:['×','÷'], dec:true, pi:true,   // pi：テンキーに 3.14 キー
    steps:['式を つくる','答えを 計算'],
    meth:'all', cnt:0, last:'', lastR:0,
    setup(){

      else if(this.order==='alt'){ k = this.kinds[this.cnt % this.kinds.length]; this.cnt++; }
      else k = pick(this.kinds.filter(x => x!==this.last));
      this.last = k;

      let r; do{ r = data.part==='yon' ? 2*rnd(1,5) : rnd(1,10); }while(r===this.lastR);   // 4分の1の 円は 半径を 偶数に（答えが 小数 2けたまで）

      data.ex = ''; data.calc = []; data.ct = 0; data.fin = false;

      playOk(); say('答えは '+fmt(data.ans)+'cm² 🎉', 'ok');
      if(!answered){ scores[mode] = (scores[mode]||0) + 1; refreshScore(); answered = true; }
      clearAutoNext();
      if(window.TestRun && TestRun.onDone()){ refresh(); return; }                     // 📝テスト中は つぎの 大問へ
      if(window.Challenge10 && Challenge10.isOn()){ chalDoneOnce(); refresh(); return; }  // チャレンジ中は モジュールが 進める
      autoTimers.push(setTimeout(()=>{ autoTimers = []; newProblem(); }, HANAMARU_SHOW_MS + AUTO_NEXT_MS));

    },
    step(){ return phase==='ask' ? 0 : phase==='calc' ? 1 : 2; },
    name(){ return data.part==='en' ? '円' : data.part==='han' ? '半円' : '円を 4等分した 形'; },
    draw(){
      if(phase==='calc' && !data.fin && Date.now() - data.ct >= SK_T0 + data.calc.length*SK_GAP + SK_FIN){   // 答えまで 出たら（はなまるは 出さない）
        data.fin = true; phase = 'done';
        this.finish();
      }
      const wide = W/H > 1.2, top = promptBand(2);
      const rgF = wide ? { x0:W*0.01, y0:top, x1:W*0.55, y1:H*0.97 }
                       : { x0:W*0.02, y0:top, x1:W*0.98, y1:top + (H*0.97-top)*0.55 };
      const rgC = wide ? { x0:W*0.56, y0:top+4, x1:W*0.98, y1:H*0.96 }
                       : { x0:W*0.05, y0:rgF.y1+4, x1:W*0.95, y1:H*0.97 };
      const en = data.part==='en';
      circleScene(['この '+this.name()+'の 面積を 求める', '式を つくろう'], phase==='done' ? C.ok : C.coral,
                  data.part, data.lab, data.lab==='d' ? data.r*2 : data.r,
                  { fill: en ? null : '#e8f59a', stroke: en ? null : '#6f8f1f', rg:rgF,
                    frac: (hintOn && phase==='ask' && !en) ? data.div : null });   // ヒント：1/2・1/4 を 図の 中に
      this.drawCalc(rgC);
    },
    drawCalc(rg){                                      // 計算の わく
      const x0 = rg.x0, y0 = rg.y0, w = rg.x1-rg.x0, h = rg.y1-rg.y0;
      if(w < 40 || h < 30) return;
      const fit = (list, maxW, f0) => { ctx.font = '900 100px "Yusei Magic",sans-serif';
        const mw = Math.max(...list.map(t => ctx.measureText(t).width))/100; return Math.min(f0, maxW/mw); };
      boxR(x0, y0, w, h, 14, 'rgba(255,251,232,0.95)', C.line);
      const cx = x0 + w/2;
      if(phase==='ask'){
        const L = ['式を 入れて OK を 押すと、', 'ここで 計算して 答えを 出すよ'];
        const fs = Math.max(9, Math.min(fit(L, w*0.88, 22), h/4));
        L.forEach((t,i) => drawText(cx, y0 + h/2 + (i-0.5)*fs*1.5, t, { size:fs, color:C.inkSoft, halo:false }));
        return;
      }
      const el = Date.now() - data.ct, n = data.calc.length;
      const cl = t => Math.max(0, Math.min(1, t)), E = t => { t = cl(t); return t*t*(3-2*t); };
      const exT = '式　'+skSp(data.ex);
      const rows = data.calc.map((s,i) => ({ l:skSp(fmtC(s.a)+s.op+fmtC(s.b))+' ＝ ', r:fmtC(s.c), at:SK_T0 + i*SK_GAP }));
      const ansT = '答え　'+fmt(data.ans)+'cm²', ansAt = SK_T0 + n*SK_GAP;
      const size = withEx => { const all = rows.map(x => x.l+x.r).concat([ansT]).concat(withEx ? [exT] : []);
        const nl = all.length; return Math.max(10, Math.min(fit(all, w*0.86, 30), h/(nl*1.45+0.4))); };
      let showEx = true, fs = size(true);
      if(fs < 12){ showEx = false; fs = size(false); }   // せまい ときは 式の 行を はぶく（式は こたえ欄に ある）
      const nl = rows.length + 1 + (showEx ? 1 : 0), lh = fs*1.45;
      let y = y0 + (h - nl*lh)/2 + lh/2;
      if(showEx){ drawText(cx, y, exT, { size:fs, color:C.tealD, halo:false }); y += lh; }
      rows.forEach(rw => {
        const al = E((el - rw.at)/300);
        if(al > 0){
          ctx.globalAlpha = al;
          ctx.font = '900 '+fs+'px "Yusei Magic",sans-serif';
          const wl = ctx.measureText(rw.l).width, wr = ctx.measureText(rw.r).width, xs = cx - (wl+wr)/2;
          drawText(xs, y, rw.l, { size:fs, color:C.ink, align:'left', halo:false });
          drawText(xs+wl, y, rw.r, { size:fs, color:C.coral, align:'left', halo:false });
          ctx.globalAlpha = 1;
        }
        y += lh;
      });
      const aa = E((el - ansAt)/400);
      if(aa > 0){
        ctx.globalAlpha = aa;
        ctx.font = '900 '+fs+'px "Yusei Magic",sans-serif';
        const bw = ctx.measureText(ansT).width + fs*0.9;
        rrPath(cx-bw/2, y-fs*0.72, bw, fs*1.44, fs*0.3); ctx.fillStyle = '#fff36b'; ctx.fill();
        ctx.lineWidth = Math.max(1.5, fs*0.08); ctx.strokeStyle = '#e8b52e'; ctx.stroke();
        drawText(cx, y, ansT, { size:fs, color:C.coral, halo:false });
        ctx.globalAlpha = 1;
      }
    },
    guide(){
      if(phase==='calc') return '式を 左から じゅんに 計算して いるよ。よく 見て みよう。';
      if(phase==='done') return '式が できれば、答えも もとめられるね！';
      const pre = data.lab==='d' ? '直径が かいて あるよ。半径は いくつかな？ ' : '';
      const pt  = data.part==='han' ? '半円は 円の 半分だね。' : data.part==='yon' ? '円を 4等分した 形は 円の 4分の1 だね。' : '';
      return pre + pt + '3.14 は テンキーの「3.14」で 入れられるよ。';
    },
    hint(){
      if(phase!=='ask') return null;
      const pre = data.lab==='d' ? '半径 ＝ 直径 ÷ 2 → '+(data.r*2)+' ÷ 2 ＝ '+data.r+'cm。 ' : '';
      return pre + '半径 × 半径 × 3.14' + (data.div>1 ? ' ÷ '+data.div+'（図の 分数を 見てね）' : '');
    },
    check(ex){
      if(phase!=='ask') return null;
      const form = { ok:false, skip:true, msg:'「5×5×3.14」の ように 入力してね' };
      const t = ex.match(/\d+(?:\.\d+)?|[×÷]/g);
      if(!t || t.join('')!==ex || t.length%2===0) return form;
      for(let i=0;i<t.length;i++) if(i%2===0 ? !/^\d/.test(t[i]) : !/^[×÷]$/.test(t[i])) return form;
      if(t.length===1) return { ok:false, skip:true, msg:'答えでは なく 式を かこう' };
      let v = parseFloat(t[0]); const nums = [v], calc = [];
      for(let i=1;i<t.length;i+=2){                    // 左から じゅんに 計算
        const b = parseFloat(t[i+1]); nums.push(b);
        if(t[i]==='÷' && b===0) return { ok:false, skip:true, msg:'0 で わる ことは できないよ' };
        const c = Math.round((t[i]==='×' ? v*b : v/b)*1e6)/1e6;
        calc.push({ a:v, op:t[i], b:b, c:c }); v = c;
      }
      const r = data.r, dv = data.div, full = r*r*PI_, has314 = nums.some(x => same(x, 3.14));
      if(same(v, data.ans) && has314){
        phase = 'calc'; data.ex = ex; data.calc = calc; data.ct = Date.now();
        const et = document.getElementById('exprText'); if(et) et.classList.add('done');
        return { ok:true, done:false, msg:'式 ⭕ 計算して みよう' };
      }
      if(!has314) return { ok:false, msg:'円周率 3.14 が 入って いないよ 🔍' };
      if(same(v, 4*full/dv)) return { ok:false, msg: data.lab==='d' ? '直径で 計算して いるよ。半径は 直径 ÷ 2 🔍' : '半径は '+r+'cm だよ 🔍' };
      if(same(v, 2*r*PI_) || same(v, 2*r*PI_/dv)) return { ok:false, msg:'それは 円周の 式だよ。面積は 半径×半径×円周率 🔍' };
      if(dv===2 && same(v, full/4)) return { ok:false, msg:'半円は 円の 半分。÷2 だよ 🔍' };
      if(dv===4 && same(v, full/2)) return { ok:false, msg:'半分では なく 4分の1。÷4 だよ 🔍' };
      if(dv>1 && same(v, full)) return { ok:false, msg:'円 まるごとの 面積に なって いるよ。÷'+dv+' しよう 🔍' };
      if(same(v, r*PI_) || same(v, r*PI_/dv)) return { ok:false, msg:'半径は 2回 かけるよ 🔍' };
      return { ok:false, msg:'式を 見なおそう 🔍' };
    }
  }, o);
}
