        }
        // ⑧ 28.5 × 2   ⑨ ＝ 57cm²
        const p2 = E(P('num2'));
        T(X.q+s1/2, ny2, fmt(data.half), 7.5, C.ink, p2); T(X.mn+3.5, ny2, '×', 7.5, C.ink, p2); T(X.t+s1/2, ny2, '2', 7.5, C.ink, p2);
        const pF = E(P('fin'));
        T(X.eq+3.5, ny2, '＝', 7.5, C.ink, pF); ANS(X.h+s1/2+3, ny2, pF);
      }else{
        /* ---------- その2：イ ＋ イ − ア ---------- */
        /* 式の 段の 横の ならび：キャンバスの あきに 合わせて 形と 形の 間（g）を 広げる（まん中は 80）。
           せまい 画面では 間を 18 とって、形を 少し 小さく する */
        const half = Math.min(80 - (this.vL===undefined ? 0 : this.vL), (this.vR===undefined ? 160 : this.vR) - 80) - 4;
        const s2 = Math.max(22, Math.min(27, (2*half - 3*18)/4)), y1 = 58, ny = y1+s2+7;
        const g = Math.max(12, Math.min(24, (2*half - 4*s2)/3)), x0 = 80 - (4*s2 + 3*g)/2, st2 = s2 + g;
        const X = { q:x0, pl:x0+s2+g/2, q2:x0+st2, mn:x0+st2+s2+g/2, sq:x0+2*st2, eq:x0+2*st2+s2+g/2, l:x0+3*st2 };
        const mid = (X.q + X.q2)/2;
        const FILL = 'rgba(246,214,130,.62)';
        const c1 = E(SG(4)), c2 = E(SG(5)), c3 = E(SG(6));            // 4・5 図の イを 下へ うつす  6 ア を 下へ
        const thin = cl(SG(8) - SG(11));                                // 8 わくを 細く … 11 もとの 太い わくに
        const mg  = E(SG(9) * (1 - SG(11)));                            // 9 重ねる … 11 もどす
        const sub = SG(10) * (1 - SG(11));                              // 10 ア を ひく（重なって いない ところが 白く なる）
        const qx = mix(X.q, mid, mg), q2x = mix(X.q2, mid, mg);
        const at = (c, xx) => ({ x:mix(F.x, xx, c), y:mix(F.y, y1, c), s:mix(F.s, s2, c) });
        const pFill = (t, c, xx) => { if(!(c > 0)) return; const g = at(c, xx);
          A(()=> lshape(t, g.x, g.y, g.s, { fill:FILL, stroke:null, mark:false }), 1 - sub); };
        const pLine = (t, col, c, xx) => { if(!(c > 0)) return; const g = at(c, xx);
          A(()=> lshape('sq', g.x, g.y, g.s, { fill:'none', stroke:'#a9b3c1', slw:0.4, mark:false }), 1 - thin);
          A(()=> lshape('sq', g.x, g.y, g.s, { fill:'none', stroke:C.ink, slw:0.6, mark:false }), thin);
          A(()=> lshape(t, g.x, g.y, g.s, { fill:'none', stroke:col, slw:1.7 }), 1 - thin);
          A(()=> lshape(t, g.x, g.y, g.s, { fill:'none', stroke:C.ink, slw:0.5, mark:false }), thin); };
        pFill('q', c1, qx); pFill('q2', c2, q2x);
        A(()=> lshape('leaf', mid, y1, s2, { fill:'#f7dc94', stroke:null, mark:false }), sub);   // 重なった ところ（葉っぱ）だけ のこる
        pLine('q', LCOL.gray, c1, qx); pLine('q2', LCOL.blue, c2, q2x);
        T(X.pl, y1+s2/2, '＋', 12, C.ink, c1 * (1 - mg));
        T(X.mn, y1+s2/2, '−', 12, C.ink, c2 * (1 - sub));
        if(SG(6) > 0) A(()=> lshape('sq', mix(IC[0].x, X.sq, c3), mix(IC[0].y, y1, c3), mix(15, s2, c3), { slw:1.1 }), 1 - sub);
        T(X.eq, y1+s2/2, '＝', 12, C.ink, c3);
        A(()=> lshape('leaf', X.l, y1, s2, { frame:true, mark:false }), SG(7));              // 7 葉っぱ
        // 12 ア・イ と 点線で むすぶ → 78.5 ＋ 78.5 − 100
        const pn = E(P('num')), la = SG(12) * (1 - E(P('fin')));
        DL(VA[1], { x:X.q+s2/2,  y:y1-1 }, '#222', la);
        DL(VA[1], { x:X.q2+s2/2, y:y1-1 }, LCOL.blue, la);
        DL(VA[0], { x:X.sq+s2/2, y:y1-1 }, '#c03ad6', la);
        T(X.q+s2/2, ny, fmt(data.vq), 7.5, C.ink, pn); T(X.pl, ny, '＋', 7.5, C.ink, pn); T(X.q2+s2/2, ny, fmt(data.vq), 7.5, C.ink, pn);
        T(X.mn, ny, '−', 7.5, C.ink, pn); T(X.sq+s2/2, ny, fmt(data.vs), 7.5, C.ink, pn);
        // ⑥ ＝ 57cm²
        const pF = E(P('fin'));
        T(X.eq, ny, '＝', 7.5, C.ink, pF); ANS(X.l+s2/2+3, ny, pF);
      }
    },
    guide(){
      const v = fmt;
      if(this.meth==='m2'){
        if(phase==='a') return !(data.n||0)                   ? 'この 図形の 中に、イ（4分の1の 円）が 2つ かくれて いるよ。「▶ 次へ」を 押そう。'
                             : LSTOP2.indexOf(data.n) < 0     ? '灰色の わくと 青い わくは、どちらも イ だね。よく 見て みよう。'
                                                              : '「▶ 次へ」を 押して、順番に 見て いこう。';
        if(phase==='b') return 'イ ＋ イ − ア を 計算しよう。小数点は「．」で 入れるよ。';
        return 'イ ＋ イ − ア ＝ '+v(data.vq)+' ＋ '+v(data.vq)+' − '+v(data.vs)+' ＝ '+v(data.ans)+'cm²';
      }
      if(phase==='a') return !(data.n||0)                   ? 'こうたさんの ア・イ・ウ の どれと どれが 見えるかな？ 考えたら「▶ 次へ」を 押そう。'
                           : LSTOP.indexOf(data.n) < 0      ? 'こうたさんの ア・イ・ウ の どれと どれが 見えるかな？ よく 見て みよう。'
                                                            : '「▶ 次へ」を 押して、順番に 見て いこう。';
      if(phase==='b') return '図の 式を 計算しよう。小数点は「．」で 入れるよ。';
      if(phase==='c') return '葉っぱの 形は、半分の 形の 2つ分 だね。';
      return '（イ − ウ）× 2 ＝ （'+v(data.vq)+' − '+v(data.vt)+'）× 2 ＝ '+v(data.ans)+'cm²';
    },
    hint(){
      const v = fmt;
      if(this.meth==='m2'){
        if(phase==='a') return '2つの イを 重ねると 正方形 ぜんぶに なって、葉っぱの ところだけ 2まい 重なるよ。';
        if(phase==='b') return v(data.vq)+' ＋ '+v(data.vq)+' − '+v(data.vs)+'。筆算は 右上を 見てね。';
        return null;
      }
      if(phase==='a') return 'まわりの 線を たどると、弧の ある 形（イ）と、まっすぐな 線で かこまれた 形（ウ）が 見えるよ。';
      if(phase==='b') return v(data.vq)+' − '+v(data.vt);
      if(phase==='c') return v(data.half)+' × 2。筆算は 図の 右を 見てね。';
      return null;
    },
    check(v){
      if(phase==='done') return null;
      if(this.busy()) return { ok:false, skip:true, msg:'👀 動きが おわってから こたえよう' };
      const m2 = this.meth==='m2', G = LGATE[this.meth], now = Date.now();
      const adv = nx => { this.fs = G[phase]+1; this.ft = now; if(nx==='done') phase = 'done'; else nextPhase(nx); };
      const win = () => { adv('done'); return { ok:true, msg:'せいかい！ '+fmt(data.ans)+'cm² 🎉' }; };
      if(phase==='a'){
        const t = data.sh[v];
        if(t !== LQ[this.meth][0]){
          const ng = m2 ? (t===LQ.m2[1] ? '三角形を ひいても、2回 数えた ところは のこるよ 🔍'
                                        : 'イを ひくと、イ 1つに もどって しまうよ 🔍')
                        : (t===LQ.m1[1] ? 'アから イを ひくと、葉っぱの 外の 白い ところに なるよ 🔍'
                                        : 'アから ウを ひくと 三角形に なるよ。半分の 形には 弧が あるね 🔍');
          return { ok:false, msg:ng };
        }
        adv('b');
        return { ok:true, done:false, msg: m2 ? 'ア ⭕ 正方形を ひくと 葉っぱが のこる' : 'イ − ウ ⭕ のこりが 半分の 形' };
      }
      if(same(v, data.ans)) return win();             // いきなり 葉っぱ ぜんぶを 答えても 正解
      if(m2){
        if(same(v, 2*data.vq))         return { ok:false, msg:'ア（正方形）を ひくのを わすれて いないかな？ 🔍' };
        if(same(v, 2*data.vq+data.vs)) return { ok:false, msg:'ア は ひくよ 🔍' };
        if(same(v, data.vq))           return { ok:false, msg:'イは 2つ たすよ 🔍' };
        if(dotMiss(v, data.ans))       return { ok:false, msg:'小数点の 位置を たしかめよう 🔍' };
        return { ok:false, msg:'イ ＋ イ − ア を 計算しよう 🔍' };
      }
      if(phase==='b'){
        if(same(v, data.half)){ adv('c'); return { ok:true, done:false, msg:'半分は '+fmt(data.half)+'cm² ⭕ つぎは 葉っぱ ぜんぶ' }; }
        if(same(v, data.vq+data.vt)) return { ok:false, msg:'ひき算だよ。イ − ウ 🔍' };
        if(dotMiss(v, data.half))    return { ok:false, msg:'小数点の 位置を たしかめよう 🔍' };
        return { ok:false, msg:fmt(data.vq)+' − '+fmt(data.vt)+' を 計算しよう 🔍' };
      }
      if(same(v, data.half))   return { ok:false, msg:'それは 半分の 面積。× 2 しよう 🔍' };
      if(dotMiss(v, data.ans)) return { ok:false, msg:'小数点の 位置を たしかめよう 🔍' };
      return { ok:false, msg:fmt(data.half)+' × 2 を 計算しよう 🔍' };
    }
  },

  /* ---------- いちょう形（先生の 映像） ----------
     補助線を ひいて、下の とがった 形を 半分ずつ 上の すみへ まわすと、たて a÷2・横 a の 長方形に なる（ISTEP）
     phase a … 補助線を マウス（ゆび）で ひく（IDRAW）・「▶ 次へ」で 進む、b … 面積を 入れる */
  icho: {
    icon:'🍂', label:'いちょう形',
    dec:true, unit:'cm²', noAutoNext:true,
    first:true,
    steps:['補助線を ひく','面積を 求める'],
    get input(){ return phase==='a' ? 'none' : 'number'; },
    get ctlHtml(){
      return '<div class="seg2"><button data-go="1" class="go">▶ もう一度 見る</button>'+
             '<button data-next="1" class="nx" style="visibility:hidden">▶ 次へ</button></div>';
    },
    onCtl(btn){
      if(btn.dataset.go){                              // はじめから いまの ところまで 自動で もう一度
        const to = phase==='a' ? (data.n||0) : ISTEP.length-1;
        if(to > 0){ data.rp = to; data.n = 0; data.tn = 0; data.ta = 0; data.drag = null; data.bad = null; refresh(); }
        return;
      }
      if(btn.dataset.next){
        if(!this.canNext()) return;
        data.n++; data.tn = Date.now();
        refresh();
      }
    },
    setup(){
      data.a = this.first ? 10 : pick([4,6,8,10]); this.first = false;
      data.ans = data.a*data.a/2;
      data.n = 0; data.tn = 0; data.ta = 0; data.rp = 0; data.td = 0; data.t0 = Date.now(); data.drag = null; data.bad = null; data.vFull = false;
      phase = 'a';
    },
    redo(){ phase = 'a'; data.n = 0; data.tn = 0; data.ta = 0; data.rp = 0; data.td = 0; data.t0 = Date.now(); data.drag = null; data.bad = null; data.vFull = false; applyInputUI(); },
    /* 補助線を マウス（ゆび）で ひく：キャンバスの 点 → 正方形の 中の 位置（左上 0,0 … 右下 1,1） */
    toU(p){ const k = this.k || 1; return { x:((p.x - (this.ox||0))/k - 47)/66, y:((p.y - (this.oy||0))/k - 22)/66 }; },
    canDraw(){ return phase==='a' && !data.rp && !this.stepBusy() && IDRAW[data.n||0] !== undefined; },
    onDown(p){ if(!this.canDraw()) return; const u = this.toU(p); data.drag = { x0:u.x, y0:u.y, x1:u.x, y1:u.y }; data.bad = null; },
    onMove(p){ if(!data.drag) return; const u = this.toU(p); data.drag.x1 = u.x; data.drag.y1 = u.y; },
    onUp(p){
      const d = data.drag; if(!d) return;
      data.drag = null;
      if(!this.canDraw()) return;
      const u = this.toU(p); d.x1 = u.x; d.y1 = u.y;
      if(Math.hypot(d.x1-d.x0, d.y1-d.y0) < 0.25) return;            // みじかすぎる（タップ）ときは なにも しない
      const near = (v, c) => Math.abs(v - c) <= 0.13;
      const isH = near(d.y0, .5) && near(d.y1, .5) && Math.abs(d.x1-d.x0) >= 0.55;   // 半円の はしと はしを むすぶ 横の 線
      const yT = Math.min(d.y0, d.y1), yB = Math.max(d.y0, d.y1);
      const isV = near(d.x0, .5) && near(d.x1, .5) && yT <= .63 && yB >= .87;   // 下の とがった 点まで の たての 線（横の 線の まん中から でも、上から でも よい）
      const want = IDRAW[data.n||0];
      if((want==='h' && isH) || (want==='v' && isV)){
        if(want==='v') data.vFull = yT <= .3;                      // 上まで ひいたか（下 半分だけなら 上の 半分は 6で 出す）
        data.n++; data.tn = Date.now();
        applyJudge({ ok:true, done:false, msg: want==='h' ? '横の 補助線 ⭕' : 'たての 補助線 ⭕' });
        return;
      }
      data.bad = { x0:d.x0, y0:d.y0, x1:d.x1, y1:d.y1, t:Date.now() };   // ちがう 線は 赤く して 消す（ミスには 数えない）
      const msg = (want==='h' && isV) ? 'たての 線も あとで つかうよ。まず 横に ひいて みよう 🔍'
                : (want==='v' && isH) ? '横の 線は もう ひいたね。下の 形を 2つに 分けよう 🔍'
                :                       'その 線では、形が うまく 分けられないね。もう一度 ひいて みよう 🔍';
      applyJudge({ ok:false, skip:true, msg:msg });
    },
    stg(k){                                            // だん k の すすみ（0〜1）
      const n = data.n || 0;
      if(k < n) return 1; if(k > n) return 0;
      const t = Math.max(0, Math.min(1, (Date.now() - data.tn) / ISTEP[k])); return t*t*(3-2*t);
    },
    stepBusy(){ return (data.n || 0) > 0 && Date.now() - data.tn < ISTEP[data.n]; },
    canNext(){
      const n = data.n || 0;
      return phase==='a' && !data.rp && Date.now() - data.t0 > 600 && !this.stepBusy()
             && ISTOP.indexOf(n) >= 0 && IDRAW[n] === undefined && n < ISTEP.length-1;
    },
    busy(){ return !!data.rp || this.stepBusy(); },
    step(){ return phase==='a' ? 0 : phase==='b' ? 1 : 2; },
    prompt(){
      const t = { a:'色を ぬった 部分の 面積を 求めましょう。',
                  b:'色を ぬった 部分の 面積は 何cm²？' }[phase];
      return '<span class="pq">'+(t || '色を ぬった 部分 ＝ '+fmt(data.ans)+'cm²')+'</span>';
    },
    draw(){
      const n = data.n || 0, last = ISTEP.length-1;
      const auto = data.rp ? n < data.rp : (phase==='a' && ISTOP.indexOf(n) < 0 && n < last);
      if(auto && !this.stepBusy()){                    // つぎの とまる だんまで 0.9秒ずつ 間を あけて 自動で（もう一度 見る ときは 0.3秒）
        if(!data.ta) data.ta = Date.now();
        else if(Date.now() - data.ta >= (data.rp ? 300 : LAUTO_GAP)){ data.n = n+1; data.tn = Date.now(); data.ta = 0; refresh(); }
      }else data.ta = 0;
      if(data.rp && (data.n||0) >= data.rp && !this.stepBusy()){ data.rp = 0; refresh(); }
      if(phase==='a' && !data.rp && (data.n||0) >= last && !this.stepBusy()){ nextPhase('b'); say(''); refresh(); }   // 長方形に なったら 面積を 入れる
      const bz = this.stepBusy();
      if(data.bz && !bz) refresh();                    // だんの 動きが おわったら ガイドを かえる
      data.bz = bz;
      const nxb = document.querySelector('#ctlRow .nx');
      if(nxb) nxb.style.visibility = this.canNext() ? 'visible' : 'hidden';   // 「▶ 次へ」を 待って いる ときだけ（場所は かえない）
      const k = Math.min(W/160, H/100), ox = (W-160*k)/2, oy = (H-100*k)/2;   // 160×100 の 中に かく
      this.k = k; this.ox = ox; this.oy = oy;                                   // マウスの 位置を なおす ため
      ctx.save();
      ctx.setTransform(DPR*k, 0, 0, DPR*k, DPR*ox, DPR*oy);
      try{ this.scene(); } finally { ctx.restore(); }
    },
    scene(){
      const SG = k => this.stg(k);
      const cl = t => Math.max(0, Math.min(1, t)), E = t => { t = cl(t); return t*t*(3-2*t); };
      const mix = (u, v, t) => u + (v-u)*t;
      const A  = (fn, al) => { if(!(al>0)) return; ctx.globalAlpha = cl(al); fn(); ctx.globalAlpha = 1; };
      const a = data.a, h = a/2;
      const s = 66, x0 = 47, y0 = 22, r = s/2;
      const Q = (x, y) => ({ x:x0+x*s, y:y0+y*s });
      const LEAF = '#f8dfa3', GREEN = '#82c341', COVER = '#155473', RED = '#e8121e';
      const LW = 0.8;
      const intro = E((Date.now() - (data.t0||0)) / 600);
      ctx.globalAlpha = 1;
      /* 形の 道（ふちは あとで かく） */
      const pShape = () => { const c = Q(.5,.5), cr = Q(1,1), cl0 = Q(0,1), p = Q(0,.5);
        ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.arc(c.x, c.y, r, Math.PI, 0);
        ctx.arc(cr.x, cr.y, r, Math.PI*1.5, Math.PI, true); ctx.arc(cl0.x, cl0.y, r, 0, Math.PI*1.5, true); ctx.closePath(); };
      const pSemi = () => { const c = Q(.5,.5), p = Q(0,.5);
        ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.arc(c.x, c.y, r, Math.PI, 0); ctx.closePath(); };
      const pLeft = () => { const p = Q(0,.5), m = Q(.5,.5), b = Q(.5,1), c = Q(0,1);   // 下の 左半分
        ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(m.x, m.y); ctx.lineTo(b.x, b.y); ctx.arc(c.x, c.y, r, 0, Math.PI*1.5, true); ctx.closePath(); };
      const pRight = () => { const p = Q(1,.5), m = Q(.5,.5), b = Q(.5,1), c = Q(1,1);  // 下の 右半分
        ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(m.x, m.y); ctx.lineTo(b.x, b.y); ctx.arc(c.x, c.y, r, Math.PI, Math.PI*1.5); ctx.closePath(); };
      const pCorner = () => { const p = Q(0,0), t = Q(.5,0), c = Q(.5,.5);              // 左上の すみ（半円の 外）
        ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(t.x, t.y); ctx.arc(c.x, c.y, r, Math.PI*1.5, Math.PI, true); ctx.closePath(); };
      const fillP = (fn, col) => { fn(); ctx.fillStyle = col; ctx.fill(); };
      const strokeP = (fn, lw, col) => { fn(); ctx.setLineDash([]); ctx.lineJoin = 'round'; ctx.lineWidth = lw; ctx.strokeStyle = col || C.ink; ctx.stroke(); };
      const rot = (piv, ang, fn) => { ctx.save(); ctx.translate(piv.x, piv.y); ctx.rotate(ang); ctx.translate(-piv.x, -piv.y); fn(); ctx.restore(); };
      const label = (x, y, t, sz) => {                            // 白い 下じきの 上に 文字（すきとおりは 外の A に まかせる）
        ctx.font = '900 '+sz+'px "Yusei Magic",sans-serif';
        const w = ctx.measureText(t).width + 1.6;
        ctx.fillStyle = '#fff'; ctx.fillRect(x-w/2, y-sz*0.6, w, sz*1.2);
        drawText(x, y, t, { size:sz, color:C.ink, halo:false });
      };

      const th  = E(SG(8)) * Math.PI/2;               // 8 下の 形を 上の すみへ まわす
      const fin = SG(9);                               // 9 長方形に なる
      const fa  = intro;                               // 正方形の わく・長さ
      const gA  = E(SG(6)/0.5) * (1 - SG(7));          // 6 同じ 形を 緑に → 7 きえる

      /* ---------- 色を ぬった 形 ---------- */
      A(()=>{
        if(th <= 0){ fillP(pShape, LEAF); }
        else{
          fillP(pSemi, LEAF);
          rot(Q(0,.5), -th, ()=> fillP(pLeft, LEAF));
          rot(Q(1,.5),  th, ()=> fillP(pRight, LEAF));
        }
      }, intro);
      A(()=>{ fillP(pCorner, GREEN); fillP(pLeft, GREEN); }, gA);
      /* ---------- 正方形の わく・直角・長さ ---------- */
      A(()=>{
        const TL = Q(0,0), BR = Q(1,1);
        ctx.setLineDash([]); ctx.lineWidth = 0.9; ctx.strokeStyle = C.ink; ctx.lineJoin = 'miter';
        ctx.strokeRect(TL.x, TL.y, s, s);
        const m = s*0.05;
        [[Q(0,0),1,1],[Q(1,0),-1,1],[Q(0,1),1,-1],[Q(1,1),-1,-1]].forEach(([p,ux,uy])=>
          drawPoly([{x:p.x+ux*m,y:p.y},{x:p.x+ux*m,y:p.y+uy*m},{x:p.x,y:p.y+uy*m}], { stroke:C.ink, lw:0.45, open:true }));
        ctx.setLineDash([1.4,1.1]); ctx.lineWidth = 0.45; ctx.strokeStyle = '#7d8796';
        ctx.beginPath(); ctx.moveTo(TL.x, TL.y-1); ctx.quadraticCurveTo(x0+s/2, y0-16, BR.x, TL.y-1); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(TL.x-1, TL.y); ctx.quadraticCurveTo(x0-14, y0+s/4, TL.x-1, y0+s/2); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(TL.x-1, y0+s/2); ctx.quadraticCurveTo(x0-14, y0+s*3/4, TL.x-1, BR.y); ctx.stroke();
        ctx.setLineDash([]);
        label(x0+s/2, y0-8.5, a+'cm', 6);
        label(x0-8, y0+s/4, h+'cm', 5.6);
        label(x0-8, y0+s*3/4, h+'cm', 5.6);
      }, fa);
      /* ---------- 形の ふち ---------- */
      A(()=>{
        const c = Q(.5,.5), cr = Q(1,1), cl0 = Q(0,1);
        ctx.setLineDash([]); ctx.lineCap = 'round'; ctx.strokeStyle = C.ink; ctx.lineWidth = LW;
        ctx.beginPath(); ctx.arc(cr.x, cr.y, r, Math.PI, Math.PI*1.5); ctx.stroke();          // 下の 弧（いつも のこす）
        ctx.beginPath(); ctx.arc(cl0.x, cl0.y, r, Math.PI*1.5, Math.PI*2); ctx.stroke();
        ctx.globalAlpha = intro * (1 - 0.78*fin);                                                // 上の 半円の 弧（9で うすく）
        ctx.beginPath(); ctx.arc(c.x, c.y, r, Math.PI, 0); ctx.stroke();
      }, intro);
      if(th > 0){                                      // うごく 形の ふち（9で 長方形の ふちに なる）
        A(()=>{
          rot(Q(0,.5), -th, ()=> strokeP(pLeft, 0.7));
          rot(Q(1,.5),  th, ()=> strokeP(pRight, 0.7));
        }, 1 - fin);
      }
      /* ---------- 「補助線」（はじめから） ---------- */
      A(()=> drawText(142, 12, '補助線', { size:9, color:RED, halo:false }), intro);
      /* ---------- 1 横の 補助線  5 たての 補助線（ひいた 線を ぴったりに なおす。もう一度 見る ときは のびる） ---------- */
      const dot = (p, al) => A(()=>{ ctx.beginPath(); ctx.arc(p.x, p.y, 1.5, 0, Math.PI*2); ctx.fillStyle = '#222'; ctx.fill(); }, al);
      const grow = k => data.rp ? E(SG(k)/0.8) : (SG(k) > 0 ? 1 : 0);
      if(SG(1) > 0) drawLine(Q(0,.5), Q(grow(1),.5), { color:C.ink, lw:LW });
      if(SG(5) > 0){
        const vf = data.vFull, y0v = vf ? 0 : .5, yb = mix(y0v, 1, grow(5));      // 上から ひいたら 上から、横の 線の まん中から なら そこから
        if(vf) A(()=> drawLine(Q(.5,0), Q(.5, Math.min(yb,.5)), { color:C.ink, lw:0.6 }), 1 - 0.78*fin);   // 上の 半分（9で うすく）
        else   A(()=> drawLine(Q(.5,0), Q(.5,.5), { color:C.ink, lw:0.6 }), E(SG(6)/0.5) * (1 - 0.78*fin));  // 下 半分だけ ひいたときは 6で 上の 半分も
        if(yb > .5) drawLine(Q(.5,.5), Q(.5,yb), { color:C.ink, lw:0.6 });
      }
      const dA = k => SG(k) > 0 ? Math.sin(Math.PI*SG(k)) : 0;                    // 点は 出て、きえる
      dot(Q(0,.5), dA(1)); dot(Q(1,.5), dA(1));
      dot(Q(.5, data.vFull ? 0 : .5), dA(5)); dot(Q(.5,1), dA(5));
      /* ---------- 線を ひいて いる ところ・ちがう 線（赤く して きえる）・ヒントの 点 ---------- */
      if(data.drag){ const d = data.drag; drawLine(Q(d.x0,d.y0), Q(d.x1,d.y1), { color:C.ink, lw:0.8 }); }
      if(data.bad){
        const d = data.bad, al = 1 - E((Date.now() - d.t - 500)/700);
        if(al > 0) A(()=> drawLine(Q(d.x0,d.y0), Q(d.x1,d.y1), { color:RED, lw:0.8 }), al); else data.bad = null;
      }
      if(hintOn && this.canDraw()){
        const al = 0.55 + 0.45*Math.sin(Date.now()/260), w = IDRAW[data.n||0];
        if(w==='h'){ dot(Q(0,.5), al); dot(Q(1,.5), al); } else { dot(Q(.5,.5), al); dot(Q(.5,1), al); }
      }
      /* ---------- 9 長方形の ふち ---------- */
      A(()=>{ const TL = Q(0,0); ctx.setLineDash([]); ctx.lineJoin = 'miter'; ctx.lineWidth = 1.1; ctx.strokeStyle = C.ink;
              ctx.strokeRect(TL.x, TL.y, s, s/2); }, fin);
      /* ---------- 2〜4 かくす（下 → 上） ---------- */
      if(SG(2) > 0){
        const t = E(SG(3)), yt = mix(.5, -.27, t), yb = mix(1.17, .5, t);
        const p0 = Q(-.55, yt), p1 = Q(1.22, yb);
        A(()=>{ ctx.fillStyle = COVER; ctx.fillRect(p0.x, p0.y, p1.x-p0.x, p1.y-p0.y); }, E(SG(2)/0.3) * (1 - SG(4)));
      }
      /* ---------- こたえ（せいかいの あと） ---------- */
      if(phase==='done' && data.td){
        const al = E((Date.now() - data.td)/700);
        A(()=> drawText(141, 42, h+' × '+a, { size:8, color:C.ink, halo:false }), al);
        A(()=>{
          const t = '＝ '+fmt(data.ans)+'cm²';
          ctx.font = '900 7.5px "Yusei Magic",sans-serif';
          const w = ctx.measureText(t).width + 4, cx = 141, cy = 55;
          rrPath(cx-w/2, cy-5.6, w, 11.2, 2); ctx.fillStyle = '#fff36b'; ctx.fill();
          ctx.lineWidth = 0.6; ctx.strokeStyle = '#e8b52e'; ctx.stroke();
          drawText(cx, cy, t, { size:7.5, color:C.coral, halo:false });
        }, al);
      }
    },
    guide(){
      const n = data.n || 0, h = data.a/2;
      if(phase==='a'){
        if(data.rp || ISTOP.indexOf(n) < 0 || this.stepBusy()) return 'よく 見て みよう。';
        return { 0:'どこに 補助線を ひくと いいかな？ 図の 上を なぞって、線を ひこう。',
                 1:'横に 補助線を ひいたね。上と 下は、どんな 形かな？「▶ 次へ」を 押そう。',
                 3:'上は 半円、下は とがった 形だね。「▶ 次へ」を 押そう。',
                 4:'下の とがった 形を 2つに 分ける 補助線を ひこう。図の 上を なぞってね。',
                 6:'緑の 2つは 同じ 形だね。下の 形を 上へ うごかすと…？「▶ 次へ」を 押そう。' }[n];
      }
      if(phase==='b') return data.rp ? 'よく 見て みよう。' : '長方形に なったね！ たて '+h+'cm、横 '+data.a+'cm の 長方形の 面積を 計算しよう。';
      return h+' × '+data.a+' ＝ '+fmt(data.ans)+'cm²。いちょう形は 長方形と 同じ 面積だね！';
    },
    hint(){
      if(phase==='a'){
        const w = IDRAW[data.n||0];
        if(w==='h') return '半円の 左はしと 右はし（図の 点）を むすんで みよう。';
        if(w==='v') return '横の 補助線の まん中と、下の とがった ところ（図の 点）を むすんで みよう。';
        return '補助線を ひいて 形を 分けると、同じ 形が 見つかるよ。';
      }
      if(phase==='b') return '長方形の 面積 ＝ たて × 横 → '+(data.a/2)+' × '+data.a;
      return null;
    },
    check(v){
      if(phase!=='b') return null;
      if(this.busy()) return { ok:false, skip:true, msg:'👀 動きが おわってから こたえよう' };
      const a = data.a, h = a/2, semi = h*h*PI_/2;
      if(same(v, data.ans)){ phase = 'done'; data.td = Date.now(); return { ok:true, msg:'せいかい！ '+fmt(data.ans)+'cm² 🎉' }; }
      if(same(v, semi))            return { ok:false, msg:'それは 上の 半円だけ だよ 🔍' };
      if(same(v, data.ans-semi))   return { ok:false, msg:'それは 下の とがった 形だけ だよ 🔍' };
      if(same(v, a*a))             return { ok:false, msg:'それは 正方形 ぜんぶ。色の 部分は 長方形だよ 🔍' };
      if(same(v, h*h*PI_))         return { ok:false, msg:'それは 円 ぜんぶの 面積だよ 🔍' };
      if(same(v, h*h))             return { ok:false, msg:'たては '+h+'cm、横は '+a+'cm だよ 🔍' };
      if(same(v, 2*(h+a)))         return { ok:false, msg:'それは まわりの 長さ。面積は たて × 横 🔍' };
      if(dotMiss(v, data.ans))     return { ok:false, msg:'小数点の 位置を たしかめよう 🔍' };
      return { ok:false, msg:'長方形の たて × 横 を 計算しよう 🔍' };
    }
  },

  /* ---------- 逆三角形（先生の 映像） ----------
     たて a・横 2a の 長方形から 4分の1の 円 2つを ひいた 形。左右の 白い 部分を 入れかえると 半円に なる → 長方形 − 半円
     1 ← の 矢印  2 → の 矢印  3 矢印が きえる  4 白い 部分を 入れかえる  5 まん中の 線が きえる（半円）
     6 小さく して 左へ  7 半円を 外へ  8「−」「＝」・もとの 形・÷2  9 a×2a  10 − a×a×3.14÷2 ＝ */
  gyaku: animMode({
    icon:'🔻', label:'逆三角形',
    a0:8, as:[4,6,8,10],
    area: a => 2*a*a - a*a*PI_/2,
    ST:   [0, 1300, 1300, 700, 2500, 900, 1800, 1800, 1200, 1000, 1200],
    STOP: [0, 2, 5, 8],
    view(U){ const t = U.E(U.SG(6)), A0 = [14, 9, 132, 71], A1 = [10, 17, 142, 43]; return A0.map((v,i) => v + (A1[i]-v)*t); },   // 6で 小さく なると 式の 段に ズーム
    scene(U){
      const { SG, E, mix, A, T, dim, arrow, ans, sym, LEAF, RED, GHOST } = U, a = data.a;
      const big = { x:36, y:24, u:44 }, s1 = { x:15, y:23, u:17 }, s3 = { x:113, y:23, u:17 }, S2 = { x:81, y:40, r:17 };
      const Pt = (g, x, y) => ({ x:g.x + x*g.u, y:g.y + y*g.u });
      const piece = (c, u, a0, a1) => { ctx.beginPath(); ctx.moveTo(c.x, c.y); ctx.arc(c.x, c.y, u, a0, a1); ctx.closePath(); };
      const fig = (g, sw, edgeA, lw) => {                // 長方形と 白い 4分の1の 円 2つ（sw：入れかえ 0〜1）
        const TL = Pt(g, 0, 0), cL = Pt(g, sw, 1), cR = Pt(g, 2-sw, 1);
        ctx.fillStyle = LEAF; ctx.fillRect(TL.x, TL.y, 2*g.u, g.u);
        ctx.fillStyle = '#fff';
        piece(cL, g.u, -Math.PI/2, 0); ctx.fill();
        piece(cR, g.u, Math.PI, Math.PI*1.5); ctx.fill();
        if(sw >= 1){ const c = Pt(g, 1, 1); ctx.beginPath(); ctx.moveTo(c.x-g.u, c.y); ctx.arc(c.x, c.y, g.u, Math.PI, 0); ctx.closePath(); ctx.fill(); }   // つなぎめを 消す
        ctx.setLineDash([]); ctx.strokeStyle = C.ink; ctx.lineWidth = lw; ctx.lineJoin = 'round';
        A(()=>{ piece(cL, g.u, -Math.PI/2, 0); ctx.stroke(); piece(cR, g.u, Math.PI, Math.PI*1.5); ctx.stroke(); }, edgeA);
        ctx.beginPath(); ctx.arc(cL.x, cL.y, g.u, -Math.PI/2, 0); ctx.stroke();
        ctx.beginPath(); ctx.arc(cR.x, cR.y, g.u, Math.PI, Math.PI*1.5); ctx.stroke();
        ctx.strokeRect(TL.x, TL.y, 2*g.u, g.u);
      };
      const semi = (c, r, lw) => {                       // 白い 半円
        ctx.beginPath(); ctx.moveTo(c.x-r, c.y); ctx.arc(c.x, c.y, r, Math.PI, 0); ctx.closePath();
        ctx.fillStyle = '#fff'; ctx.fill(); ctx.setLineDash([]); ctx.lineWidth = lw; ctx.strokeStyle = C.ink; ctx.stroke();
      };
      const sh = E(SG(6)), out = E(SG(7));
      const o = { x:mix(big.x, s1.x, sh), y:mix(big.y, s1.y, sh), u:mix(big.u, s1.u, sh) };
      const lw = mix(0.8, 0.6, sh);
      if(out <= 0) fig(o, E(SG(4)), 1 - SG(5), lw);
      else{                                              // 7 長方形（黄色）を のこして 半円を 外へ
        const TL = Pt(o, 0, 0), c0 = Pt(o, 1, 1);
        ctx.fillStyle = LEAF; ctx.fillRect(TL.x, TL.y, 2*o.u, o.u);
        ctx.beginPath(); ctx.arc(c0.x, c0.y, o.u, Math.PI, 0); ctx.lineWidth = 0.5; ctx.strokeStyle = GHOST; ctx.stroke();
        ctx.lineWidth = lw; ctx.strokeStyle = C.ink; ctx.strokeRect(TL.x, TL.y, 2*o.u, o.u);
        semi({ x:mix(c0.x, S2.x, out), y:mix(c0.y, S2.y, out) }, mix(o.u, S2.r, out), lw);
      }
      A(()=>{                                            // 長さ（小さく なると きえる）
        const TL = Pt(o, 0, 0);
        dim({ x:TL.x, y:TL.y-1 }, { x:TL.x+2*o.u, y:TL.y-1 }, -9, (2*a)+'cm', 6);
        dim({ x:TL.x-1, y:TL.y }, { x:TL.x-1, y:TL.y+o.u }, 14, a+'cm');
        dim({ x:TL.x, y:TL.y+o.u+1 }, { x:TL.x+o.u, y:TL.y+o.u+1 }, 8, a+'cm');
      }, 1 - sh);
      // 1〜3 入れかえの 矢印
      if(SG(1) > 0) A(()=> arrow(Pt(big, 1.6, 0.42), Pt(big, 0.4, 0.42), E(SG(1)/0.8), RED, 0.7), 1 - SG(3));
      if(SG(2) > 0) A(()=> arrow(Pt(big, 0.4, 0.66), Pt(big, 1.6, 0.66), E(SG(2)/0.8), RED, 0.7), 1 - SG(3));
      // 8 長方形 − 半円 ＝ もとの 形
      sym(56, 32, '−', SG(8)); sym(106, 32, '＝', SG(8));
      T(S2.x, S2.y-6.5, '÷2', 6.5, C.ink, SG(8));
      A(()=> fig(s3, 0, 1, 0.6), SG(8));
      // 9・10 式
      T(32, 52, a+'×'+(2*a), 6, C.ink, SG(9), 32);
      T(56, 52, '−', 6, C.ink, SG(10)); T(81, 52, a+'×'+a+'×3.14÷2', 6, C.ink, SG(10), 34); T(106, 52, '＝', 6, C.ink, SG(10));
      ans(130, 52);
    },
    gA(n){
      return { 0:'色を ぬった 部分は、このままでは 求めにくいね。「▶ 次へ」を 押そう。',
               2:'左と 右の 白い 部分を 入れかえると、どう なるかな？「▶ 次へ」を 押そう。',
               5:'白い 部分が 半円に なったね！ 色の 部分は 長方形から 半円を ひいた 形。「▶ 次へ」を 押そう。',
               8:'長方形 − 半円 ＝ 色を ぬった 部分 だね。「▶ 次へ」で 式を 見よう。' }[n];
    },
    gB(){ const a = data.a; return a+'×'+(2*a)+' − '+a+'×'+a+'×3.14÷2 を 計算しよう。小数点は「．」で 入れるよ。'; },
    gD(){ const a = data.a; return a+'×'+(2*a)+' − '+a+'×'+a+'×3.14÷2 ＝ '+fmt(data.ans)+'cm²。白い 部分を 入れかえると 求めやすいね！'; },
    hA(){ return '左右の 白い 部分（4分の1の 円）を 入れかえて みよう。'; },
    hB(){ const a = data.a; return a+'×'+(2*a)+' ＝ '+fmt(2*a*a)+'、'+a+'×'+a+'×3.14÷2 ＝ '+fmt(a*a*PI_/2)+'。ひき算を しよう。'; },
    wrong: a => [[2*a*a, '長方形 ぜんぶの 面積だよ。半円を ひこう 🔍'],
                 [a*a*PI_/2, 'それは 白い 半円の 面積。長方形から ひこう 🔍'],
                 [a*a*PI_, '円 ぜんぶの 面積だよ。半円は ÷2 🔍'],
                 [2*a*a + a*a*PI_/2, 'たすのでは なく、ひくよ 🔍']],
    ng: '長方形 − 半円 を 計算しよう 🔍'
  }),

  /* ---------- UFO（先生の 映像） ----------
     半径 a の 半円と、半径 a÷2 の 半円 2つを 組み合わせた 形。下の 半円 2つを 合わせると 円 → 半円 ＋ 円
     1 下を はなす  2 右の 半円を まわして 円に  3 半径  4 円を 右へ  5 小さく して 式の 形・÷2  6 a×a×3.14÷2  7 ＋ r×r×3.14 ＝ */
  ufo: animMode({
    icon:'🛸', label:'UFO形',
    a0:10, as:[4,6,8,10],
    area: a => a*a*PI_/2 + (a/2)*(a/2)*PI_,
    ST:   [0, 1500, 2500, 1000, 1800, 1800, 1000, 1200],
    STOP: [0, 1, 3, 5],
    view(U){ const t = U.E(U.SG(5)), A0 = [20, 8, 140, 82], A1 = [12, 11, 138, 46]; return A0.map((v,i) => v + (A1[i]-v)*t); },   // 5で 小さく なると 式の 段に ズーム
    scene(U){
      const { SG, E, mix, A, T, dim, ans, sym, LEAF } = U, a = data.a, r = a/2;
      const C0 = { x:72, y:46 }, R0 = 34, r0 = 17;
      const s1 = { x:36, y:32, R:18 }, s2 = { x:82, y:23, r:9 }, s3 = { x:124, y:28, R:13 };
      const dashL = (x0, x1, y, lw) => drawLine({ x:x0, y:y }, { x:x1, y:y }, { color:C.ink, lw:lw||0.4, dash:[1.2,1] });
      const dot = (x, y) => { ctx.beginPath(); ctx.arc(x, y, 0.8, 0, Math.PI*2); ctx.fillStyle = C.ink; ctx.fill(); };
      const half = (c, R, up, lw, fill) => {             // 半円（up：上 向き）。弧は 線、直径は 点線
        const a0 = up ? Math.PI : 0, a1 = up ? Math.PI*2 : Math.PI;
        ctx.beginPath(); ctx.moveTo(c.x+R*Math.cos(a0), c.y); ctx.arc(c.x, c.y, R, a0, a1); ctx.closePath();
        ctx.fillStyle = fill || LEAF; ctx.fill();
        ctx.beginPath(); ctx.arc(c.x, c.y, R, a0, a1); ctx.setLineDash([]); ctx.lineWidth = lw; ctx.strokeStyle = C.ink; ctx.stroke();
        dashL(c.x-R, c.x+R, c.y);
      };
      const ufoFig = (c, R, lw) => {                      // UFOの 形（小さい 図）
        half(c, R, true, lw); half({ x:c.x-R/2, y:c.y }, R/2, false, lw); half({ x:c.x+R/2, y:c.y }, R/2, false, lw);
        dot(c.x-R/2, c.y); dot(c.x, c.y); dot(c.x+R/2, c.y);
      };
      const dy = 20*E(SG(1)), th = Math.PI*E(SG(2)), mv = E(SG(4)), sh = E(SG(5));
      const lw = mix(0.8, 0.6, sh);
      // 大きい 半円
      const Cb = { x:mix(C0.x, s1.x, sh), y:mix(C0.y, s1.y, sh) }, Rb = mix(R0, s1.R, sh);
      half(Cb, Rb, true, lw); dot(Cb.x, Cb.y);
      if(SG(1) <= 0){ dot(Cb.x-Rb/2, Cb.y); dot(Cb.x+Rb/2, Cb.y); }
      A(()=> dim({ x:Cb.x-Rb, y:Cb.y-0.6 }, { x:Cb.x, y:Cb.y-0.6 }, -7, a+'cm', 5.4), 1 - sh);
      // 下の 小さい 半円 2つ → 円
      const L = { x:C0.x-r0, y:C0.y+dy }, J = { x:C0.x, y:C0.y+dy };
      if(SG(2) > 0) A(()=> half({ x:C0.x+r0, y:J.y }, r0, false, 0.4, '#fbf3df'), 0.7*(1 - mv));   // もとの 場所（うすく）
      if(SG(4) <= 0){
        half(L, r0, false, lw); dot(L.x, L.y);
        ctx.save(); ctx.translate(J.x, J.y); ctx.rotate(-th); ctx.translate(-J.x, -J.y);
        half({ x:C0.x+r0, y:J.y }, r0, false, lw); dot(C0.x+r0, J.y);
        ctx.restore();
        if(SG(1) > 0) dot(J.x, J.y);
      }else{
        const c1 = { x:C0.x+R0+r0+3, y:C0.y };
        const cc = sh > 0 ? { x:mix(c1.x, s2.x, sh), y:mix(c1.y, s2.y, sh) } : { x:mix(L.x, c1.x, mv), y:mix(L.y, c1.y, mv) };
        const rr = mix(r0, s2.r, sh);
        ctx.beginPath(); ctx.arc(cc.x, cc.y, rr, 0, Math.PI*2); ctx.fillStyle = LEAF; ctx.fill();
        ctx.setLineDash([]); ctx.lineWidth = lw; ctx.strokeStyle = C.ink; ctx.stroke();
        dashL(cc.x-rr, cc.x+rr, cc.y); dot(cc.x, cc.y);
      }
      // 3 円の 直径・半径（UFOの 半径 ＝ 円の 直径）
      if(SG(3) > 0){
        const c1 = { x:C0.x+R0+r0+3, y:C0.y };
        const cc = SG(4) <= 0 ? L : (sh > 0 ? { x:mix(c1.x, s2.x, sh), y:mix(c1.y, s2.y, sh) } : { x:mix(L.x, c1.x, mv), y:mix(L.y, c1.y, mv) });
        const rr = mix(r0, s2.r, sh), fz = mix(5, 3.6, sh);
        T(cc.x, cc.y-rr*0.32, a+'cm', fz, C.ink, SG(3));
        T(cc.x-rr*0.42, cc.y+rr*0.32, fmt(r)+'cm', fz, C.ink, SG(3));
      }
      // 5 半円 ＋ 円 ＝ UFO
      sym(60, 25, '＋', SG(5)); sym(101, 25, '＝', SG(5));
      T(s1.x, s1.y-8, '÷2', 6.5, C.ink, SG(5));
      A(()=> ufoFig(s3, s3.R, 0.5), SG(5));
      // 6・7 式
      T(36, 50, a+'×'+a+'×3.14÷2', 6, C.ink, SG(6), 40);
      T(60, 50, '＋', 6, C.ink, SG(7)); T(82, 50, fmt(r)+'×'+fmt(r)+'×3.14', 6, C.ink, SG(7), 32); T(101, 50, '＝', 6, C.ink, SG(7));
      ans(124, 50);
    },
    gA(n){
      return { 0:'色を ぬった 部分は、どんな 形が 組み合わさって いるかな？「▶ 次へ」を 押そう。',
               1:'上は 大きい 半円、下は 小さい 半円が 2つ。下の 2つを 合わせると…？「▶ 次へ」を 押そう。',
               3:'小さい 半円 2つで、円が 1つ できたね（半径 '+fmt(data.a/2)+'cm）。「▶ 次へ」を 押そう。',

        const o = { x:mix(big.x, s1.x, sh), y:mix(big.y, s1.y, sh), u:mix(big.u, s1.u, sh) }, lw = mix(0.8, 0.6, sh);

    icon:'⚖️', label:'どっち？',

      const NS = { 4:[1,2,4], 6:[1,2,3], 8:[1,2,4] };

    calc(sd, n){ const rr = sd/(2*n); return fmt(rr)+'×'+fmt(rr)+'×3.14'+(n>1 ? '×'+(n*n) : '')+'＝'+fmt(sd*sd*PI_/4); },
    draw(){

        const x0 = z[0], sd = z[1], n = z[2], nm = z[3], y0 = m - sd;
        const TL = f.tf({x:x0,y:y0}), BR = f.tf({x:x0+sd,y:y0+sd}), s = f.s;
        const sq = [TL, {x:BR.x,y:TL.y}, BR, {x:TL.x,y:BR.y}];
        drawPoly(sq, { fill:'#fff', stroke:C.ink, lw:3 });
        const rr = sd/(2*n);
        for(let i=0;i<n;i++) for(let j=0;j<n;j++){
          const cc = f.tf({ x:x0+rr*(2*i+1), y:y0+rr*(2*j+1) });

      });

    guide(){
      if(phase==='done') return 'A：'+this.calc(data.a,data.na)+'　B：'+this.calc(data.b,data.nb);
      return '1つの 円の 面積 × 円の 数 で くらべよう。';
    },

    input:'none', noAutoNext:true,

    prompt(){ return '<span class="pq">3.14 の かけ算の 答えを 見て みよう。</span>'; },
    draw(){
      const k = Math.min(W/160, H/100), ox = (W-160*k)/2, oy = (H-100*k)/2;   // 160×100 の 仮の座標
      ctx.save();
      ctx.setTransform(DPR*k, 0, 0, DPR*k, DPR*ox, DPR*oy);
      try{ this.scene(); } finally { ctx.restore(); }
    },
    scene(){
      const T = (x, y, t, sz, col, al) => drawText(x, y, t, { size:sz, color:col||C.ink, align:al||'center', halo:false });
      const tb = (x0, w, title, rows) => {
        rrPath(x0, 2, w, 96, 3); ctx.fillStyle = '#fffdf3'; ctx.fill();
        ctx.lineWidth = 0.7; ctx.strokeStyle = '#e8c85a'; ctx.stroke();
        T(x0+w/2, 9.5, title, 5.8, '#8a6d1f');
        const sz = 5.2, g = 2;
        ctx.font = '900 '+sz+'px "Yusei Magic",sans-serif';
        const we = Math.max(...rows.map(r => ctx.measureText(r[0]).width));
        const wq = ctx.measureText('＝').width;
        const wv = Math.max(...rows.map(r => ctx.measureText(r[1]).width));
        const xs = x0 + (w - (we + g + wq + g + wv))/2;           // 式・＝・答え の 3列を まん中に
        rows.forEach((r, i) => {
          const y = 19 + i*8;
          if(i%2===0){ ctx.fillStyle = 'rgba(255,226,122,.30)'; ctx.fillRect(x0+2, y-4, w-4, 8); }
          T(xs+we, y, r[0], sz, C.ink, 'right');
          T(xs+we+g, y, '＝', sz, C.ink, 'left');
          T(xs+we+g+wq+g+wv, y, r[1], sz, C.coral, 'right');
        });
      };
      const A = [], B = [];
      for(let n=1;n<=10;n++){
        A.push(['3.14 × '+n, fmt(3.14*n)]);
        B.push([n+' × '+n+' × 3.14', fmt(n*n*3.14)]);
      }
      tb(3, 68, '3.14 の だん', A);
      tb(74, 83, '半径 × 半径 × 3.14', B);
    },
    guide(){ return '3.14 × □ の 計算は、この 表を 見ると すぐ わかるよ。半径 × 半径 × 3.14 の 答えも のって いるよ。'; }
  }

};

/* ---- キャンバスの 大きさ ---- */
function isStacked(){
  try{ return getComputedStyle(document.documentElement).getPropertyValue('--stack').trim()==='1'; }
  catch(e){ return false; }
}
const CANVAS_AR_MIN = 0.52;   // たて/よこ の 下限
const CANVAS_AR_MAX = 1.00;   // たて/よこ の 上限
function resize(){
  const box = cv.parentElement, pad = 14;
  let cssW, cssH;
  if(isStacked()){
    cssW = Math.max(280, box.clientWidth - pad);
    cssH = Math.round(cssW * 0.68);
  }else{
    cssW = Math.max(240, box.clientWidth  - pad);
    cssH = Math.max(180, box.clientHeight - pad);
    const ar = cssH / cssW;
    if(ar > CANVAS_AR_MAX) cssH = Math.round(cssW * CANVAS_AR_MAX);
    const arMin = (M && M.arMin) || CANVAS_AR_MIN;   // モードで arMin を 書くと 横長に できる
    if(ar < arMin) cssW = Math.round(cssH / arMin);
  }
  DPR = Math.min(window.devicePixelRatio||1, 2.5);
  cv.style.width  = cssW+'px';
  cv.style.height = cssH+'px';
  cv.width  = Math.round(cssW*DPR);
  cv.height = Math.round(cssH*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  W=cssW; H=cssH;
  if(M && M.onResize) M.onResize();
}

/* ============================================================

function clear(){ ctx.clearRect(0,0,W,H); }

/* 図の 問題文を キャンバスの 上に かく。いちばん下の y を かえす */
function promptFs(){ return Math.max(15, Math.min(32, H*0.068)); }
function promptBand(n){ return Math.max(8, H*0.025) + promptFs()*1.35*n + 6; }
function drawPrompt(lines, col){
  let fs = promptFs();
  ctx.textAlign='center'; ctx.textBaseline='middle';
  const fontOf = f => '900 '+f+'px "Yusei Magic",sans-serif';
  ctx.font = fontOf(fs);
  const maxW = Math.max(...lines.map(t=>ctx.measureText(t).width));
  const room = W*0.90;
  if(maxW > room){ fs = Math.max(12, fs*room/maxW); ctx.font = fontOf(fs); }
  const lh = fs*1.35, top = Math.max(8, H*0.025);
  lines.forEach((t,i)=>{
    const y = top + lh*(i+0.5);
    ctx.lineWidth=6; ctx.lineJoin='round'; ctx.strokeStyle='#fff'; ctx.strokeText(t, W/2, y);
    ctx.fillStyle = col || C.coral; ctx.fillText(t, W/2, y);
  });
  return top + lh*lines.length;
}

/* 図を おく わく。x0〜y1 は 0〜1 の わりあい */
function region(x0,y0,x1,y1){ return { x0:W*x0, y0:H*y0, x1:W*x1, y1:H*y1 }; }
/* 問題文（lines 行）の 下に わくを つくる */
function regionUnder(lines, x0, x1, bottom){
  return { x0:W*x0, y0:promptBand(lines), x1:W*x1, y1:H*(bottom===undefined?0.97:bottom) };
}
/* 点の あつまりを わくに ぴったり おさめる 変換を つくる。
   かえり値 { s:ばいりつ, tf(p):変換した点 } */
function fitTo(pts, rg, pad){
  pad = (pad===undefined) ? 24 : pad;
  let minX=1e9,maxX=-1e9,minY=1e9,maxY=-1e9;
  pts.forEach(p=>{ minX=Math.min(minX,p.x); maxX=Math.max(maxX,p.x);
                   minY=Math.min(minY,p.y); maxY=Math.max(maxY,p.y); });
  const w = Math.max(1e-6, maxX-minX), h = Math.max(1e-6, maxY-minY);
  const bw = Math.max(20, (rg.x1-rg.x0) - pad*2), bh = Math.max(20, (rg.y1-rg.y0) - pad*2);
  const s  = Math.min(bw/w, bh/h);
  const cx = (rg.x0+rg.x1)/2, cy = (rg.y0+rg.y1)/2;
  const tx = cx - ((minX+maxX)/2)*s, ty = cy - ((minY+maxY)/2)*s;
  return { s:s, tf:p=>({ x:p.x*s+tx, y:p.y*s+ty }) };
}
/* 2つ以上の 図を「同じ ばいりつ」で ならべたい ときは、
   ぜんぶの 点を まとめて fitTo に わたしてから、図ごとに tf する */

function center(pts){
  let x=0,y=0; pts.forEach(p=>{ x+=p.x; y+=p.y; });
  return { x:x/pts.length, y:y/pts.length };
}
function dist(a,b){ return Math.hypot(a.x-b.x, a.y-b.y); }

function drawPoly(pts, o){
  o = o || {};
  ctx.beginPath();
  pts.forEach((p,i)=> i ? ctx.lineTo(p.x,p.y) : ctx.moveTo(p.x,p.y));
  if(o.open!==true) ctx.closePath();
  if(o.fill){ ctx.fillStyle=o.fill; ctx.fill(); }
  if(o.stroke!==null){
    ctx.setLineDash(o.dash || []);
    ctx.lineJoin='round'; ctx.lineCap='round';
    ctx.lineWidth = o.lw || 4;
    ctx.strokeStyle = o.stroke || C.ink;
    ctx.stroke();
    ctx.setLineDash([]);
  }
}
function drawLine(a, b, o){
  o = o || {};
  ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y);
  ctx.setLineDash(o.dash || []); ctx.lineCap='round';
  ctx.lineWidth = o.lw || 3; ctx.strokeStyle = o.color || C.ink;
  ctx.stroke(); ctx.setLineDash([]);
}
function drawDot(p, r, color){
  ctx.beginPath(); ctx.arc(p.x, p.y, r||6, 0, Math.PI*2);
  ctx.fillStyle = color || C.ink; ctx.fill();
  ctx.lineWidth=2; ctx.strokeStyle='#fff'; ctx.stroke();
}
/* ゆっくり 大きくなる 赤い わ（「ここを さわって」の 合図） */
function drawRing(p, r, color){
  const k = 1 + 0.12*Math.sin(Date.now()/260);
  ctx.beginPath(); ctx.arc(p.x, p.y, (r||14)*k, 0, Math.PI*2);
  ctx.lineWidth=3; ctx.strokeStyle = color || C.coral; ctx.stroke();
}
function drawText(x, y, t, o){
  o = o || {};
  ctx.textAlign = o.align || 'center';
  ctx.textBaseline = o.baseline || 'middle';
  ctx.font = '900 '+(o.size||18)+'px "Yusei Magic",sans-serif';
  if(o.halo!==false){ ctx.lineWidth=5; ctx.lineJoin='round'; ctx.strokeStyle='#fff'; ctx.strokeText(t,x,y); }
  ctx.fillStyle = o.color || C.ink;
  ctx.fillText(t, x, y);
}
/* 辺 a-b の 外がわに 長さなどを かく。away に 図の 中心を わたす */
function drawSideLabel(a, b, text, o){
  o = o || {};
  const mx=(a.x+b.x)/2, my=(a.y+b.y)/2;
  let nx=-(b.y-a.y), ny=(b.x-a.x);
  const L=Math.hypot(nx,ny)||1; nx/=L; ny/=L;
  if(o.away && ((mx+nx-o.away.x)**2 + (my+ny-o.away.y)**2) < ((mx-nx-o.away.x)**2 + (my-ny-o.away.y)**2)){
    nx=-nx; ny=-ny;                       // 図の 中心から 遠い がわへ
  }
  const d = o.gap===undefined ? 20 : o.gap;
  drawText(mx+nx*d, my+ny*d, text, { size:o.size||17, color:o.color||C.inkSoft });
}
/* 頂点の 名前を 図の 外がわに かく */
function drawVertexLabel(p, c, text, o){
  o = o || {};
  let dx=p.x-c.x, dy=p.y-c.y;
  const L=Math.hypot(dx,dy)||1; dx/=L; dy/=L;
  const d = o.gap===undefined ? 20 : o.gap;
  drawText(p.x+dx*d, p.y+dy*d, text, { size:o.size||18, color:o.color||C.ink });
}
/* 角の 弧。from→to は 度（反時計まわり・数学の むき） */
function drawArcDeg(c, r, from, to, o){
  o = o || {};
  let sweep = to - from;
  while(sweep <= -360) sweep += 360;
  while(sweep >   360) sweep -= 360;
  const steps = Math.max(8, Math.round(Math.abs(sweep)/4));
  ctx.beginPath();
  for(let i=0;i<=steps;i++){
    const d=(from + sweep*(i/steps))*D2R;
    const x=c.x+Math.cos(d)*r, y=c.y-Math.sin(d)*r;
    i ? ctx.lineTo(x,y) : ctx.moveTo(x,y);
  }
  ctx.lineWidth=o.lw||3; ctx.strokeStyle=o.color||C.coral; ctx.lineCap='round'; ctx.stroke();
}
/* 点が 多角形の 中に あるか（図を タップして えらぶ とき） */
function pointInPoly(p, pts){
  let inside=false;
  for(let i=0,j=pts.length-1;i<pts.length;j=i++){
    const xi=pts[i].x, yi=pts[i].y, xj=pts[j].x, yj=pts[j].y;
    if(((yi>p.y)!==(yj>p.y)) && (p.x < (xj-xi)*(p.y-yi)/((yj-yi)||1e-9)+xi)) inside=!inside;
  }
  return inside;
}
/* 方眼（マス目）を うすく ひく */
function drawGrid(rg, step, color){
  ctx.save(); ctx.beginPath(); ctx.rect(rg.x0,rg.y0,rg.x1-rg.x0,rg.y1-rg.y0); ctx.clip();
  ctx.strokeStyle=color||'rgba(120,140,170,.20)'; ctx.lineWidth=1;
  for(let x=rg.x0;x<=rg.x1;x+=step){ ctx.beginPath(); ctx.moveTo(x,rg.y0); ctx.lineTo(x,rg.y1); ctx.stroke(); }
  for(let y=rg.y0;y<=rg.y1;y+=step){ ctx.beginPath(); ctx.moveTo(rg.x0,y); ctx.lineTo(rg.x1,y); ctx.stroke(); }
  ctx.restore();
}

function exprShow(){
  const el=document.getElementById('exprText');
  el.innerHTML = expr ? expr.replace(/([＋−×÷])/g,'<span class="opc">$1</span>')
                      : '<span class="ph">?</span>';

function exprKey(k){
  if(k==='del'){ expr = expr.slice(0,-1); exprShow(); return; }
  if(/^[0-9]$/.test(k)){
    const cur = (expr.match(/([\d.]*)$/)||['',''])[1];
    if(cur.length >= (cur.indexOf('.')>=0 ? 6 : 4)) return;
    if(cur==='0') expr = expr.slice(0,-1);
    expr += k; exprShow(); return;
  }
  if(k==='3.14'){                 // 3.14 キー（pi:true の モード）：はじめか 記号の あとにだけ
    if(!M.pi || /[\d.]$/.test(expr)) return;
    expr += '3.14'; exprShow(); return;
  }
  if(k==='.'){                    // 小数点（dec:true の モード）
    if(!M.dec || !/\d$/.test(expr)) return;
    if(((expr.match(/([\d.]*)$/)||['',''])[1]).indexOf('.')>=0) return;
    expr += '.'; exprShow(); return;
  }
  // 記号は 数の あとにだけ
  if(!expr || !/\d$/.test(expr)) return;
  if((M.ops||[]).indexOf(k) < 0) return;
  expr += k; exprShow();
}
function applyInputUI(){

  numpadEl.classList.toggle('ops', ops.length>0);
  numpadEl.classList.toggle('dec', dec);
  numpadEl.classList.toggle('noop', dec && ops.length===0);
  numpadEl.classList.toggle('pi', !!M.pi && kind==='expr');   // 3.14 キー
  Array.prototype.forEach.call(numpadEl.querySelectorAll('.key.op:not(.dot)'), b=>{
    const i = ops.indexOf(b.dataset.op);

    b.style.gridRow = (i>=0) ? (i+1) : '';
  });
  // こたえ欄
  document.getElementById('ansLabel').textContent = M.ansLabel || 'こたえ';
  const u=document.getElementById('ansUnit');
  u.textContent = (M.unit===undefined) ? '' : M.unit;
  u.className = 'unit' + (M.unit==='°' ? ' deg' : '');
  u.style.display = u.textContent ? 'inline' : 'none';
  // 図の そうさボタン
  const ctl=document.getElementById('ctlRow');
  ctl.innerHTML = M.ctlHtml || '';
  ctl.style.display = M.ctlHtml ? 'block' : 'none';
  if(M.ctlHtml && M.onCtl) ctl.onclick = e=>{ const b=e.target.closest('button'); if(b) M.onCtl(b); };
  // わきの わく
  const sub=document.getElementById('subArea');
  sub.innerHTML = M.subHtml || '';
  sub.style.display = M.subHtml ? 'block' : 'none';
}
function renderChoices(){
  choicesEl.innerHTML='';
  if((M.input||'none') !== 'choice') return;
  const list = M.choices ? M.choices() : [];
  choicesEl.style.gridTemplateColumns = 'repeat('+Math.min(list.length,3)+',1fr)';
  list.forEach((t,i)=>{
    const b=document.createElement('button');
    b.className='choice'; b.innerHTML=t;
    b.addEventListener('click', ()=> pressChoice(b,i));
    choicesEl.appendChild(b);
  });
}
function pressChoice(btn, i){
  if(chalResultOpen()) return;
  if(btn.classList.contains('locked')) return;
  const r = M.check ? M.check(i) : null;
  if(!r) return;
  btn.classList.remove('correct','wrong'); void btn.offsetWidth;
  btn.classList.add(r.ok ? 'correct' : 'wrong');
  if(r.ok){
    Array.prototype.forEach.call(choicesEl.children, b=> b.classList.add('locked'));
  }else{
    setTimeout(()=> btn.classList.remove('wrong'), 400);
  }
  applyJudge(r);
}

/* ============================================================
   まるつけ（正解・まちがいの 入口は かならず ここ）
   ============================================================ */
function say(msg, kind, isHtml){
  if(isHtml) resultEl.innerHTML = msg || '';
  else       resultEl.textContent = msg || '';
  resultEl.className = 'result' + (kind ? ' '+kind : '') +
                       ((msg||'').length > 22 ? ' small' : '');
}
function applyJudge(r){
  if(!r) return;
  hideHanamaru();
  if(r.html) say(r.html, r.ok?'ok':'ng', true);
  else       say(r.msg,  r.ok?'ok':'ng');
  if(r.ok){
    playOk();
    const done = (r.done===undefined) ? true : r.done;
    if(done){
      if(!answered){ scores[mode]=(scores[mode]||0)+1; refreshScore(); answered=true; }
      showHanamaru();
    }
  }else if(!r.skip){
    chalMiss();
    if(window.TestRun) TestRun.miss();       // 📝テストの 練習の まちがい
  }
  refresh();
}
function submitAnswer(){
  if(chalResultOpen()) return;              // 成せき表の あいだは まるつけしない
  if(!M || !M.check) return;
  const kind = M.input || 'none';
  if(kind==='number'){
    const v = M.dec ? parseFloat(ansEl.value) : parseInt(ansEl.value, 10);
    if(isNaN(v)){ say('すうじを 入力してね','ng'); return; }   // 入力わすれは ミスに 数えない
    applyJudge(M.check(v));
  }else if(kind==='expr'){
    if(!expr){ say('しきを 入力してね','ng'); return; }
    applyJudge(M.check(expr));
  }else{
    applyJudge(M.check(null));
  }
}

/* ============================================================
   問題を 出す・モードを かえる
   ============================================================ */
function newProblem(){
  clearAutoNext();
  chalBumpProblem();
  answered=false; hintOn=false;
  data={}; phase='';
  ansEl.value=''; expr=''; exprShow();
  say('');
  hideHanamaru();
  if(M.setup) M.setup();
  phase0 = phase;                 // 「やりなおす」で もどす ところ
  applyInputUI();
  renderChoices();
  resize();
  refresh();
  refreshScore();
}
function setMode(m){
  clearAutoNext();
  chalBumpProblem();
  if(window.Challenge10 && Challenge10.isOn()) Challenge10.reset();   // タブを かえたら 数えなおす
  mode = m; M = MODES[m];
  if(scores[m]===undefined) scores[m]=0;
  applyTabUI(m);
  buildSteps();
  newProblem();
}
function redoProblem(){
  clearAutoNext();
  answered=false; hintOn=false;
  ansEl.value=''; expr='';
  say('');
  hideHanamaru();
  if(M.redo) M.redo(); else phase = phase0;
  exprShow();                     // phase を もどしてから（しき欄の「正解」の 色を けす）
  renderChoices();
  refresh();
}

/* ============================================================
   そうさ（タップ・ドラッグ・テンキー）
   ============================================================ */
function localPt(e){
  const r=cv.getBoundingClientRect();
  const sx = r.width  > 0 ? (W / r.width)  : 1;
  const sy = r.height > 0 ? (H / r.height) : 1;
  return { x:(e.clientX-r.left)*sx, y:(e.clientY-r.top)*sy };
}
cv.addEventListener('pointerdown', e=>{
  e.preventDefault();
  try{ cv.setPointerCapture(e.pointerId); }catch(err){}
  const p=localPt(e);
  if(M.onTap && !chalResultOpen()){ const r=M.onTap(p); if(r){ applyJudge(r); return; } }
  if(M.onDown) M.onDown(p);
});
cv.addEventListener('pointermove', e=>{ if(M && M.onMove) M.onMove(localPt(e)); });
cv.addEventListener('pointerup',   e=>{ if(M && M.onUp)   M.onUp(localPt(e)); });
cv.addEventListener('pointercancel',e=>{ if(M && M.onUp)  M.onUp(localPt(e)); });

numpadEl.addEventListener('click', e=>{
  const btn=e.target.closest('button'); if(!btn) return;
  if(btn.id==='npok'){ submitAnswer(); return; }
  if((M.input||'') === 'expr'){
    if(btn.id==='npdel') exprKey('del');
    else if(btn.dataset.op) exprKey(btn.dataset.op);
    else if(btn.dataset.d!==undefined) exprKey(btn.dataset.d);
    return;
  }
  if(btn.dataset.op==='.'){       // 小数点（dec:true の モード）
    if(M.dec && ansEl.value!=='' && ansEl.value.indexOf('.')<0) ansEl.value += '.';
    return;
  }
  if(btn.dataset.op) return;
  if(btn.id==='npdel'){ ansEl.value = ansEl.value.slice(0,-1); return; }
  const d=btn.getAttribute('data-d'); if(d===null) return;
  let v=ansEl.value;
  if(v==='0') v='';
  const dp=v.indexOf('.');
  if(dp>=0 ? (v.length-dp>2) : v.length>=4) return;   // 小数は 2けたまで
  ansEl.value = v + d;
});
ansEl.addEventListener('keydown', e=>{ if(e.key==='Enter') submitAnswer(); });
document.addEventListener('keydown', e=>{
  if(!M || (M.input||'')!=='expr') return;
  const t=e.target; if(t && t.tagName==='INPUT' && t!==ansEl) return;
  let k=null;
  if(/^[0-9]$/.test(e.key)) k=e.key;
  else if(e.key==='+') k='＋';
  else if(e.key==='-'||e.key==='−') k='−';
  else if(e.key==='*'||e.key==='x'||e.key==='×') k='×';
  else if(e.key==='/'||e.key==='÷') k='÷';
  else if(e.key==='.') k='.';
  else if(e.key==='Backspace') k='del';
  else if(e.key==='Enter'){ e.preventDefault(); submitAnswer(); return; }
  if(k){ e.preventDefault(); exprKey(k); }
});
document.addEventListener('keydown', e=>{          // キーボードでも こたえを 入力（input:'number'）
  if(!M || (M.input||'')!=='number') return;
  if(e.ctrlKey || e.metaKey || e.altKey) return;
  const t=e.target; if(t && t.tagName==='INPUT' && t!==ansEl) return;
  if(chalResultOpen()) return;
  let btn=null;
  if(/^[0-9]$/.test(e.key)) btn = numpadEl.querySelector('[data-d="'+e.key+'"]');
  else if(e.key==='.' || e.key==='．') btn = numpadEl.querySelector('.dot');
  else if(e.key==='Backspace' || e.key==='Delete') btn = document.getElementById('npdel');
  else if(e.key==='Enter'){ if(t!==ansEl){ e.preventDefault(); submitAnswer(); } return; }   // こたえ欄の 中なら もとの Enter に まかせる
  else if(e.key.length===1 && t===ansEl){ e.preventDefault(); return; }                    // 数字いがいの 文字は 入れない
  if(btn){ e.preventDefault(); btn.click(); }      // テンキーと 同じ きまり（小数は 2けた・「．」は 1回）で 入る
});

document.getElementById('hintBtn').addEventListener('click', ()=>{ hintOn=!hintOn; updateGuide(); });
document.getElementById('next').addEventListener('click', newProblem);
document.getElementById('redo').addEventListener('click', redoProblem);
document.getElementById('cfgbtn').addEventListener('click', ()=> document.getElementById('cfg').classList.toggle('open'));
document.getElementById('cfgSound').addEventListener('change', e=>{ soundOn = e.target.checked; });

/* ============================================================
   毎フレームの えがき
   ============================================================ */
function render(){
  try{
    clear();
    if(M && M.draw) M.draw();
  }catch(err){
    // 1フレームで 何かあっても 画面が 止まらないように
    if(window.console) console.warn('描画スキップ:', err);
  }
  requestAnimationFrame(render);
}

/* ============================================================
   起動
   ============================================================ */
document.title = APP.title;
document.getElementById('title').innerHTML = APP.h1;
document.getElementById('footnote').innerHTML = APP.footnote || '';

if(window.ResizeObserver){
  let roT=0;
  const ro=new ResizeObserver(()=>{ clearTimeout(roT); roT=setTimeout(()=>{ resize(); fitGuide(); }, 60); });
  ro.observe(cv.parentElement);
}
window.addEventListener('resize', ()=>{ resize(); fitGuide(); });
window.addEventListener('orientationchange', ()=>{ resize(); setTimeout(resize, 300); });
if(window.visualViewport){ window.visualViewport.addEventListener('resize', ()=>{ resize(); }); }
if(document.fonts && document.fonts.ready){ document.fonts.ready.then(()=>{ resize(); fitGuide(); }); }

Challenge10.init({
  mount    : '#chal-mount',
  total    : APP.challenge.total,
  next     : chalNext,
  onToggle : ()=>{ chalForceNext=true; },
  nextDelay: HANAMARU_SHOW_MS + AUTO_NEXT_MS,
  record   : !!APP.challenge.record,
  recordKey: APP.challenge.key || 'challenge10'
});

buildTabs();
setMode(APP.first);
render();
</script>

<!-- ============================================================
     D. 📝 テストの 練習の しくみ（test_renshu v1・2026-09-26）— さわらない
     せっていは A の window.TEST_SETTEI。
     この ひながたでは 土台（C）に 2行 組みこんで あるので、つつみ（ラップ）は つかわない。
     shukuzu1.html の B1 を、ほかの アプリでも つかえるように 取り出したもの。
     ・土台（zukei_base1 の C）は 1行も 直さなくて よい。
       showHanamaru と applyJudge を 外から つつんで（ラップして）つかう。
     ・土台に もう「window.TestRun」の 2行が 入っている ときは つつまない（二重に 数えない）。
     ・10問チャレンジ（Challenge10）とは べつの しくみ。始めると チャレンジは 切る。
     ============================================================ -->
<script>
window.TestRun = (function(){
  'use strict';
  const S = window.TEST_SETTEI;
  const P = Object.assign({ after:'#chal-mount', next:'#next', hint:'#hintBtn',
                            tabs:'#gtabs,#subTabs', chalBtn:'#btn-challenge' }, (S && S.parts) || {});
  const $ = id => document.getElementById(id);
  const q = sel => sel ? document.querySelector(sel) : null;

  /* ---- 土台に 必要な ものが あるか ---- */
  const lack = [];
  if(typeof MODES        !== 'object')   lack.push('MODES');
  if(typeof setMode      !== 'function') lack.push('setMode');
  if(typeof showHanamaru !== 'function') lack.push('showHanamaru');
  if(typeof applyJudge   !== 'function') lack.push('applyJudge');
  if(!S || !Array.isArray(S.tests) || !S.tests.length) lack.push('TEST_SETTEI.tests');
  if(lack.length){ console.warn('テストの練習：土台に ないので うごきません →', lack.join('・')); return null; }

  /* ---- せっていを たしかめる（ない 小タブは とばす）---- */
  const TESTS = S.tests.map(t => ({
    title: t.title || 'テスト',
    items: (t.items || []).filter(it => {
      if(it && MODES[it.mode]) return true;
      console.warn('テストの練習：小タブ「' + (it && it.mode) + '」が ないので とばします（' + t.title + '）');
      return false;
    })
  })).filter(t => t.items.length);
  if(!TESTS.length){ console.warn('テストの練習：出せる 大問が ありません'); return null; }

  const setOf = it => Object.assign({}, it.meth !== undefined ? { meth: it.meth } : {}, it.set || {});
  const itemName = it => it.name || ((MODES[it.mode].label || it.mode) + (MODES[it.mode].sub || ''));
  const nowMode = () => (typeof mode === 'string' ? mode : '');
  const waitMs = () => (typeof HANAMARU_SHOW_MS === 'number' ? HANAMARU_SHOW_MS : 2000)
                     + (typeof AUTO_NEXT_MS     === 'number' ? AUTO_NEXT_MS     : 1500);

  let run = null;   // { t, i, rec:[{miss,hint,st}], back, saved }
  let myTimer = 0;

  /* ---- 見た目（CSS は ここで 足す。土台の <style> は さわらない）---- */
  const css = document.createElement('style');
  css.id = 'test-style';
  css.textContent = [
    '#test-mount{position:relative;flex:0 0 auto;display:flex;align-items:center;}',
    '#test-btn{font-family:"Yusei Magic",sans-serif;font-size:clamp(13px,1.7vw,17px);padding:5px 14px;white-space:nowrap;',
    '  color:#138577;background:#e3f6f2;border:2px solid #7fd3c6;border-radius:20px;box-shadow:0 2px 0 #7fd3c6;cursor:pointer;}',
    '#test-btn:focus-visible,#test-menu button:focus-visible,#test-bar button:focus-visible,#test-result button:focus-visible{outline:3px solid #138577;outline-offset:2px;}',
    '#test-menu{display:none;position:absolute;top:calc(100% + 8px);right:0;z-index:950;background:#fff;border:3px solid #d8ccae;',
    '  border-radius:16px;padding:10px;box-shadow:0 8px 24px rgba(52,70,95,.20);flex-direction:column;gap:8px;min-width:270px;max-width:92vw;}',
    '#test-menu.open{display:flex;}',
    '#test-menu button{font-family:"Yusei Magic",sans-serif;font-size:17px;padding:11px 14px;border-radius:12px;border:3px solid #7fd3c6;',
    '  background:#fff;color:#34465f;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:14px;white-space:nowrap;}',
    '#test-menu button:hover{background:#f1fbf9;}',
    '#test-menu small{font-size:14px;color:#6a7d96;}',
    '#test-bar{display:none;align-items:center;gap:8px;background:rgba(255,255,255,.94);border:2px solid #7fd3c6;border-radius:20px;',
    '  padding:3px 5px 3px 12px;font-family:"Yusei Magic",sans-serif;color:#138577;white-space:nowrap;font-size:clamp(12px,1.5vw,16px);}',
    '#test-dots{letter-spacing:1px;}',
    '#test-stop{font-family:"Yusei Magic",sans-serif;font-size:.9em;padding:3px 10px;border-radius:14px;border:2px solid #d8ccae;background:#fff;color:#6a7d96;cursor:pointer;}',
    'body.testing #test-btn{display:none;}',
    'body.testing #test-bar{display:flex;}',
    'body.testing #chal-mount{display:none;}',
    P.tabs.split(',').map(s => 'body.testing ' + s.trim()).join(',') + '{pointer-events:none;opacity:.45;}',
    '#test-result{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:1000;align-items:center;justify-content:center;}',
    '#test-result.show{display:flex;}',
    '#test-result .tr-card{background:#fff;border-radius:20px;padding:22px 26px;box-shadow:0 10px 40px rgba(0,0,0,.3);max-width:94vw;max-height:92vh;overflow:auto;',
    '  font-family:"Yusei Magic",sans-serif;color:#34465f;}',
    '#test-result .tr-title{font-size:clamp(20px,3vw,28px);color:#138577;text-align:center;margin-bottom:12px;}',
    '#test-result table{border-collapse:collapse;font-size:clamp(14px,2vw,19px);margin:0 auto;}',
    '#test-result td{padding:6px 10px;border-bottom:2px dashed #eadfc6;white-space:nowrap;}',
    '#test-result td.no{color:#6a7d96;}',
    '#test-result td.r-ok{color:#2bb673;}',
    '#test-result td.r-ng{color:#e85d3b;}',
    '#test-result td.r-sk{color:#9aa6b5;}',
    '#test-result .tr-sum{text-align:center;margin-top:12px;font-size:clamp(16px,2.4vw,22px);}',
    '#test-result .tr-sum b{color:#e85d3b;font-size:1.3em;}',
    '#test-result .tr-btns{display:flex;gap:12px;justify-content:center;margin-top:16px;}',
    '#test-result button{font-family:"Yusei Magic",sans-serif;font-size:18px;padding:11px 20px;border-radius:14px;cursor:pointer;}',
    '#test-again{color:#fff;background:#1fae9c;border:none;box-shadow:0 3px 0 #138577;}',
    '#test-close{color:#6a7d96;background:#fff;border:2px solid #d8ccae;}'
  ].join('\n');
  document.head.appendChild(css);

  /* ---- ボタン・メニュー・帯（10問チャレンジの となり）---- */
  const mount = document.createElement('div');
  mount.id = 'test-mount';
  mount.innerHTML =
      '<button id="test-btn" type="button">' + (S.button || '📝 テストの 練習') + '</button>'
    + '<div id="test-menu">'
    +   TESTS.map((t,k) => '<button type="button" data-k="'+k+'">'+t.title+'<small>'+t.items.length+'問</small></button>').join('')
    + '</div>'
    + '<div id="test-bar"><span id="test-no"></span><span id="test-dots"></span>'
    +   '<button id="test-stop" type="button">やめる</button></div>';
  const anchor = q(P.after);
  const header = document.querySelector('header');
  if(anchor && anchor.parentNode) anchor.parentNode.insertBefore(mount, anchor.nextSibling);
  else if(header) header.appendChild(mount);
  else document.body.insertBefore(mount, document.body.firstChild);
  const res = document.createElement('div');
  res.id = 'test-result';
  document.body.appendChild(res);

  /* テストが 1つだけなら、メニューを 出さずに すぐ 始める */
  $('test-btn').addEventListener('click', e => {
    e.stopPropagation();
    if(TESTS.length === 1){ start(0); return; }
    const m = $('test-menu');
    m.classList.toggle('open');
    if(m.classList.contains('open')) placeMenu();
  });
  /* せまい 画面で メニューが 左に はみ出す ときは、画面の 中へ ずらす */
  function placeMenu(){
    const m = $('test-menu');
    m.style.left = ''; m.style.right = '';
    const r = m.getBoundingClientRect(), mr = mount.getBoundingClientRect();
    if(r.left < 8){ m.style.right = 'auto'; m.style.left = (8 - mr.left) + 'px'; }
  }
  $('test-menu').addEventListener('click', e => {
    const b = e.target.closest('button[data-k]'); if(!b) return;
    $('test-menu').classList.remove('open');
    start(+b.dataset.k);
  });
  document.addEventListener('click', e => {
    if(!e.target.closest('#test-mount')) $('test-menu').classList.remove('open');
  });
  document.addEventListener('keydown', e => {
    if(e.key === 'Escape') $('test-menu').classList.remove('open');
  });
  $('test-stop').addEventListener('click', () => stop());
  /* テストの あいだの「つぎの もんだい」は、その 大問を とばして つぎの 大問へ */
  document.addEventListener('click', e => {
    if(!run || !P.next || !e.target.closest(P.next)) return;
    e.stopPropagation(); e.preventDefault();
    skip();
  }, true);
  /* ヒントを 見たか（ボタンを おした あと hintOn が true なら）*/
  const hb = q(P.hint);
  if(hb) hb.addEventListener('click', () => setTimeout(() => {
    const r = cur();
    const on = (typeof hintOn === 'boolean') ? hintOn : true;
    if(r && on && r.st === 'todo') r.hint = true;
  }, 0));

  /* ---- 土台の 2つの 関数を つつむ（土台に もう 2行 入っていれば つつまない）---- */
  const BUILTIN = /TestRun/.test(String(showHanamaru)) || /TestRun/.test(String(applyJudge));
  if(!BUILTIN){
    const _show = showHanamaru;
    showHanamaru = function(){
      if(!run) return _show.apply(this, arguments);
      /* はなまるは ふつうに 出す。同じ モードの つぎの 問題へは 行かせない（noAutoNext を 一時的に）*/
      const m = (typeof M === 'object' && M) ? M : null;
      const had = m && Object.prototype.hasOwnProperty.call(m, 'noAutoNext');
      const old = m ? m.noAutoNext : undefined;
      try{ if(m) m.noAutoNext = true; }catch(e){}
      try{ _show.apply(this, arguments); }
      finally{ try{ if(m){ if(had) m.noAutoNext = old; else delete m.noAutoNext; } }catch(e){} }
      api.onDone();
    };
    const _judge = applyJudge;
    applyJudge = function(r){
      if(run && r && !r.ok && !r.skip) api.miss();
      return _judge.apply(this, arguments);
    };
  }

  /* ---- 中身 ---- */
  function cur(){ return run ? run.rec[run.i] : null; }
  function clearMine(){ clearTimeout(myTimer); myTimer = 0; }
  function bar(){
    if(!run) return;
    const T = TESTS[run.t], it = T.items[run.i];
    $('test-no').textContent = '📝 ' + (/^\d+$/.test(it.no) ? it.no+'問め' : it.no) + '（' + (run.i+1) + '／' + T.items.length + '）';
    $('test-dots').textContent = run.rec.map((r,i) => r.st==='done' ? '●' : r.st==='skip' ? '－' : (i===run.i ? '◎' : '○')).join('');
  }
  /* set で かえる 値を、はじめに 1回だけ おぼえておく */
  function saveSets(t){
    const saved = {};
    TESTS[t].items.forEach(it => {
      const o = setOf(it), md = MODES[it.mode];
      Object.keys(o).forEach(k => {
        const key = it.mode + '\u0000' + k;
        if(!(key in saved)) saved[key] = { md:md, k:k, had:Object.prototype.hasOwnProperty.call(md,k), v:md[k] };
      });
    });
    return saved;
  }
  function restoreSets(saved){
    Object.keys(saved || {}).forEach(key => {
      const s = saved[key];
      try{ if(s.had) s.md[s.k] = s.v; else delete s.md[s.k]; }catch(e){}
    });
  }
  function go(i){
    clearMine();
    run.i = i;
    const it = TESTS[run.t].items[i];
    const o = setOf(it);
    Object.keys(o).forEach(k => { try{ MODES[it.mode][k] = o[k]; }catch(e){} });
    setMode(it.mode);
    bar();
  }
  function start(t){
    const cb = q(P.chalBtn);
    if(window.Challenge10 && Challenge10.isOn && Challenge10.isOn() && cb) cb.click();
    res.classList.remove('show');
    let back = nowMode();
    if(run){ back = run.back; restoreSets(run.saved); }
    run = { t:t, i:0, rec:TESTS[t].items.map(() => ({ miss:0, hint:false, st:'todo' })), back:back, saved:saveSets(t) };
    document.body.classList.add('testing');
    go(0);
  }
  function next(){
    if(!run) return;
    if(run.i + 1 < run.rec.length) go(run.i + 1);
    else finish();
  }
  function skip(){
    const r = cur(); if(!r) return;
    if(r.st !== 'done') r.st = 'skip';
    clearMine();
    if(typeof clearAutoNext === 'function') clearAutoNext();
    next();
  }
  function finish(){
    clearMine();
    const T = TESTS[run.t];
    let perfect = 0;
    const rows = T.items.map((it,i) => {
      const r = run.rec[i];
      let tx, c;
      if(r.st==='done' && r.miss===0){ tx = '⭕ ノーミス'; c = 'r-ok'; perfect++; }
      else if(r.st==='done'){ tx = 'まちがい '+r.miss+'回'; c = 'r-ng'; }
      else { tx = 'とばした'; c = 'r-sk'; }
      return '<tr><td class="no">'+it.no+'</td><td>'+itemName(it)+'</td><td class="'+c+'">'+tx+'</td><td>'+(r.hint ? '💡' : '')+'</td></tr>';
    }).join('');
    res.innerHTML = '<div class="tr-card">'
      + '<div class="tr-title">📝 '+T.title+'　おわり！</div>'
      + '<table>'+rows+'</table>'
      + '<div class="tr-sum">ノーミスで できた 問題　<b>'+perfect+'</b> ／ '+T.items.length+'</div>'
      + '<div class="tr-btns"><button id="test-again" type="button">もう一度</button><button id="test-close" type="button">とじる</button></div>'
      + '</div>';
    res.classList.add('show');
    $('test-again').onclick = () => start(run.t);
    $('test-close').onclick = () => stop();
    $('test-again').focus();
  }
  /* やめる／とじる：set で かえた 値を もどして、はじめの タブへ */
  function stop(){
    if(!run) return;
    const back = run.back, saved = run.saved;
    run = null;
    clearMine();
    res.classList.remove('show');
    document.body.classList.remove('testing');
    restoreSets(saved);
    setMode(back && MODES[back] ? back : TESTS[0].items[0].mode);
  }

  const api = {
    on: () => !!run,
    /* showHanamaru から：その 大問は おわり。はなまるの あと つぎの 大問へ */
    onDone(){
      if(!run || res.classList.contains('show')) return !!run;
      const r = cur(); r.st = 'done';
      bar();
      clearMine();
      const go2 = () => { if(typeof autoTimers !== 'undefined') autoTimers = []; next(); };
      if(typeof autoTimers !== 'undefined' && Array.isArray(autoTimers)) autoTimers.push(setTimeout(go2, waitMs()));
      else myTimer = setTimeout(go2, waitMs());
      return true;
    },
    /* applyJudge から：まちがい（skip で ない もの）*/
    miss(){ const r = cur(); if(r && r.st === 'todo') r.miss++; },
    /* 外から つかう とき用 */
    start: t => start(t || 0),
    stop:  () => stop(),
    record: () => run ? JSON.parse(JSON.stringify(run.rec)) : null
  };
  return api;
})();
</script>
