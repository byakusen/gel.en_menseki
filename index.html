        if(same(v, this.FULL))             return { ok:false, msg:'かけた マス（17こ）も 半分と して たそう 🔍' };
        if(same(v, this.FULL+this.PART))   return { ok:false, msg:'かけた マスは 1cm² では なく、半分の 0.5cm² と 考えよう 🔍' };
        if(same(v, q*4))                   return { ok:false, msg:'それは 円 全体。まずは 4分の1の 円だけ 🔍' };
        if(dotMiss(v, q))                  return { ok:false, msg:'小数点の 位置を たしかめよう 🔍' };
        return { ok:false, msg:'69 ＋ 17 ÷ 2 を 計算しよう 🔍' };
      }
      if(phase!=='e') return null;
      if(same(v, q*4)){ phase = 'done'; return { ok:true, msg:'せいかい！ 約 '+fmt(q*4)+'cm² 🎉' }; }
      if(same(v, q))   return { ok:false, msg:'それは 4分の1の 円だけ。× 4 しよう 🔍' };
      if(same(v, q*2)) return { ok:false, msg:'それは 半円。円 全体は 4分の1の 円の 4つ分 🔍' };
      if(same(v, 314)) return { ok:false, skip:true, msg:'公式では 314cm² だね。ここでは 方眼で 数えた 77.5cm² の 4つ分で 考えよう 🔍' };
      if(dotMiss(v, q*4)) return { ok:false, msg:'小数点の 位置を たしかめよう 🔍' };
      return { ok:false, msg:'77.5 × 4 を 計算しよう 🔍' };
    }
  },

  /* ---------- 公式の つくり方（円を 分けて ならべかえる） ----------
     図（キャンバスの 上）… KSEQ
       build … 黄色い 円 → 線が 入る → 青と 赤に ぬる → 上下に わかれる → 1列に ひらく → かみ合わせる
       frame … わく → 黄色い 長方形 → たて・横 →（式 1・2行め）→ 部品に もどす → 円に もどして また 長方形
       check … 「▶ もう一度」：円に もどして また 長方形
     式（キャンバスの 下）… FSTEP を 1つずつ。問題に 答えると つぎへ 進む（FGATE） */
  kosiki: {
    icon:'🍕', label:'公式の つくり方',
    input:'choice', noAutoNext:true, arMin:0.3,       // arMin：横長の キャンバスを つかう
    steps:['ならべかえた 形','たての 長さ','横の 長さ','直径÷2 は？'],
    n:16, seqName:'build', t0:0, fs:0, ft:0, held:false,
    get ctlHtml(){
      const b = n => '<button data-n="'+n+'"'+(this.n===n?' class="on"':'')+'>'+n+'こ</button>';
      return '<div class="seg2"><span class="lab">分ける 数</span>'+b(8)+b(16)+b(32)+b(64)+
             '<button data-go="1" class="go">▶ もう一度</button>'+
             '<button data-next="1" class="nx" style="display:none">▶ つづき</button></div>';
    },
    onCtl(btn){
      if(btn.dataset.n) this.n = +btn.dataset.n;
      else if(btn.dataset.next){                   // 「▶ つづき」：直径÷2×3.14 への ならべかえから 再生
        if(this.paused()){ this.held = false; this.fs = FPAUSE+1; this.ft = Date.now(); }
        return;
      }
      else if(!btn.dataset.go) return;
      this.startSeq(phase==='a' ? 'build' : 'check');
      document.getElementById('ctlRow').innerHTML = this.ctlHtml;
    },
    startSeq(name, delay){ this.seqName = name; this.t0 = Date.now() + (delay||0); },
    state(){
      const segs = KSEQ[this.seqName] || [];
      let el = Date.now() - this.t0;
      if(el < 0) return { seg: segs.length ? segs[0][0] : 'end', q:0 };
      for(const s of segs){ if(el < s[1]) return { seg:s[0], q:el/s[1] }; el -= s[1]; }
      return { seg:'end', q:1 };
    },
    fState(){                                      // 式の いまの 段（k）と すすみ（q）
      let gate = FGATE[phase];
      if(this.held && gate > FPAUSE) gate = FPAUSE;   // 「▶ つづき」を 押すまで ここで とまる
      if(gate===undefined || gate < 0) return { k:-1, q:1 };
      let el = Date.now() - this.ft, k = this.fs;
      if(el < 0) return { k:k, q:0 };
      while(k <= gate){ if(el < FDUR[k]) return { k:k, q:el/FDUR[k] }; el -= FDUR[k]; k++; }
      return { k:gate, q:1 };
    },
    paused(){ if(!this.held) return false; const s = this.fState(); return s.k===FPAUSE && s.q>=1; },
    fDone(){ const g = FGATE[phase]; if(g===undefined || g < 0) return true; const s = this.fState(); return s.k===g && s.q>=1; },
    busy(){ return this.state().seg !== 'end' || !this.fDone(); },
    poseP(st){                                     // 0＝円 … 1＝ならべかえた 形
      switch(st.seg){
        case 'plain': case 'lines': case 'color': case 'circleHold': return 0;
        case 'split':    return 0.25*st.q;
        case 'fan':      return 0.25 + 0.47*st.q;
        case 'rows':     return 0.72;
        case 'join':     return 0.72 + 0.28*st.q;
        case 'toCircle': return 1 - st.q;
        case 'toRect':   return st.q;
        default:         return 1;
      }
    },
    setup(){
      data.sh = {};
      for(const k in KQ) data.sh[k] = shuffle(KQ[k].slice());
      this.fs = 0; this.ft = 0; this.held = false;
      this.startSeq('build', 300);
      phase = 'a';
    },
    redo(){ phase = 'a'; this.fs = 0; this.ft = 0; this.held = false; this.startSeq('build', 300); },
    step(){ const s = {a:0,b:1,c:2,d:3}[phase]; return s===undefined ? 4 : s; },
    prompt(){
      const t = { a:'円を こまかく 分けて ならべかえると、どんな 形に 近づくかな？',
                  b:'長方形の たての 長さは、円の どこの 長さと 同じ？',
                  c:'長方形の 横の 長さは、円の どこの 長さと 同じ？',
                  d:'直径 ÷ 2 は、何の 長さと 同じ？' }[phase]
             || '円の 面積 ＝ 半径 × 半径 × 円周率';
      return '<span class="pq">'+t+'</span>';
    },
    choices(){
      choiceTate(phase==='c');
      const list = data.sh[phase] || data.sh.d;
      return list.map(t => '<span class="cm">'+t+'</span>');
    },
    draw(){
      const MAG = '#d63ad6', GRN = '#1fb05a', YEL = '#fff35c';
      choicesEl.classList.toggle('wait', this.busy());   // 動いている あいだは 選択肢を うすく・押せなく
      const nxb = document.querySelector('#ctlRow .nx');
      if(nxb) nxb.style.display = this.paused() ? '' : 'none';   // とまって いる ときだけ「▶ つづき」
      /* ---------- 上：図 ---------- */
      const wide = W/H > 1.55;                       // 横長の キャンバスは 図＝左・式＝右
      const rg = wide ? region(0.01, 0.02, 0.53, 0.98) : region(0.02, 0.01, 0.98, 0.52);
      const f  = fitTo([{x:-2.0,y:-1.16},{x:1.78,y:1.18}], rg, 6);
      const R  = f.s;
      const N = this.n, al = 2*Math.PI/N, w = 2*Math.sin(al/2), Wd = (N/2+0.5)*w, x0 = -Wd/2;
      const hh = Math.cos(al/2)/2;                   // 先が 弧の はしに ぴったり 合う 高さ（はみ出さない）
      const st = this.state(), seg = st.seg, q = st.q;
      const p = this.poseP(st);
      const lw = N>=64 ? 0.7 : N>=32 ? 1 : 1.4;
      const fsz = Math.max(14, Math.min(24, R*0.2));
      const ease = (a,b)=>{ const t = Math.max(0, Math.min(1, (p-a)/(b-a))); return t*t*(3-2*t); };
      const e1 = ease(0, 0.22), e2 = ease(0.28, 0.68), e3 = ease(0.76, 1);
      const SPLIT = 0.14, D = 0.62;
      const pose = i => {
        const psi0 = (i+0.5)*al - Math.PI/2;
        let tx, ty, psi1, sg;
        if(i < N/2){ sg = -1; tx = x0 + (i+0.5)*w; ty = hh;  psi1 = 0; }
        else       { sg =  1; const k = N/2-1-(i-N/2); tx = x0 + (k+1)*w; ty = -hh; psi1 = Math.PI; }
        const ay1 = sg*SPLIT*e1, ry = ty + sg*D*(1-e3);
        return { A: f.tf({ x:tx*e2, y:ay1 + (ry-ay1)*e2 }), psi: psi0 + (psi1-psi0)*e2 };
      };
      if(seg==='plain'){
        pie(f.tf({x:0,y:0}), R, 0, Math.PI*2, { fill:YEL, stroke:C.inkSoft, lw:1.5 });
      }else{
        for(let i=0;i<N;i++){
          const ps = pose(i), blue = i < N/2;
          let fill = blue ? KCOL.blue : KCOL.red, stroke = 'rgba(52,70,95,.75)';
          if(seg==='lines'){ fill = YEL; stroke = 'rgba(52,70,95,'+(0.75*q).toFixed(3)+')'; }
          if(seg==='color') fill = mixCol(YEL, blue ? KCOL.blue : KCOL.red, q);
          sector(ps.A, R, ps.psi, al, fill, lw, stroke);
        }
      }
      const FULL = ['label','l1','l2','hold'];          // 黄色い 長方形の まま の 段
      const xl = -(N/2)*w/2, xr = -xl;
      const RT = [f.tf({x:xl,y:-0.5}), f.tf({x:xr,y:-0.5}), f.tf({x:xr,y:0.5}), f.tf({x:xl,y:0.5})];
      const yA = seg==='yellow' ? q : seg==='unyellow' ? 1-q : FULL.indexOf(seg)>=0 ? 1 : 0;
      const oA = (seg==='outline'||seg==='yellow'||FULL.indexOf(seg)>=0) ? 1 : seg==='unyellow' ? 1-q : 0;
      if(yA > 0){ ctx.globalAlpha = yA; drawPoly(RT, { fill:YEL, stroke:null }); ctx.globalAlpha = 1; }
      if(oA > 0){
        const per = 2*((RT[1].x-RT[0].x) + (RT[3].y-RT[0].y));
        ctx.globalAlpha = oA;
        ctx.beginPath(); RT.forEach((pt,j)=> j ? ctx.lineTo(pt.x,pt.y) : ctx.moveTo(pt.x,pt.y)); ctx.closePath();
        ctx.setLineDash(seg==='outline' ? [per*q, per] : []);
        ctx.lineWidth = 3; ctx.strokeStyle = '#1d3d8f'; ctx.stroke(); ctx.setLineDash([]);
        ctx.globalAlpha = 1;
      }
      if(FULL.indexOf(seg)>=0){                      // 黄色い 長方形の たて・横
        ctx.globalAlpha = seg==='label' ? q : 1;
        drawLine(RT[0], RT[1], { color:GRN, lw:5 });
        drawLine(RT[0], RT[3], { color:MAG, lw:5 });
        ctx.globalAlpha = 1;
      }
      const onPieces = phase!=='a' && seg!=='outline' && seg!=='yellow' && FULL.indexOf(seg)<0;
      if(onPieces){                                  // 部品の たて（ピンク）・横（緑）
        ctx.globalAlpha = seg==='unyellow' ? q : 1;
        for(let i=0;i<N/2;i++){
          const ps = pose(i);
          arcLine(ps.A, R, ps.psi-al/2-Math.PI/2, ps.psi+al/2-Math.PI/2, { color:GRN, lw:4 });
        }
        const p0 = pose(0), a0 = p0.psi - al/2 - Math.PI/2;
        drawLine(p0.A, { x:p0.A.x + R*Math.cos(a0), y:p0.A.y + R*Math.sin(a0) }, { color:MAG, lw:5 });
        ctx.globalAlpha = 1;
      }
      const labA = phase==='a' ? 0 : seg==='label' ? q
                 : (FULL.indexOf(seg)>=0 || seg==='unyellow' || seg==='end') ? 1 : 0;
      if(labA > 0){
        ctx.globalAlpha = labA;
        const tTxt = phase==='b' ? 'たて' : '半径';
        const yTxt = (phase==='b'||phase==='c') ? '横' : '円周の 半分';
        drawText((RT[0].x+RT[1].x)/2, RT[0].y - fsz*0.85, yTxt, { size:fsz, color:GRN });
        const lx = RT[0].x - fsz*0.9, my = (RT[0].y+RT[3].y)/2, chars = tTxt.split('');
        chars.forEach((ch,j)=> drawText(lx, my + (j-(chars.length-1)/2)*fsz*1.05, ch, { size:fsz, color:MAG }));
        ctx.globalAlpha = 1;
      }
      /* ---------- 下：公式が できるまで ---------- */
      if(wide){
        if(phase!=='a') drawLine({x:W*0.545, y:H*0.06}, {x:W*0.545, y:H*0.94}, { color:'#e6dcc4', lw:2, dash:[6,6] });
        this.drawFormula(W*0.555, W*0.995, H*0.06, H*0.94);
      }else{
        if(phase!=='a') drawLine({x:W*0.06, y:H*0.535}, {x:W*0.94, y:H*0.535}, { color:'#e6dcc4', lw:2, dash:[6,6] });
        this.drawFormula(W*0.02, W*0.98, H*0.555, H*0.99);
      }
    },
    drawFormula(left, right, top, bot){
      const s = this.fState(); if(s.k < 0) return;
      const P  = j => j < s.k ? 1 : j > s.k ? 0 : s.q;
      const cl = t => Math.max(0, Math.min(1, t));
      const E  = t => { t = cl(t); return t*t*(3-2*t); };
      const MAG = '#d63ad6', GRN = '#1fb05a', RED = '#e85d3b';
      const PINK = 'rgba(255,130,120,.45)', BLU = 'rgba(80,160,240,.30)';
      const LAB1 = '長方形の 面積', LAB2 = '円の 面積';
      ctx.font = '900 100px "Yusei Magic",sans-serif';
      const mu = t => ctx.measureText(t).width/100;
      const g = 0.4;
      const totU = mu(LAB1)+g+mu('＝')+g+Math.max(mu('たて'),mu('半径'))+g+mu('×')+g+mu('直径÷2×3.14')+0.4;
      const fs = Math.max(11, Math.min(34, (right-left)*0.97/totU, (bot-top)/6.8));
      ctx.font = '900 '+fs+'px "Yusei Magic",sans-serif';
      const w = t => ctx.measureText(t).width;
      const xs = (left+right)/2 - totU*fs/2;
      top = (top+bot)/2 - 3.4*fs;                    // たてに まん中へ
      const xLabR = xs + w(LAB1), xEq = xLabR + g*fs, xA = xEq + w('＝') + g*fs;
      const xX = xA + Math.max(w('たて'), w('半径')) + g*fs, xB = xX + w('×') + g*fs;
      const y1 = top + 0.7*fs, y2 = y1 + 3.0*fs, y3 = y2 + 2.4*fs;
      const aTop = y1 + 0.85*fs, aBot = y2 - 0.85*fs, bTop = y2 + 0.62*fs, bBot = y3 - 0.62*fs;
      const T  = (x,y,t,col,a,al) => { if(a<=0) return; ctx.globalAlpha = cl(a);
                   drawText(x, y, t, { size:fs, color:col||C.ink, align:al||'left', halo:false }); ctx.globalAlpha = 1; };
      const AR = (x,ya,yb,a) => { if(a<=0) return; ctx.globalAlpha = cl(a);
                   drawLine({x:x,y:ya}, {x:x,y:yb}, { color:C.ink, lw:2.5 });
                   const d = yb>ya ? 1 : -1;
                   drawPoly([{x:x-fs*0.22,y:yb-d*fs*0.3},{x:x,y:yb},{x:x+fs*0.22,y:yb-d*fs*0.3}], { stroke:C.ink, lw:2.5, open:true });
                   ctx.globalAlpha = 1; };
      const HL = (x,y,t,col,a) => { if(a<=0) return; ctx.globalAlpha = cl(a);
                   ctx.fillStyle = col; ctx.fillRect(x-3, y-fs*0.62, w(t)+6, fs*1.24); ctx.globalAlpha = 1; };
      const UL = (x,y,len,a) => { if(a<=0 || len<=0) return; ctx.globalAlpha = cl(a);
                   drawLine({x:x,y:y+fs*0.66}, {x:x+len,y:y+fs*0.66}, { color:RED, lw:3 }); ctx.globalAlpha = 1; };
      const SL = (x,y,len,a) => { if(a<=0) return; ctx.globalAlpha = cl(a);
                   drawLine({x:x,y:y+fs*0.6}, {x:x+len,y:y+fs*0.6}, { color:'#c9bea3', lw:2, dash:[5,5] }); ctx.globalAlpha = 1; };
      const p = []; for(let j=0;j<FSTEP.length;j++) p.push(P(j));

      // ⑮ さいごの 黄色い わく（いちばん 下に かく）
      if(p[14] > 0){
        const bx = xLabR - w(LAB2) - fs*0.4, bw = xB + w('半径×3.14') + fs*0.4 - bx;
        ctx.globalAlpha = E(p[14]); boxR(bx, y2-fs*0.85, bw, fs*1.7, 12, '#fff36b', '#e8b52e'); ctx.globalAlpha = 1;
      }
      // ① 長方形の 面積 ＝ たて × 横
      const a1 = E(p[0]);
      T(xLabR, y1, LAB1, C.ink, a1, 'right'); T(xEq, y1, '＝', C.ink, a1);
      T(xA, y1, 'たて', MAG, a1); T(xX, y1, '×', C.ink, a1); T(xB, y1, '横', GRN, a1);
      // ② ↓ 円の 面積 ＝ ＿ × ＿
      const a2 = E(p[1]);
      AR(xLabR - w(LAB1)/2, aTop, aBot, a2);
      T(xLabR, y2, LAB2, C.ink, a2, 'right'); T(xEq, y2, '＝', C.ink, a2); T(xX, y2, '×', C.ink, a2);
      SL(xA, y2, w('半径'), a2*(1-E(p[2])));
      SL(xB, y2, w('円周の 半分'), a2*(1-E(p[3])));
      // ③ たて → 半径
      AR(xA + w('たて')/2, aTop, aBot, E(p[2]*2));
      T(xA, y2, '半径', MAG, E((p[2]-0.4)/0.6));
      // ④ 横 → 円周の 半分
      AR(xB + w('横')/2, aTop, aBot, E((p[2]-0.5)/0.5));            // 横を きく 前から 出しておく
      const fadeB = 1 - E(p[10]/0.5);
      const aB = E((p[3]-0.4)/0.6) * fadeB;
      const fadeHL = 1 - E(p[9]/0.44);
      HL(xB, y2, '円周', PINK, E(p[5]) * fadeHL * fadeB);                 // ⑥ 円周 に 色
      HL(xB + w('円周'), y2, 'の 半分', BLU, E(p[8]) * fadeHL * fadeB);   // ⑨ の半分 → ÷2
      T(xB, y2, '円周', GRN, aB); T(xB + w('円周'), y2, 'の 半分', GRN, aB);
      UL(xB, y2, w('円周の 半分')*E(p[4]), p[4]>0 ? fadeHL : 0);           // ⑤ 赤い 線
      // ⑦ ↓   ⑧ 直径×3.14   ⑨ ÷2   ⑩ 直径÷2×3.14 に ならべかえ   ⑪ ↑ 上の 行へ
      const xBc = xB + w('円周の 半分')/2;
      AR(xBc, bTop, bBot, E(p[6]) * (p[10]>0 ? 0 : 1));
      AR(xBc, bBot, bTop, E(p[10]/0.3) * (1 - E((p[10]-0.75)/0.25)));
      const wD = w('直径'), wM = w('×3.14'), wV = w('÷2');
      const sw = E(p[9]/0.44);                                            // ⑩「▶ つづき」で 動く（1.2秒 → 1.5秒 とまる）
      const mv = E((p[10]-0.3)/0.7);
      const yL = y3 + (y2-y3)*mv;
      const a3 = E(p[7]);
      const fadeD = 1 - E(p[13]/0.35);                                     // ⑭で 直径÷2 が きえる
      HL(xB, y3, '直径×3.14', PINK, a3 * (1-E(p[8])));
      HL(xB + wD + wM, y3, '÷2', BLU, E(p[8]) * (1-sw));
      const xM  = xB + wD + wV*sw;
      const xM2 = xM + (xB + w('半径') - xM) * E((p[13]-0.6)/0.4);
      const xV  = xB + wD + wM*(1-sw);
      T(xB, yL, '直径', C.ink, a3*fadeD);
      T(xV, yL + fs*0.65*Math.sin(Math.PI*sw), '÷2', C.ink, E(p[8])*fadeD);
      T(xM2, yL, '×3.14', C.ink, a3);
      // ⑫ 直径÷2 に 赤い 線   ⑬ ↓ 半径   ⑭ 半径が 上の 行へ
      UL(xB, y2, w('直径÷2')*E(p[11]), p[11]>0 ? fadeD : 0);
      const xDc = xB + w('直径÷2')/2;
      AR(xDc, bTop, bBot, E(p[12]*2) * (1 - E(p[13]/0.3)));
      AR(xDc, bBot, bTop, E((p[13]-0.25)/0.15) * (1 - E((p[13]-0.8)/0.2)));
      const mv2 = E((p[13]-0.35)/0.45);
      T(xB, y3 + (y2-y3)*mv2, '半径', C.ink, E((p[12]-0.4)/0.6));
    },
    guide(){
      if(phase==='a') return '「分ける 数」を ふやすと、どんどん 長方形に 近づくよ。';
      if(phase==='b') return '「▶ もう一度」で 円に もどして、ピンクの 線（たて）が 円の どこか 見よう。';
      if(phase==='c') return '緑の 線（横）は、円の まわり（円周）の どれだけかな？';
      if(phase==='d') return '円周 ＝ 直径×3.14。円周の 半分は 直径×3.14÷2 ＝ 直径÷2×3.14 だね。';
      return 'たて × 横 ＝ 半径 × 円周の 半分 ＝ 半径 × 半径 × 3.14。公式が できたね！';
    },
    hint(){
      if(phase==='a') return '64こに 分けて ならべかえると、上と 下が まっすぐに 近づくよ。';
      if(phase==='b') return 'ピンクの 線は、円の 中心から まわりまでの 長さだよ。';
      if(phase==='c') return '緑の 線は 青い 部品の 弧。円周の 半分は 青、のこりの 半分は 赤だね。';
      if(phase==='d') return '直径の 半分の 長さだよ。図の ピンクの 線を 見てみよう。';
      return null;
    },
    check(i){
      const list = data.sh[phase]; if(!list) return null;
      if(this.busy()) return { ok:false, skip:true, msg:'👀 動きが おわってから えらぼう' };
      if(list[i] !== KQ[phase][0]){
        const ng = { a:'もっと こまかく 分けると どう なるかな？ 64こで 見てみよう 🔍',
                     b:'たては おうぎ形の 辺の 長さ。「もう一度」で たしかめよう 🔍',
                     c:'横には、円の まわりの どれだけが ならんでいるかな？ 🔍',
                     d:'直径の 半分の 長さは 何かな？ 🔍' }[phase];
        return { ok:false, msg:ng };
      }
      const nx = { a:'b', b:'c', c:'d', d:'done' }[phase];
      const now = Date.now();
      if(nx==='b'){ this.startSeq('frame', 300); this.fs = 0; this.ft = now + 300 + 800 + 700 + 800; }
      if(nx==='c'){ this.fs = 2;  this.ft = now; }
      if(nx==='d'){ this.fs = 3;  this.ft = now; this.held = true; }
      if(nx==='done'){ this.fs = 12; this.ft = now; }
      phase = nx;
      if(nx==='done') return { ok:true, msg:'せいかい！ 公式が できた 🎉' };
      againChoices(this, nx);
      return { ok:true, done:false, msg:{ b:'長方形！ ⭕ たてと 横を 見てみよう', c:'半径！ ⭕ つぎは 横の 長さ', d:'円周の 半分！ ⭕ 式を 見てみよう' }[nx] };
    }
  },
  /* ---------- 面積・円周・直径（半径が わかる 円 → 式を かく） ----------
     面積 ＝ 半径×半径×3.14、円周 ＝ 半径×2×3.14、直径 ＝ 半径×2（数の 順番は どれでも よい）。はなまるが きえて 1秒 たつと つぎの 円 */
  msc: {
    icon:'📏', label:'面積・円周・直径',
    input:'expr', ops:['×'], dec:true, pi:true,
    lastK:'', lastR:0,
    KN:{ men:'面積', shu:'円周の 長さ', choku:'直径' },
    get unit(){ return data.kind==='men' ? 'cm²' : 'cm'; },
    want(k){ const r = data.r; return k==='men' ? [r, r, 3.14] : k==='shu' ? [r, 2, 3.14] : [r, 2]; },   // 正しい 式の 数
    setup(){
      do{ data.kind = pick(['men','shu','choku']); }while(data.kind===this.lastK);   // 同じ 問題は つづけない
      this.lastK = data.kind;
      do{ data.r = rnd(1,10); }while(data.r===this.lastR);
      this.lastR = data.r;
      const r = data.r;
      data.ans = data.kind==='men' ? r*r*PI_ : data.kind==='shu' ? r*2*PI_ : r*2;
      phase = 'ask';
    },
    draw(){
      const k = data.kind, done = phase==='done', u = k==='men' ? 'cm²' : 'cm';
      const sty = { fill:'#fffbe8', stroke:C.coral, lw:8 };   // 面積・円周・直径 とも 同じ 赤い 円
      circleScene(['半径 '+data.r+'cm の 円の', this.KN[k]+'を 求める 式は？'], done ? C.ok : C.coral, 'en', 'r', data.r, sty);
      const f = fitTo([{x:-1,y:-1},{x:1,y:1}], regionUnder(2, 0.08, 0.92, 0.96), 30);   // circleScene と 同じ 大きさ・位置
      const c = f.tf({x:0,y:0}), R = f.s, fs = Math.max(16, Math.min(26, R*0.16));
      if(done) drawText(c.x, c.y - R*0.45, fmt(data.ans)+u, { size:fs*1.15, color:C.ok });   // 答えは 円の 上の ほうに（はなまるに かからない）
    },
    guide(){
      const k = data.kind;
      if(phase==='done') return this.want(k).join(' × ')+' ＝ '+fmt(data.ans)+(k==='men' ? 'cm²' : 'cm')+'。';
      return '半径 '+data.r+'cm の 円の '+this.KN[k]+'を 求める 式を かこう。'+(k==='choku' ? '' : '3.14 は テンキーの「3.14」で 入れられるよ。');
    },
    hint(){
      if(phase==='done') return null;
      return { men:'面積 ＝ 半径 × 半径 × 3.14', shu:'円周 ＝ 直径 × 3.14 ＝ 半径 × 2 × 3.14', choku:'直径 ＝ 半径 × 2' }[data.kind];
    },
    check(ex){
      if(phase!=='ask') return null;
      const form = { ok:false, skip:true, msg:'「5×5×3.14」の ように 入力してね' };
      const t = ex.match(/\d+(?:\.\d+)?|×/g);
      if(!t || t.join('')!==ex || t.length%2===0) return form;
      for(let i=0;i<t.length;i++) if(i%2===0 ? !/^\d/.test(t[i]) : t[i]!=='×') return form;
      if(t.length===1) return { ok:false, skip:true, msg:'答えでは なく 式を かこう' };
      const nums = t.filter((x,i) => i%2===0).map(parseFloat);
      const v = nums.reduce((a,b) => a*b, 1);
      const key = arr => arr.map(x => fmt(x)).sort().join('|');
      const is = kk => key(nums)===key(this.want(kk));
      const k = data.kind, has314 = nums.some(x => same(x, 3.14));
      if(is(k)){ phase = 'done'; return { ok:true, msg:'せいかい！ ＝ '+fmt(data.ans)+(k==='men' ? 'cm²' : 'cm')+' 🎉' }; }
      if(same(v, data.ans)) return { ok:false, skip:true, msg:'答えは 合って いるよ。「'+this.want(k).join('×')+'」の 形で かこう' };   // 10×3.14 など（ミスに 数えない）
      if(k==='choku' && has314)    return { ok:false, msg:'直径に 3.14 は いらないよ。直径 ＝ 半径 × 2 🔍' };
      if(k!=='men' && is('men'))   return { ok:false, msg:'それは 面積の 式だよ。'+(k==='shu' ? '円周は 半径 × 2 × 3.14' : '直径は 半径 × 2')+' 🔍' };
      if(k!=='shu' && is('shu'))   return { ok:false, msg:'それは 円周の 式だよ。'+(k==='men' ? '面積は 半径 × 半径 × 3.14' : '直径は 半径 × 2')+' 🔍' };
      if(k==='shu' && is('choku')) return { ok:false, msg:'それは 直径。円周は 直径 × 3.14 だよ 🔍' };
      if(k==='men' && key(nums)===key([data.r, data.r])) return { ok:false, msg:'円周率 3.14 を かけよう 🔍' };
      if(k==='men' && key(nums)===key([data.r, 3.14]))   return { ok:false, msg:'半径は 2回 かけるよ 🔍' };
      return { ok:false, msg:'式を 見なおそう 🔍' };
    }
  },

  /* ---------- 公式の 練習（先生の 映像「復習」：（ □ ）に 入る ことばを えらぶ） ----------
     図は 160×100 の 仮の座標：上に 問い、まん中に ならべかえた 形（右上に 円）と ア・イ、下に（ □ ）の ある 文 */
  kren: {
    icon:'✍️', label:'練習',
    input:'choice', lastQ:-1,
    setup(){
      do{ data.q = rnd(0, KREN.length-1); }while(data.q===this.lastQ);   // 同じ 問題は つづけない
      this.lastQ = data.q;
      data.b = 0; data.opts = this.mixOpts();
      phase = 'ask';
    },
    redo(){ data.b = 0; data.opts = this.mixOpts(); phase = 'ask'; },
    mixOpts(){                                         // 選択肢を まぜる。同じ 問題の 中で ことばが 同じ（ □ ）は、ボタンの 場所も 同じに する
      const key = op => op.slice().sort().join('|'), made = {};
      return KREN[data.q].bl.map(b => { const k = key(b.op); if(!made[k]) made[k] = shuffle(b.op.slice()); return made[k]; });
    },
    prompt(){ return '<span class="pq">'+(phase==='done' ? 'できたね！' : '（　）に 入る ことばを えらぼう。')+'</span>'; },
    choices(){ choiceTate(false); return (data.opts[data.b] || data.opts[0]).map(t => '<span class="cm">'+t+'</span>'); },
    draw(){
      const k = Math.min(W/160, H/100), ox = (W-160*k)/2, oy = (H-100*k)/2;
      ctx.save();
      ctx.setTransform(DPR*k, 0, 0, DPR*k, DPR*ox, DPR*oy);
      try{ this.scene(); } finally { ctx.restore(); }
    },
    scene(){
      const Q = KREN[data.q], done = phase==='done';
      const B = done ? null : Q.bl[data.b], mk = B ? B.mark : '';
      const BLUE = '#1aa3e8', RED = '#e8121e', NAVY = '#1d3d8f';
      /* 問い */
      ctx.font = '900 6.4px "Yusei Magic",sans-serif';
      const hw = ctx.measureText(Q.head).width, hs = hw > 112 ? 6.4*112/hw : 6.4;   // 円に かからない ように（右はし 118 まで）
      drawText(6, 8, Q.head, { size:hs, color:C.ink, align:'left', halo:false });
      /* ならべかえた 形（青い おうぎ形が 下 向き、赤い おうぎ形が 上 向き） */
      const x0 = 22, x1 = 136, y0 = 27, y1 = 61, N = 24, w = (x1-x0)/N;
      ctx.fillStyle = RED; ctx.fillRect(x0, y0, x1-x0, y1-y0);
      ctx.fillStyle = BLUE; ctx.strokeStyle = 'rgba(20,40,90,.45)'; ctx.lineWidth = 0.15; ctx.lineJoin = 'miter';
      for(let i=0;i<N;i++){
        ctx.beginPath(); ctx.moveTo(x0+i*w, y0); ctx.lineTo(x0+(i+1)*w, y0); ctx.lineTo(x0+(i+0.5)*w, y1); ctx.closePath();
        ctx.fill(); ctx.stroke();
      }
      ctx.setLineDash([]); ctx.lineWidth = 0.9; ctx.strokeStyle = NAVY; ctx.strokeRect(x0, y0, x1-x0, y1-y0);
      /* 右上の 円（上が 青・下が 赤） */
      const cc = { x:141, y:20 }, cr = 17, M2 = 48;
      ctx.beginPath(); ctx.moveTo(cc.x, cc.y); ctx.arc(cc.x, cc.y, cr, Math.PI, Math.PI*2); ctx.closePath(); ctx.fillStyle = BLUE; ctx.fill();
      ctx.beginPath(); ctx.moveTo(cc.x, cc.y); ctx.arc(cc.x, cc.y, cr, 0, Math.PI); ctx.closePath(); ctx.fillStyle = RED; ctx.fill();
      ctx.beginPath();
      for(let i=0;i<M2;i++){ const t = i*2*Math.PI/M2; ctx.moveTo(cc.x, cc.y); ctx.lineTo(cc.x+cr*Math.cos(t), cc.y+cr*Math.sin(t)); }
      ctx.lineWidth = 0.12; ctx.strokeStyle = 'rgba(20,40,90,.5)'; ctx.stroke();
      ctx.beginPath(); ctx.arc(cc.x, cc.y, cr, 0, Math.PI*2); ctx.lineWidth = 0.3; ctx.stroke();
      /* ア（たて）・イ（横）の 点線と 名前。いま 考えて いる ほうは 赤く */
      const curve = (p0, c, p1, on) => { ctx.beginPath(); ctx.moveTo(p0.x, p0.y); ctx.quadraticCurveTo(c.x, c.y, p1.x, p1.y);
        ctx.setLineDash(on ? [] : [1.2,1]); ctx.lineWidth = on ? 0.9 : 0.4; ctx.strokeStyle = on ? C.coral : '#333'; ctx.stroke(); ctx.setLineDash([]); };
      const tag = (x, y, t, on) => { ctx.beginPath(); ctx.arc(x, y, 4.2, 0, Math.PI*2); ctx.fillStyle = on ? '#ffe3dc' : '#fff'; ctx.fill();
        ctx.lineWidth = on ? 0.8 : 0.5; ctx.strokeStyle = on ? C.coral : '#333'; ctx.stroke();
        drawText(x, y+0.2, t, { size:5.2, color: on ? C.coral : '#222', halo:false }); };
      curve({ x:x0, y:y0 }, { x:x0-16, y:(y0+y1)/2 }, { x:x0, y:y1 }, mk==='a');
      curve({ x:x0, y:y0 }, { x:78, y:6 }, { x:cc.x-cr+1, y:cc.y+3 }, mk==='i');
      tag(x0-8.5, (y0+y1)/2, 'ア', mk==='a');
      tag(78, 15.5, 'イ', mk==='i');
      /* （ □ ）の ある 文 */
      const fs = 6.6;
      ctx.font = '900 '+fs+'px "Yusei Magic",sans-serif';
      const tw = t => ctx.measureText(t).width;
      const bw = i => Math.max(...Q.bl[i].op.map(tw)) + 5;
      const pulse = 0.55 + 0.45*Math.sin(Date.now()/260);
      Q.lines.forEach((ln, li) => {
        if(!done && data.b < ln.from) return;
        const y = 76 + li*12;
        ctx.font = '900 '+fs+'px "Yusei Magic",sans-serif';
        const ws = ln.tk.map(t => typeof t==='number' ? bw(t) : tw(typeof t==='string' ? t : t.t));
        let x = 80 - ws.reduce((s,v) => s+v, 0)/2;
        ln.tk.forEach((t, j) => {
          if(typeof t==='number'){
            if(done || t < data.b) drawText(x+ws[j]/2, y, Q.bl[t].a, { size:fs, color:C.coral, halo:false });   // うまった（ □ ）
            else{
              rrPath(x+0.6, y-4.3, ws[j]-1.2, 8.6, 1.6); ctx.fillStyle = '#fff35c'; ctx.fill();
              if(t===data.b){ ctx.lineWidth = 0.7; ctx.strokeStyle = 'rgba(232,93,59,'+pulse.toFixed(2)+')'; ctx.stroke(); }
            }
          }else{
            const s = typeof t==='string' ? t : t.t;
            drawText(x, y, s, { size:fs, color:C.ink, align:'left', halo:false });
            if(t.w){                                     // 赤い 波線
              ctx.beginPath();
              for(let q=0;q<=16;q++){ const xx = x + ws[j]*q/16, yy = y + 4.6 + 0.6*Math.sin(q*Math.PI/2); q ? ctx.lineTo(xx, yy) : ctx.moveTo(xx, yy); }
              ctx.lineWidth = 0.45; ctx.strokeStyle = RED; ctx.stroke();
            }
          }
          x += ws[j];
        });
      });
    },
    guide(){ const Q = KREN[data.q]; return phase==='done' ? Q.fin : Q.bl[data.b].g; },
    hint(){ return phase==='done' ? null : KREN[data.q].bl[data.b].h; },
    check(i){
      if(phase!=='ask') return null;
      const Q = KREN[data.q], B = Q.bl[data.b], t = data.opts[data.b][i];
      if(t !== B.a) return { ok:false, msg:(B.ng && B.ng[t]) || 'もう一度 図を 見て 考えよう 🔍' };
      data.b++;
      if(data.b >= Q.bl.length){ phase = 'done'; return { ok:true, msg:'せいかい！ 🎉' }; }
      againChoices(this, 'ask');
      return { ok:true, done:false, msg:B.a+' ⭕ つぎの（　）は？' };
    }
  },

  /* ---------- 面積と 円周（□に 入る 数 → 答え） ---------- */
  kurabe: {
    icon:'🔁', label:'面積と 円周',
    tbl:true,                                          // 🧮 3.14の 表
    input:'number', dec:true,
    steps:['□に 入る 数','答えを 計算'],
    meth:'mix',                                        // 'mix' / 'men'＝面積 / 'shu'＝円周
    get ctlHtml(){ return segHtml(this, [['mix','まぜる'],['men','面積'],['shu','円周の 長さ']]); },
    onCtl(btn){ segCtl(this, btn); },
    get ansLabel(){ return phase==='box' ? '□' : 'こたえ'; },
    get unit(){ return phase==='box' ? '' : (data.kind==='men' ? 'cm²' : 'cm'); },
    setup(){
      data.kind = this.meth==='mix' ? pick(['men','shu']) : this.meth;
      data.r    = rnd(2,10);
      data.box  = data.kind==='men' ? data.r : 2;
      data.ans  = data.kind==='men' ? data.r*data.r*PI_ : data.r*2*PI_;
      phase = 'box';
    },
    step(){ return phase==='box' ? 0 : phase==='ans' ? 1 : 2; },
    prompt(){
      const bx = phase==='box' ? '□' : String(data.box);
      const tail = phase==='done' ? ' ＝ '+fmt(data.ans) : (phase==='ans' ? ' ＝ □' : '');
      return '<span class="pf">'+data.r+' × '+bx+' × 3.14'+tail+'</span>';
    },
    draw(){
      const m = data.kind==='men';
      const hs = hintOn && phase==='ans';                     // ヒント：3.14 × □ の 筆算を 右に
      if(!hs) this.ht = 0; else if(!this.ht) this.ht = Date.now();
      circleScene(['半径 '+data.r+'cm の 円の', m ? '面積 は？' : '円周の 長さ は？'],
        phase==='done' ? C.ok : C.coral, 'en', 'r', data.r,
        { fill: m ? '#ffd98a' : '#fffbe8', stroke: m ? C.ink : C.coral, lw: m ? 3 : 8,
          ans: phase==='done' ? fmt(data.ans)+(m ? 'cm²' : 'cm') : null });
      if(hs){                                                  // 円は うごかさず、円の 右の あいた ところに
        const rg = regionUnder(2, 0.08, 0.92, 0.96);
        const R  = Math.max(10, Math.min((rg.x1-rg.x0)-60, (rg.y1-rg.y0)-60) / 2);
        drawHissan(data.r*data.box, { x0:W/2+R+12, y0:rg.y0, x1:W-8, y1:rg.y1 }, this.ht);
      }
    },
    guide(){
      const m = data.kind==='men';
      if(phase==='box') return m ? '面積の 公式は 半径×半径×円周率。□に 入る 数は？'
                                 : '円周の 公式は 直径×円周率。直径は 半径×2 だね。□に 入る 数は？';
      if(phase==='ans') return '式を 計算して 答えを 入れよう。小数点は「．」で 入れるよ。';
      return m ? '面積 ＝ 半径×半径×円周率 だね！' : '円周 ＝ 直径×円周率（半径×2×3.14）だね！';
    },
    hint(){
      const m = data.kind==='men';
      if(phase==='box') return m ? '面積 ＝ 半径 × 半径 × 円周率' : '円周 ＝ 直径 × 円周率 ＝ 半径 × 2 × 円周率';
      if(phase==='ans') return data.r+' × '+data.box+' ＝ '+(data.r*data.box)+'。それに 3.14 を かけよう。筆算は 図の 右を 見てね。';
      return null;
    },
    check(v){
      const r = data.r, m = data.kind==='men';
      if(phase==='box'){
        if(same(v, data.box)){ nextPhase('ans'); return { ok:true, done:false, msg:'□は '+data.box+' ⭕ つぎは 答え' }; }
        if(m && same(v,2))  return { ok:false, msg:'それは 円周の 式だよ。面積は 半径×半径×円周率 🔍' };
        if(!m && same(v,r)) return { ok:false, msg:'それは 面積の 式だよ。円周は 直径×円周率 🔍' };
        return { ok:false, msg:'公式を 思い出そう 🔍' };
      }
      if(phase!=='ans') return null;
      if(same(v, data.ans)){ phase='done'; return { ok:true, msg:'せいかい！ '+fmt(data.ans)+(m?'cm²':'cm')+' 🎉' }; }
      if(same(v, r*data.box)) return { ok:false, msg:'3.14 を かけるのを わすれていないかな？ 🔍' };
      if(dotMiss(v, data.ans)) return { ok:false, msg:'小数点の 位置を たしかめよう 🔍' };
      return { ok:false, msg:'計算を 見なおそう 🔍' };
    },
    redo(){ phase = phase0; applyInputUI(); }
  },

  /* ---------- 円の 面積・半円など・ランダム（式を つくる → 自動で 計算） ---------- */
  enm:   shikiMode({ icon:'⭕', label:'円の 面積', kinds:['r','d'],                 order:'alt' }),   // 半径 → 直径 → 半径 … と 交互
  hanen: shikiMode({ icon:'🌓', label:'半円など',  kinds:['han','yon'],             order:'alt' }),   // 半円 → 4分の1の 円 … と 交互
  enrnd: shikiMode({ icon:'🎲', label:'ランダム',  kinds:['r','d','han','yon'],     order:'rnd' }),

  /* ---------- 円の 面積（半径 / 直径） ---------- */
  menseki: {
    icon:'⭕', label:'円の 面積',
    input:'number', dec:true,
    steps:['半径を 見る','面積を 計算'],
    meth:'han',                                        // 'han'＝半径 / 'choku'＝直径 / 'mix'
    get ctlHtml(){ return segHtml(this, [['han','半径が わかる'],['choku','直径が わかる'],['mix','まぜる']]); },
    onCtl(btn){ segCtl(this, btn); },
    get ansLabel(){ return phase==='r' ? '半径' : 'こたえ'; },
    get unit(){ return phase==='r' ? 'cm' : 'cm²'; },
    setup(){
      data.kind = this.meth==='mix' ? pick(['han','choku']) : this.meth;
      data.r = rnd(1,10); data.d = data.r*2;
      data.ans = data.r*data.r*PI_;
      phase = data.kind==='choku' ? 'r' : 'ans';
    },
    step(){ return phase==='r' ? 0 : phase==='ans' ? 1 : 2; },
    draw(){
      const ch = data.kind==='choku';
      const L = [ (ch ? '直径 '+data.d : '半径 '+data.r)+'cm の 円の 面積は？',
                  phase==='r' ? 'まず 半径を もとめよう' : '半径 × 半径 × 円周率' ];
      circleScene(L, phase==='done' ? C.ok : C.coral, 'en', ch ? 'd' : 'r', ch ? data.d : data.r,
                  { ans: phase==='done' ? fmt(data.ans)+'cm²' : null });
    },
    guide(){
      if(phase==='r')   return '直径が かいて あるね。まず 半径を もとめよう。';
      if(phase==='ans') return '半径 × 半径 × 円周率（3.14）で 計算しよう。小数点は「．」で 入れるよ。';
      return '面積の 公式、ばっちりだね！';
    },
    hint(){
      if(phase==='r')   return '半径 ＝ 直径 ÷ 2 → '+data.d+' ÷ 2';
      if(phase==='ans') return data.r+' × '+data.r+' × 3.14';
      return null;
    },
    check(v){
      const r = data.r;
      if(phase==='r'){
        if(same(v, r)){ nextPhase('ans'); return { ok:true, done:false, msg:'半径は '+r+'cm ⭕ つぎは 面積' }; }
        if(same(v, data.d)) return { ok:false, msg:'それは 直径だよ。半径は 直径 ÷ 2 🔍' };
        return { ok:false, msg:'直径 ÷ 2 ＝ 半径 だよ 🔍' };
      }
      if(phase!=='ans') return null;
      if(same(v, data.ans)){ phase='done'; return { ok:true, msg:'せいかい！ '+fmt(data.ans)+'cm² 🎉' }; }
      if(same(v, data.d*data.d*PI_)) return { ok:false, msg:'直径で 計算して いるよ。半径 × 半径 × 円周率 🔍' };
      if(same(v, data.d*PI_))        return { ok:false, msg:'それは 円周の 長さだよ。面積は 半径×半径×円周率 🔍' };
      if(same(v, r*r))               return { ok:false, msg:'円周率 3.14 を かけよう 🔍' };
      if(same(v, r*PI_))             return { ok:false, msg:'半径は 2回 かけるよ 🔍' };
      if(dotMiss(v, data.ans))       return { ok:false, msg:'小数点の 位置を たしかめよう 🔍' };
      return { ok:false, msg:'計算を 見なおそう 🔍' };
    },
    redo(){ phase = phase0; applyInputUI(); }
  },

  /* ---------- 式を かく ---------- */
  shiki: {
    icon:'✏️', label:'式を かく',
    input:'expr', ops:['×','÷'], dec:true,
    meth:'en',                                         // 'en'＝円 / 'bubun'＝半円・4分の1の 円
    get ctlHtml(){ return segHtml(this, [['en','円'],['bubun','円の 一部']]); },
    onCtl(btn){ segCtl(this, btn); },
    setup(){
      if(this.meth==='bubun'){
        data.part = pick(['han','yon']);
        data.r = data.part==='yon' ? 2*rnd(1,5) : rnd(1,10);
        data.lab = 'r';
      }else{
        data.part = 'en'; data.lab = pick(['r','d']); data.r = rnd(1,10);
      }
      data.div = data.part==='han' ? 2 : data.part==='yon' ? 4 : 1;
      data.ans = data.r*data.r*PI_/data.div;
      phase = 'ask';
    },
    draw(){
      const nm = data.part==='en' ? '円' : data.part==='han' ? '半円' : '円を 4等分した 形';
      circleScene(['この '+nm+'の 面積を もとめる','式を かこう'], phase==='done' ? C.ok : C.coral,
                  data.part, data.lab, data.lab==='d' ? data.r*2 : data.r,
                  { ans: phase==='done' ? '＝ '+fmt(data.ans)+'cm²' : null });
    },
    guide(){
      if(phase==='done') return 'そのとおり！ 式が かけたね。';
      return '3.14 は「3」「．」「1」「4」の じゅんに 入れるよ。' + (data.part!=='en' ? ' 円の 何分の いくつかな？' : '');
    },
    hint(){
      if(data.part==='han') return '円の 面積 ÷ 2 → 半径 × 半径 × 3.14 ÷ 2';
      if(data.part==='yon') return '円の 面積 ÷ 4 → 半径 × 半径 × 3.14 ÷ 4';
      return '半径 × 半径 × 3.14' + (data.lab==='d' ? '（半径は 直径 ÷ 2）' : '');
    },
    check(ex){
      if(phase==='done') return null;
      const t = ex.match(/\d+(?:\.\d+)?|[×÷]/g);
      if(!t || t.join('')!==ex || t.length%2===0) return { ok:false, skip:true, msg:'「5×5×3.14」の ように 入力してね' };
      let v = null, op = null; const nums = [];
      for(let i=0;i<t.length;i++){
        if(i%2===0){
          if(!/^\d/.test(t[i])) return { ok:false, skip:true, msg:'「5×5×3.14」の ように 入力してね' };
          const n = parseFloat(t[i]); nums.push(n);
          if(v===null) v = n; else if(op==='×') v *= n; else { if(n===0) return { ok:false, skip:true, msg:'0 で わる ことは できないよ' }; v /= n; }
        }else{
          if(!/^[×÷]$/.test(t[i])) return { ok:false, skip:true, msg:'「5×5×3.14」の ように 入力してね' };
          op = t[i];
        }
      }
      if(t.length===1) return { ok:false, skip:true, msg:'答えでは なく 式を かこう' };
      const r = data.r, has314 = nums.some(n=> same(n, 3.14));
      if(same(v, data.ans) && has314){ phase='done'; return { ok:true, msg:'せいかい！ '+fmt(data.ans)+'cm² 🎉' }; }
      if(!has314) return { ok:false, msg:'円周率 3.14 が 入って いないよ 🔍' };
      if(same(v, 4*r*r*PI_/data.div)) return { ok:false, msg:'直径で 計算して いるよ。半径は 直径 ÷ 2 🔍' };
      if(same(v, 2*r*PI_) || same(v, 2*r*PI_/data.div)) return { ok:false, msg:'それは 円周の 式だよ。面積は 半径×半径×円周率 🔍' };
      if(data.div>1 && same(v, r*r*PI_)) return { ok:false, msg:'円 まるごとの 面積に なって いるよ。÷'+data.div+' しよう 🔍' };
      return { ok:false, msg:'式を 見なおそう 🔍' };
    }
  },

        drawSideLabel(BL, BR, (2*a)+'cm', Object.assign({ away:c }, lab));

    guide(){

      if(phase==='p2') return data.k==='ura1'  ? '長方形から ひく 白い 部分は、4分の1の 円 2つ分。'
                            : data.k==='happa' ? '4分の1の 円から 三角形を ひくと、葉っぱの 半分に なるよ。'
                            :                    '正方形から ひく 白い 部分は、4分の1の 円。';
      if(phase==='p3') return data.k==='happa' ? '①−② が 葉っぱの 半分。それを 2つ分 にしよう。' : '①から ②を ひこう。';
      return K.name+'の 面積が もとめられたね！';

    hint(){
      const a = data.a;
      if(phase==='p1') return data.k==='ura1'  ? '長方形 ＝ たて × よこ → '+a+' × '+(2*a)
                            : data.k==='happa' ? '半径 '+a+'cm の 円の 4分の1 → '+a+' × '+a+' × 3.14 ÷ 4'
                            :                    '正方形 ＝ 1辺 × 1辺 → '+a+' × '+a;
      if(phase==='p2') return data.k==='ura1'  ? '4分の1の 円 2つ ＝ 円の 半分 → '+a+' × '+a+' × 3.14 ÷ 2'
                            : data.k==='happa' ? '直角三角形 → '+a+' × '+a+' ÷ 2'
                            :                    a+' × '+a+' × 3.14 ÷ 4';
      if(phase==='p3') return data.k==='happa' ? '（'+fmt(data.v1)+' − '+fmt(data.v2)+'）× 2'
                                               : fmt(data.v1)+' − '+fmt(data.v2);
      return null;
    },
    check(v){
      if(phase==='done' || !phase) return null;
      const K = KUMI[data.k];
      if(same(v, data.ans)){ phase='done'; return { ok:true, msg:'せいかい！ '+fmt(data.ans)+'cm² 🎉' }; }
      if(phase==='p1'){
        if(same(v, data.v1)){ nextPhase('p2'); return { ok:true, done:false, msg:'① '+fmt(data.v1)+'cm² ⭕ つぎは ②' }; }
        return { ok:false, msg: dotMiss(v, data.v1) ? '小数点の 位置を たしかめよう 🔍' : K.l1+'の 面積を 計算しよう 🔍' };
      }
      if(phase==='p2'){
        if(same(v, data.v2)){ nextPhase('p3'); return { ok:true, done:false, msg:'② '+fmt(data.v2)+'cm² ⭕ さいごに 色の 部分' }; }
        if(data.k==='ura1' && same(v, data.v2/2)) return { ok:false, msg:'それは 1つ分。2つ分 だよ 🔍' };

      }
      if(data.k==='happa' && same(v, data.v1-data.v2)) return { ok:false, msg:'それは 葉っぱの 半分。2つ分 にしよう 🔍' };
      if(dotMiss(v, data.ans)) return { ok:false, msg:'小数点の 位置を たしかめよう 🔍' };
      return { ok:false, msg:'①と ②を つかって 計算しよう 🔍' };

  /* ---------- 葉っぱの 求め方（先生の 映像：その1・その2） ----------
     上：左＝問題の 図、右＝こうたさんの ア・イ・ウ（面積は 計算ずみ）
     下：式が できるまでを 動かす（LSTEP）。問題に 答えると つぎへ 進む（LGATE）
       その1 … 半分に 切る →（イ − ウ）＝ 半分 → 半分 × 2 ＝ 葉っぱ
       その2 … イを 2つ うつす → 重ねると 葉っぱが 2まい → イ ＋ イ − ア ＝ 葉っぱ */
  leaf: {
    icon:'🍃', label:'葉っぱの 求め方',
    tbl:true,                                          // 🧮 3.14の 表
    dec:true, unit:'cm²', noAutoNext:true, arMin:0.3,   // arMin：横長の 画面では キャンバスを 横に 広げて、筆算を おく 場所を つくる（図の 大きさ・位置は かわらない）
    meth:'m1',                                         // 'm1'＝その1 / 'm2'＝その2
    fs:0, ft:0, first:true,
    get input(){ return phase==='a' ? 'none' : 'number'; },   // a は 問いかけだけ（「▶ 次へ」で 進む）、b・c は 数を 入れる
    get steps(){ return this.meth==='m2' ? ['2つの イ','葉っぱの 面積'] : ['2つの 形','半分の 面積','葉っぱの 面積']; },
    nxT(){ return this.meth==='m2' ? LNEXT2 : LNEXT; },      // だんの 時間（その1／その2）
    stops(){ return this.meth==='m2' ? LSTOP2 : LSTOP; },    // 「▶ 次へ」を 待つ だん
    get ansLabel(){ return (this.meth==='m1' && phase==='b') ? '半分' : 'こたえ'; },
    get ctlHtml(){
      const b = (m,t) => '<button data-m="'+m+'"'+(this.meth===m?' class="on"':'')+'>'+t+'</button>';
      return '<div class="seg2">'+b('m1','その1（半分 × 2）')+b('m2','その2（イ ＋ イ − ア）')+
             '<button data-go="1" class="go">▶ もう一度 見る</button>'+
             '<button data-next="1" class="nx" style="visibility:hidden">▶ 次へ</button></div>';
    },
    onCtl(btn){
      if(btn.dataset.go){ this.fs = 0; this.ft = Date.now(); return; }   // はじめから いまの ところまで もう一度
      if(btn.dataset.next){                            // 「▶ 次へ」：えらんだ 形を 1だんずつ
        if(!this.canNext()) return;
        data.n++; data.tn = Date.now();
        const NX = this.nxT();
        if(data.n >= NX.length-1){ this.fs = LGATE[this.meth].a+1; this.ft = Date.now() + NX[data.n]; nextPhase('b'); }   // さいごの だんの あと 式の 数へ
        refresh();
        return;
      }
      if(!btn.dataset.m || btn.dataset.m===this.meth) return;
      segCtl(this, btn); buildSteps(); updateSteps();
    },
    setup(){
      data.a = this.first ? 10 : pick([4,6,8,10]); this.first = false;
      const a = data.a;
      data.vs = a*a; data.vq = a*a*PI_/4; data.vt = a*a/2;
      data.half = data.vq - data.vt; data.ans = data.half*2;
      data.sh = shuffle(LQ[this.meth].slice());
      data.n = 0; data.tn = 0; data.ta = 0;
      this.fs = 0; this.ft = Date.now() + 400;
      phase = 'a';
    },
    redo(){ phase = 'a'; this.fs = 0; this.ft = Date.now() + 300; data.sh = shuffle(LQ[this.meth].slice());
            data.n = 0; data.tn = 0; data.ta = 0; applyInputUI(); },
    /* その1：「▶ 次へ」の だん k の すすみ（0〜1） */
    stg(k){
      const n = data.n || 0;
      if(k < n) return 1; if(k > n) return 0;
      const t = Math.max(0, Math.min(1, (Date.now() - data.tn) / this.nxT()[k])); return t*t*(3-2*t);
    },
    cur(){ return (data.n || 0) > 0; },
    stepBusy(){ return (data.n || 0) > 0 && Date.now() - data.tn < this.nxT()[data.n]; },
    canNext(){
      if(phase!=='a' || this.stepBusy() || this.stops().indexOf(data.n||0) < 0 || (data.n||0) >= this.nxT().length-1) return false;
      const s = this.fState(); return s.k===LGATE[this.meth][phase] && s.q>=1;
    },
    step(){ const s = (this.meth==='m2' ? {a:0,b:1} : {a:0,b:1,c:2})[phase]; return s===undefined ? (this.meth==='m2' ? 2 : 3) : s; },
    fState(){                                          // いまの 段（k）と すすみ（q）
      const seq = LSTEP[this.meth], gate = LGATE[this.meth][phase];
      if(gate===undefined) return { k:-1, q:1 };
      let el = Date.now() - this.ft, k = this.fs;
      if(el < 0) return { k:k, q:0 };
      while(k <= gate){ if(el < seq[k][1]) return { k:k, q:el/seq[k][1] }; el -= seq[k][1]; k++; }
      return { k:gate, q:1 };
    },
    busy(){ const g = LGATE[this.meth][phase]; if(g===undefined) return false; const s = this.fState();
            if(!(s.k===g && s.q>=1)) return true;
            return phase==='a' && this.stepBusy(); },
    prompt(){
      const t = this.meth==='m2'
        ? { a:'イを 2つ つかって、葉っぱの 形の 面積を 求めよう。',
            b:'葉っぱの 形の 面積は 何cm²？' }[phase]
        : { a:'この 図形の 中に、2つの 形が 見えます。どれと どれですか。',
            b:'葉っぱの 半分の 面積は 何cm²？',
            c:'葉っぱの 形の 面積は 何cm²？' }[phase];
      return '<span class="pq">'+(t || '葉っぱの 形 ＝ '+fmt(data.ans)+'cm²')+'</span>';
    },
    choices(){
      choiceTate(this.meth==='m2');
      return (data.sh||[]).map(t => '<span class="cm">'+t+'</span>');
    },
    draw(){
      choicesEl.classList.toggle('wait', this.busy());  // 動いている あいだは 選択肢を うすく・押せなく
      if(phase==='a' && this.stops().indexOf(data.n||0) < 0){   // 「次へ」で 始まったら、つぎの とまる だん（LSTOP・LSTOP2）まで 0.9秒ずつ 間を あけて 自動で 進む
        const s = this.fState(), NX = this.nxT();
        if(s.k===LGATE[this.meth].a && s.q>=1 && !this.stepBusy()){
          if(!data.ta) data.ta = Date.now();
          else if(Date.now() - data.ta >= LAUTO_GAP){
            data.n = (data.n||0) + 1; data.tn = Date.now(); data.ta = 0;
            if(data.n >= NX.length-1){ this.fs = LGATE[this.meth].a+1; this.ft = Date.now() + NX[data.n] + LAUTO_GAP; nextPhase('b'); }   // さいごの だんの あと 式の 数へ
            refresh();

      const nxb = document.querySelector('#ctlRow .nx');
      if(nxb) nxb.style.visibility = this.canNext() ? 'visible' : 'hidden';   // 「▶ 次へ」を 待って いる ときだけ（場所は かえない）
      const k = Math.min(W/160, H/100), ox = (W-160*k)/2, oy = (H-100*k)/2;   // 160×100 の 中に かく（2段）
      this.vL = -ox/k; this.vR = (W-ox)/k;                                      // キャンバスの 左はし・右はし（仮の座標。その2の 式の 段を 広げる）
      ctx.save();
      ctx.setTransform(DPR*k, 0, 0, DPR*k, DPR*ox, DPR*oy);
      try{ this.scene(); } finally { ctx.restore(); }
      const hs = hintOn && ((this.meth==='m1' && phase==='c') || (this.meth==='m2' && phase==='b'));   // ヒント：その1 c ＝ 半分 × 2 の 筆算を 葉っぱの 右に、その2 b ＝ ＋・− の 筆算を こうたさんの わくの 右に（答えの 行まで）

        drawHissanPM(data.vq, data.vq, data.vs, { x0:ox+v0*k, y0:oy+2*k, x1:ox+v1*k, y1:oy+46*k }, this.ht);

        const x0 = ox + (141 + Math.max(2, Math.min(12, R-34)))*k;   // ひろい ときは 12 はなす。せまい ときは 筆算が 小さく なりすぎない ように つめる（図は 動かさない）
        drawHissanD(data.half, 2, { x0:x0, y0:oy+40*k, x1:Math.max(x0+20, Math.min(W-4, x0+46*k)), y1:oy+100*k }, this.ht);
      }
    },
    scene(){
      const m2 = this.meth==='m2', seq = LSTEP[this.meth], st = this.fState();
      const P  = n => { const j = seq.findIndex(x=> x[0]===n); return j < st.k ? 1 : j > st.k ? 0 : st.q; };
      const cl = t => Math.max(0, Math.min(1, t)), E = t => { t = cl(t); return t*t*(3-2*t); };
      const mix = (u, v, t) => u + (v-u)*t;

      const A  = (fn, al) => { if(!(al>0)) return; ctx.globalAlpha = cl(al); fn(); ctx.globalAlpha = 1; };
      const T  = (x, y, t, sz, col, al) => A(()=> drawText(x, y, t, { size:sz, color:col||C.ink, halo:false }), al===undefined ? 1 : al);

      const ANS = (cx, cy, al) => A(()=>{                 // さいごの 答え（黄色い わく）
        const t = fmt(data.ans)+'cm²';
        ctx.font = '900 7.5px "Yusei Magic",sans-serif';
        const w = ctx.measureText(t).width + 4;
        rrPath(cx-w/2, cy-5.6, w, 11.2, 2); ctx.fillStyle = '#fff36b'; ctx.fill();
        ctx.lineWidth = 0.6; ctx.strokeStyle = '#e8b52e'; ctx.stroke();
        drawText(cx, cy, t, { size:7.5, color:C.coral, halo:false });
      }, al);
      const a = data.a;
      const SG = k => this.stg(k);                         // 「▶ 次へ」の だん k の すすみ（0〜1）

      /* ---------- 上の 段：問題の 図（左）・こうたさんの ア・イ・ウ（右） ----------
         その1で「× 2」の 段が 出る ときは、上の 段を けして 式を 上へ よせる（映像と 同じ 2段ずつ） */
      const F = { x:14, y:8, s:34 };

                                     ctx.lineWidth = 0.9; ctx.strokeStyle = LCOL.red; ctx.stroke(); }, al);
      const shR = m2 ? 0 : E(P('row2')/0.4);           // 0＝ふつう … 1＝上の 段が きえて 式が 上へ
      if(shR < 1){

        /* ---------- その1：（イ − ウ）× 2 ---------- */

          const ang = Math.atan2(p1.y-p0.y, p1.x-p0.x), L = 3;

                    {x:q.x-L*Math.cos(ang+0.45), y:q.y-L*Math.sin(ang+0.45)}], { stroke:LCOL.red, lw:0.7, open:true });

          const pw = F.s*1.5, ps = pw/218;

          const hw = F.s*1.55*239/244, hs = hw/239;

        A(()=>{
          const ang = Math.atan2(a1.y-a0.y, a1.x-a0.x);
          ctx.save(); ctx.translate((a0.x+a1.x)/2, (a0.y+a1.y)/2); ctx.rotate(ang); ctx.translate(0, -7);
          ctx.font = '900 9px "Yusei Magic",sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
          ctx.lineWidth = 1.4; ctx.lineJoin = 'round'; ctx.strokeStyle = '#fff'; ctx.strokeText('半分', 0, 0);
          ctx.fillStyle = '#e8121e'; ctx.fillText('半分', 0, 0);
          ctx.restore();
        }, E((pO-0.2)/0.4) * gone);
        A(()=> lshape('half', X.h, y1, s1, { frame:true, mark:false, lw:0.8 }), E((pO-0.45)/0.45));
        // ④ 左にも 半分の 形 → 赤い わくで 目立たせる（「この 図形の 中に 2つの 形」）

        RF(X.q, y1, s1, E(pC/0.5) * (1 - S(1)));

        ARW({ x:IC[1].x+IC[1].s*0.2, y:IC[1].y+IC[1].s+1 }, { x:X.q+s1+1.5, y:y1+1.5 }, S(2), (S(2) > 0 ? 1 : 0) * (1 - S(5)));   // 2 矢印
        A(()=> lshape('q', X.q, y1, s1, { fill:'#ece97c', stroke:LCOL.gray, slw:1.7 }), S(4));                 // 4 ぬる
        A(()=> lshape('q', X.q, y1, s1, { fill:'none', stroke:LCOL.gray, slw:1.7, mark:false }), S(3));        // 3 わくだけ 太く
        if(S(4) > 0) A(()=> drawLine({ x:X.q, y:y1+s1 }, { x:X.q+s1, y:y1 }, { color:'rgba(52,70,95,.35)', lw:0.5 }), S(4));
        RF(X.q, y1, s1, S(5) * (1 - S(6)));                                             // 5 扇形を 赤い わくで

        ARW({ x:IC[2].x+IC[2].s*0.2, y:IC[2].y+IC[2].s+1 }, { x:X.q+s1+1.5, y:y1+s1*0.5 }, S(6), (S(6) > 0 ? 1 : 0) * (1 - S(9)));
        const tx = mix(X.q, X.t, S(9));                                                 // 9 はなす
        A(()=> lshape('tri', tx, y1, s1, { fill:'rgba(98,240,216,.9)', stroke:LCOL.blue, slw:1.7 }), S(8));   // 8 ぬる
        A(()=> lshape('tri', tx, y1, s1, { fill:'none', stroke:LCOL.blue, slw:1.7, mark:false }), S(7));      // 7 わくだけ 太く
        T(X.mn+3.5, y1+s1/2, '−', 12, C.ink, S(10)); T(X.eq+3.5, y1+s1/2, '＝', 12, C.ink, S(10));           // 10「−」「＝」
        // ⑤ ア・イ・ウ と むすんで 78.5 − 50
        const pN = E(P('num1')), la = pN * (1 - E(P('eq1')));
        DL(VA[1], { x:X.q+s1/2, y:y1-1 }, '#222', la);
        DL(VA[2], { x:X.t+s1/2, y:y1-1 }, LCOL.blue, la);
        T(X.q+s1/2, ny1, fmt(data.vq), 7.5, C.ink, pN); T(X.mn+3.5, ny1, '−', 7.5, C.ink, pN); T(X.t+s1/2, ny1, fmt(data.vt), 7.5, C.ink, pN);
        // ⑥ ＝ 28.5

        T(X.eq+3.5, ny1, '＝', 7.5, C.ink, pE); T(X.h+s1/2, ny1, fmt(data.half), 7.5, C.coral, pE);

        if(pR > 0.4){
          const t = E((pR-0.4)/0.3), r2 = E((pR-0.6)/0.2), r3 = E((pR-0.75)/0.25);

          T(X.eq+3.5, yB+s1/2, '＝', 12, C.ink, r3);
